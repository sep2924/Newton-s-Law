{id:'24d', lv:24, title:'Ball Bounce: Maximum Floor Force', make:()=>({
 text:`A [[160 g|m = 0.160 kg|hidden]] ball is [[dropped|v₀ = 0|hidden]] from [[1.7 m|h₁ = 1.7 m]], bounces on a hard floor, and rebounds to [[1.3 m|h₂ = 1.3 m]]. The floor's force is a [[triangle lasting 5.0 ms|Δt = 5.0 ms = 0.0050 s; J = ½ F_max Δt|hidden]]. What maximum force does the floor exert on the ball?`,

  bl('solve','Impulse (+ = up). Keep the signs!',['Δp = 0.160 × (5.048 − (−5.772)) = {} N·s'],[nb(1.731)]),
  bl('law','Area of the triangle.',['J = ½ F_max × {} s','F_max = 2J / Δt'],[nb(0.005)]),
  {type:'num', ph:'solve', prompt:'Maximum force of the floor:', sym:'F_max', unit:'N', ans:2*0.16*(Math.sqrt(2*9.8*1.7)+Math.sqrt(2*9.8*1.3))/0.005, slips:[{v:0.16*(Math.sqrt(2*9.8*1.7)+Math.sqrt(2*9.8*1.3))/0.005,msg:'That is the AVERAGE force. For a triangle, F_max = 2J/Δt.'},{v:2*0.16*(Math.sqrt(2*9.8*1.7)-Math.sqrt(2*9.8*1.3))/0.005,msg:'The ball reverses: Δv = 5.05 − (−5.77), not the difference of the speeds.'}]},
  pr('check','F_max ≈ 690 N is about 440 times the ball\'s weight. Reasonable?',[o('Yes',1),o('No')],[o('a big momentum change in only 5 ms needs a huge force; ignoring gravity during the bounce is justified',1),o('the floor can never push harder than the weight')])

{id:'24e', lv:24, title:'Rocket Delivers the Rescue Package', make:()=>({
 text:`An explorer is stranded across a [[30 m-wide|horizontal distance needed: 30 m]] river at the bottom of a [[200 m-high|drop: 200 m]] cliff. You fire a [[1.1 kg|m_r = 1.1 kg]] rocket [[horizontally at ground level|the rocket hits the package horizontally|hidden]] so that it [[impales itself into|they stick: perfectly inelastic|hidden]] a [[6.0 kg|m_p = 6.0 kg]] package [[sitting at the cliff edge|package starts at rest|hidden]]. What minimum rocket speed just before impact will get the package across the river?`,
 fig: svg(260,230, `<rect x="10" y="40" width="110" height="10" fill="#b9c4c9"/><rect x="110" y="40" width="10" height="180" fill="#b9c4c9"/><rect x="120" y="212" width="130" height="10" fill="#7fb2d8"/>` + `<rect x="98" y="26" width="14" height="14" fill="#d9a057" stroke="#555"/>` + tx(84,20,'6.0 kg','font-size="11"') + ar(30,33,94,33,'R',3) + tx(28,24,'rocket 1.1 kg','font-size="11"') + `<line x1="96" y1="52" x2="96" y2="210" stroke="#333" marker-end="url(#arK)" marker-start="url(#arK)"/>` + tx(58,134,'200 m','font-size="12"') + `<line x1="122" y1="200" x2="200" y2="200" stroke="#333" marker-end="url(#arK)" marker-start="url(#arK)"/>` + tx(150,194,'30 m','font-size="12"') + `<path d="M112,34 Q170,40 200,206" fill="none" stroke="#2a7ab0" stroke-dasharray="5 4"/>` + tx(206,208,'explorer','font-size="11"')),

{id:'23a', lv:23, title:'How to Read the Velocity Graphs', make:()=>({
 text:`In the lab, motion detectors record each cart's velocity. The <b>red</b> curve is cart 1 (Velocity 1) and the <b>blue</b> curve is cart 2 (Velocity 2). [[Positive velocity|moving AWAY from the detector side you defined as +|hidden]] and [[negative velocity|moving the other way|hidden]] tell you the direction. You select a short, flat stretch with the bracket tool and read the [[mean|average of the selected samples|hidden]] in the statistics box.`,

  {type:'mcq', ph:'info', prompt:'Why use the MEAN of a few samples instead of one point?', opts:[o('It averages out the small random wiggles of the detector',1,'A single point can be off by a bump in the track or sensor noise.'),o('The mean is always bigger',0,'It is just more reliable.'),o('The software requires it',0,'It is a choice for accuracy.')]},
  bl('info','Read the four highlighted means in the Activity 2 graph (m/s).',['Before:  cart 1 (red) = {},  cart 2 (blue) = {}','After:  cart 1 (red) = {},  cart 2 (blue) = {}'],[nb(0.4278),nb(0.00443),nb(-0.001215),nb(0.442)],'Tiny values like 0.00443 and −0.001215 mean "essentially at rest", but you still use them as measured.'),
  pr('check','After the collision, cart 1\'s velocity is −0.001215 m/s. What does that mean?',[o('Cart 1 has practically stopped',1),o('Cart 1 bounced back fast')],[o('the size is about 1 mm/s, which is essentially zero',1),o('any negative value means a big rebound')])

{id:'23b', lv:23, title:'Activity 1: Impulse on the Incline', make:()=>({
 text:`A cart of mass [[m₁ = 0.522 kg|m = 0.522 kg]] rolls down a track tilted at [[θ = 6°|θ = 6°]]. The graph shows its velocity rising from [[0.6922 m/s at t = 1.600 s|v_i = 0.6922 m/s]] to [[1.010 m/s at t = 1.900 s|v_f = 1.010 m/s]]. Find the change in momentum, and check it against the impulse of gravity along the track.`,

  {type:'clue', ph:'info', prompt:'Collect the clues from the text and the statistics box.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: how can you check the impulse-momentum theorem here?', why:'The theorem says J = Δp. You can get each side separately: Δp from the graph, J from the force.', opts:[o('Get Δp = m(v_f − v_i) from the graph, and J = F Δt from the force along the track; compare them',1,'Two independent numbers that should agree.'),o('Assume they are equal',0,'The point of the lab is to TEST that.'),o('Only measure the time',0,'You need the momentum change too.')], explain:'<b>Roadmap:</b> Δt and Δv from the graph → Δp → force along the slope → J = F Δt → compare.'},
  dr('Draw the free-body diagram of the cart on the track (slope going DOWN to the right).',[fo('n','track pushing perpendicular',84,1,'Contact.'),fo('mg','weight',-90,1,'Gravity.'),fo('f','friction',174,0,'This lab cart has low-friction wheels; we neglect friction.')],[['mg','>','n','n = mg cos 6° is slightly less than mg']],{slope:-6}),
  bl('solve','Δp from the graph.',['Δt = 1.900 − 1.600 = {} s','Δv = 1.010 − 0.6922 = {} m/s','Δp = m Δv = 0.522 × {} = {} kg·m/s'],[nb(0.3),nb(0.3178),nb(0.3178),nb(0.1659)]),
  bl('solve','J from the force along the track.',['F = m g sin θ = 0.522 × 9.8 × sin 6° = {} N','J = F Δt = {} × 0.30 = {} N·s'],[nb(0.5347),nb(0.5347),nb(0.1604)]),
  {type:'num', ph:'check', prompt:'Percent difference: (Δp − J) / J × 100.', sym:'% diff', unit:'%', ans:(0.1659-0.1604)/0.1604*100, slips:[{v:-(0.1659-0.1604)/0.1659*100,msg:'Divide by the theoretical value J and keep the sign: (0.1659 − 0.1604)/0.1604.'}]},
  pr('check','Δp and J agree to about 3%. Does that support the impulse-momentum theorem?',[o('Yes',1),o('No')],[o('a few percent is within the reading and timing uncertainty of the lab',1),o('only an exact match counts')])
 ]})},

/* ---------- step: draw the free-body diagram (direction + length) ---------- */
const vAng = v => Math.atan2(-v[1], v[0])*180/Math.PI;
const aDiff = (a,b) => { let d = Math.abs(a-b) % 360; return d > 180 ? 360-d : d; };
function drawInner(s){
  const cx=160, cy=150; let h = DEFS;
  if(s.slope!=null){ const r=s.slope*Math.PI/180, dx=Math.cos(r), dy=-Math.sin(r); h += `<line x1="${cx-150*dx}" y1="${cy+18-150*dy}" x2="${cx+150*dx}" y2="${cy+18+150*dy}" stroke="#9aa" stroke-width="2" stroke-dasharray="6 4"/>`; }
  h += `<rect x="${cx-22}" y="${cy-18}" width="44" height="36" fill="#f4dcd2" stroke="#999" opacity=".55" ${s.slope!=null?`transform="rotate(${-s.slope} ${cx} ${cy})"`:''}/>`;
  const drawn = Object.keys(s.vec).map(Number).sort((a,b)=>a-b);
  drawn.forEach(i => { const v=s.vec[i], f=s.forces[i], L=Math.hypot(v[0],v[1])||1, ux=v[0]/L, uy=v[1]/L;
    const k = drawn.filter(j=>j<i && aDiff(vAng(s.vec[j]), vAng(v))<14).length, off = k*11;
    const sx=cx-uy*off, sy=cy+ux*off, c = s.st.solved ? 'G' : (s.act===i ? 'B' : 'R');
    h += ar(sx,sy,sx+v[0],sy+v[1],c,3.5) + tx(sx+v[0]+ux*15, sy+v[1]+uy*15+4, f.id, `text-anchor="middle" font-size="13" font-style="italic" fill="${COL[c]}"`); });
  return h + `<circle cx="${cx}" cy="${cy}" r="6" fill="#111"/>`;
}
function stepDraw(s, box, head){
  s.vec = s.vec || {}; if(s.act===undefined) s.act = null;
  box.innerHTML = `${head}<div class="q"> ${s.prompt}</div><div class="small" style="margin:-6px 0 10px"><b>1.</b> Click an arrow name in the list. <b>2.</b> Drag on the grid, away from the black dot, to draw its arrow. Both the <b>direction</b> and the <b>length</b> are graded: a longer arrow means a bigger quantity. Not everything in the list belongs.</div>
  <div class="fbdwrap"><svg id="dsvg" viewBox="0 0 320 300" width="320" height="300" style="touch-action:none;cursor:crosshair;max-width:100%;height:auto">${drawInner(s)}</svg>
  <div class="forces">${s.forces.map((f,i)=>`<button class="fbtn ${s.act===i?'sel':''} ${s.vec[i]?'ok':''}" data-i="${i}" onclick="pickForce(${i})">${s.vec[i]?'✓':''} <b class="m">${f.id}</b>: ${f.l}</button>`).join('')}<button class="nt" onclick="eraseForce()"> Erase the selected arrow</button></div></div>
  <div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkDraw()">Check diagram</button></div><div id="dfb"></div></div>`;
  const el = document.getElementById('dsvg'); let down = false;
  const pos = e => { const r = el.getBoundingClientRect(); return [(e.clientX-r.left)*320/r.width-160, (e.clientY-r.top)*300/r.height-150]; };
  const again = () => stepDraw(s, box, document.querySelector('#step .phase').outerHTML);
  el.onpointerdown = e => { if(s.st.solved) return; if(s.act==null){ toast('First click a name in the list, then drag from the black dot.'); return; } e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){ } down = true; s.vec[s.act] = pos(e); el.innerHTML = drawInner(s); };
  el.onpointermove = e => { if(!down) return; s.vec[s.act] = pos(e); el.innerHTML = drawInner(s); };
  el.onpointerup = el.onpointercancel = () => { if(!down) return; down = false; const v = s.vec[s.act]; if(Math.hypot(v[0],v[1]) < 22){ delete s.vec[s.act]; toast('Too short: drag further away from the dot.'); } again(); };
}
function pickForce(i){ const s = cur.d.steps[cur.i]; if(s.st.solved) return; s.act = i; stepDraw(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function eraseForce(){ const s = cur.d.steps[cur.i]; if(s.st.solved || s.act==null) return; delete s.vec[s.act]; stepDraw(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function checkDraw(){
  const s = cur.d.steps[cur.i]; if(s.st.solved) return; const box = document.getElementById('step'), fb = document.getElementById('dfb');
  const drawn = Object.keys(s.vec).map(Number), wrong = drawn.filter(i=>!s.forces[i].ok), missed = s.forces.map((f,i)=>i).filter(i=>s.forces[i].ok && !s.vec[i]);
  const msgs = wrong.map(i=>`✗ <b>${s.forces[i].id}</b> does not belong: ${s.forces[i].why}`);
  if(missed.length) msgs.push(`You are missing <b>${missed.length}</b> arrow${missed.length>1?'s':''}.${s.acc?'':' What touches the object? Gravity always acts.'}`);
  drawn.filter(i=>s.forces[i].ok && aDiff(vAng(s.vec[i]), s.forces[i].a) > 22).forEach(i=>msgs.push(`↻ <b>${s.forces[i].id}</b> points the wrong way.${s.acc?'':' Think about which way that force pushes or pulls.'}`));
  if(!msgs.length){ const len = id => { const i = s.forces.findIndex(f=>f.id===id); return Math.hypot(s.vec[i][0], s.vec[i][1]); };
    s.rel.forEach(([A,op,B,why]) => { const a = len(A), b = len(B);
      if(op==='>' && !(a > 1.12*b)) msgs.push(` Draw <b>${A}</b> clearly LONGER than <b>${B}</b>: ${why}.`);
      if(op==='=' && Math.abs(a-b) > 0.22*Math.max(a,b)) msgs.push(` <b>${A}</b> and <b>${B}</b> should be the SAME length: ${why}.`); }); }
  if(msgs.length){ miss(s); fb.innerHTML = `<div class="fb bad">${msgs.join('<br>')}</div>`; return; }
  s.act = null; addChips([(s.acc?'Sketch: ':'FBD: ') + s.forces.filter(f=>f.ok).map(f=>f.id).join(', ')]);
  stepDraw(s, box, document.querySelector('#step .phase').outerHTML);
  solve(s, box, s.forces.filter(f=>f.ok).map(f=>`<br>• <b>${f.id}</b>: ${f.why}`).join('') + s.rel.map(r=>`<br> ${r[0]} ${r[1]} ${r[2]}: ${r[3]}.`).join(''));
  document.getElementById('dsvg').innerHTML = drawInner(s);
}

function stepBlank(s, box, head){
  let k = 0;
  const lines = s.tpl.map(line => '<div class="bl m">' + line.replace(/\{\}/g, () => { const b = s.blanks[k], i = k++;
    if(b.opts){ if(!b.ord) b.ord = shuffle(b.opts); return `<select class="bsel" data-b="${i}"><option value="">choose ▾</option>${b.ord.map(x=>`<option>${x}</option>`).join('')}</select>`; }
    return `<input class="bin" data-b="${i}" inputmode="decimal" autocomplete="off" onkeydown="if(event.key==='Enter')checkBlank()">`; }) + '</div>').join('');
  box.innerHTML = `${head}<div class="q"> ${s.prompt}</div>${lines}<div class="small">Fill in every blank, then press Check. All blanks are checked together. Numbers within 2% count.</div><div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkBlank()">Check blanks</button></div><div id="bfb"></div></div>`;
}
function checkBlank(){
  const s = cur.d.steps[cur.i]; if(s.st.solved) return; const box = document.getElementById('step');
  const els = [...box.querySelectorAll('[data-b]')]; const bad = [];
  if(els.some(e=>e.value.trim()==='')){ document.getElementById('bfb').innerHTML = `<div class="fb bad">Fill in every blank first.</div>`; return; }
  els.forEach(el => { const b = s.blanks[+el.dataset.b], raw = el.value.trim(); let ok;
    if(b.opts) ok = raw === b.a; else { const v = pnum(raw); ok = isFinite(v) && near(v, b.a); }
    el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok); if(!ok) bad.push(b); });
  if(!bad.length){ els.forEach(e=>e.disabled=true); solve(s, box); return; }
  miss(s);
  let msg = `<b>${els.length-bad.length} of ${els.length}</b> blanks are right. Fix the red ones (−2 XP).`;
  if(s.st.tries >= 3) msg += `<br><b>Red blanks, in order:</b> ${bad.map(b=>b.opts?b.a:f3(b.a)).join(' · ')}`;
  document.getElementById('bfb').innerHTML = `<div class="fb bad">✗ ${msg}</div>`;
}

/* ---------- step: answer + reason ---------- */
function stepPair(s, box, head){
  if(!s.oa){ s.oa = shuffle(s.a.map((_,i)=>i)); s.ob = shuffle(s.b.map((_,i)=>i)); s.pa = -1; s.pb = -1; }
  const grp = (g,ord,arr,p) => `<div class="opts">${ord.map(i=>`<button class="opt ${p===i?'sel':''}" data-g="${g}" data-i="${i}" onclick="pickPair('${g}',${i})">${p===i?'◉':'○'} ${arr[i].t}</button>`).join('')}</div>`;
  box.innerHTML = `${head}<div class="q"> ${s.prompt}</div>${grp('a',s.oa,s.a,s.pa)}<div class="q" style="margin-top:16px">…because:</div>${grp('b',s.ob,s.b,s.pb)}<div class="small">Choose an answer AND the reason that supports it. Both must be right.</div><div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkPair()">Check answer + reason</button></div><div id="pfb"></div></div>`;
}
function pickPair(g, i){ const s = cur.d.steps[cur.i]; if(s.st.solved) return; s['p'+g] = i; stepPair(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function checkPair(){
  const s = cur.d.steps[cur.i]; if(s.st.solved) return; const box = document.getElementById('step'), fb = document.getElementById('pfb');
  if(s.pa<0 || s.pb<0){ fb.innerHTML = `<div class="fb bad">Pick one answer and one reason.</div>`; return; }
  const A = s.a[s.pa], Bq = s.b[s.pb];
  if(A.ok && Bq.ok){ box.querySelectorAll('.opt.sel').forEach(b=>b.classList.add('ok')); solve(s, box, Bq.why||''); return; }
  miss(s);
  fb.innerHTML = `<div class="fb bad">✗ ${s.st.tries===1 ? 'Your answer and your reason do not both hold up (−2 XP). Test the reason on its own: is it a true statement of physics? Then ask whether it really leads to your answer.' : (!A.ok && !Bq.ok ? 'Both the answer and the reason are wrong.' : !A.ok ? 'Your reason is correct physics. Follow it through: what answer does it lead to?' : 'Your answer is right, but that reason is not why. Which statement is actually true?')}</div>`;
}

/* ================= tokenizer for clue text ================= */
function tokens(text){
  const out=[]; const re=/\[\[(.+?)\]\]/g; let last=0, mm;
  const words = s => { s.split(/(\s+|<[^>]+>)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)||/^</.test(w)) out.push({raw:w}); else out.push({w}); }); };
  while((mm=re.exec(text))){ words(text.slice(last,mm.index)); const [p,mean,h]=mm[1].split('|'); out.push({clue:true,p,mean,hidden:h==='hidden'}); last=re.lastIndex; }
  words(text.slice(last)); return out;
}

    PV[id] = {t, fig:d.fig, meta:`${n} steps · ${[...kinds].map(k=>names[k]).join(', ')}${m.rnd?' · numbers change each play':''}`}; }
  const pv = document.getElementById('pv'), c = PV[id];
  pv.innerHTML = `<div class="pt">${m.title}</div><div class="px">${c.t}</div>${c.fig?`<div class="pf">${c.fig}</div>`:''}<div class="pm">${c.meta}</div>`;
  pv.style.display = 'block';
  const r = el.getBoundingClientRect(), w = pv.offsetWidth, h = pv.offsetHeight;
  let left = r.right + 10; if(left + w > innerWidth - 8) left = r.left - w - 10; if(left < 8) left = Math.max(8, innerWidth - w - 8);
  pv.style.left = left + 'px'; pv.style.top = Math.max(64, Math.min(r.top - 20, innerHeight - h - 8)) + 'px';
}
function pvHide(){ document.getElementById('pv').style.display = 'none'; }

/* ================= completion counts ================= */
function timesDone(id){ const c = (S.cnt||{})[id] || 0; return Math.max(c, S.done[id] ? 1 : 0); }
function lastDone(id){ const d = (S.last||{})[id]; if(!d) return '—'; const [y,mo,da] = d.split('-').map(Number); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo-1] + ' ' + da; }

/* ================= state & navigation ================= */
let cur = null;
function unlocked(lv){ return true; }

function showMap(){
  cur = null; hud(); pvHide();
  const done = MS.filter(m=>S.done[m.id]).length;
  let h = `<div class="card"><h2> Train your physics instincts</h2><p class="lead">Every problem is a case. Don't jump to the numbers! Work through the same routine a physicist uses, step by step. Progress: <b>${done}/${MS.length}</b> missions.</p>
  <div class="intro">${PH.map((p,i)=>`<div><b>${i+1}. ${p[1]}</b>${p[2]}</div>`).join('')}</div></div>`;
  S.hide = S.hide || {};
  CHAPTERS.forEach(C=>{
   if(!C.levels.length){ h += `<div class="chbar soon"><span class="cn">Chapter ${C.n}</span><span class="ct"><i>(to be added)</i></span></div>`; return; }
   const cms = MS.filter(m=>C.levels.includes(m.lv)), cd = cms.filter(m=>S.done[m.id]).length, hid = !!S.hide[C.n];
   h += `<div class="chbar"><span class="cn">Chapter ${C.n}</span><span class="ct">${C.title}</span><span class="cp">${cd} / ${cms.length} missions done &nbsp; <a href="#" onclick="S.hide['${C.n}']=!S.hide['${C.n}'];save();showMap();return false">[${hid?'show':'hide'}]</a></span></div>`;
   if(hid) return;
   h += `<div class="chbody"><div class="levels">`;
  LEVELS.filter(L=>C.levels.includes(L.n)).forEach(L=>{
    const ms = MS.filter(m=>m.lv===L.n), k = ms.filter(m=>S.done[m.id]).length, un = unlocked(L.n);
    h += `<div class="lv ${un?'':'lock'} ${k===ms.length?'done':''}"><div class="hd"><div class="n">${k===ms.length?'✓':L.n}</div><div><div class="t">${L.name}</div><div class="d">${L.desc}</div></div></div>
    <div class="bar"><i style="width:${100*k/ms.length}%"></i></div><div class="cthead"><span>Mission</span><span class="ctn">Times done</span><span class="ctd">Last</span></div>`;
    ms.forEach(m=> h += `<div class="ms ${un?'':'locked'}" onmouseenter="pvShow('${m.id}',this)" onmouseleave="pvHide()" onclick="${un?`startMission('${m.id}')`:`toast('Finish Level ${L.n-1} first (or unlock all at the bottom).')`}"><span class="ck">${S.done[m.id]?'✓':'▸'}</span><span class="tt">${m.title}</span>${m.rnd?' <span class="rnd" title="new numbers each time">[new numbers]</span>':''}${hasNote(m.id)?' <span class="rnd">[notes]</span>':''}${hasSave(m.id)?' <span class="rnd">[saved]</span>':''}<span class="cnum">${timesDone(m.id)}</span><span class="cdate">${lastDone(m.id)}</span></div>`);
    h += `</div>`;
  });
   h += `</div></div>`;
  });
  h += `<p class="small" style="margin-top:16px">All levels are unlocked: start anywhere. &nbsp;·&nbsp; <a href="#" onclick="if(confirm('Reset all progress?')){S.xp=0;S.streak=0;S.done={};save();showMap()}return false">Reset progress</a> &nbsp;·&nbsp; [new numbers] = different numbers every time you play. Uses g = 9.8 m/s².</p>`;
  document.getElementById('app').innerHTML = h; window.scrollTo(0,0);
}

const skey = id => 'physdet_save_' + id;
function hasSave(id){ try{ return !!localStorage.getItem(skey(id)); }catch(e){ return false; } }
function saveMission(){
  try{ localStorage.setItem(skey(cur.m.id), JSON.stringify({d:cur.d, i:cur.max, chips:cur.chips, found:[...cur.found], gained:cur.gained}, (k,v)=> v instanceof Set ? {__set:[...v]} : v));
    const x = loadNote(cur.m.id); x.text = document.getElementById('ntext').value; if(x.text || x.img) saveNote(cur.m.id, x);
    toast(` Saved at step ${cur.max+1} of ${cur.d.steps.length}. Your answers, clue board and notes will be here when you come back.`);
  }catch(e){ toast('Could not save: browser storage is full.'); }
}
function resetMission(){
  if(!confirm('Reset this problem? Your answers and saved spot will be cleared and you start again from step 1.')) return;
  const id = cur.m.id; try{ localStorage.removeItem(skey(id)); }catch(e){}
  if(hasNote(id) && confirm('Also erase your notes and drawing for this problem?\n\nOK = erase notes, Cancel = keep notes')){ try{ localStorage.removeItem(nkey(id)); }catch(e){} }
  startMission(id); toast('↺ Problem reset.');
}
function startMission(id){
  pvHide();
  const m = MS.find(x=>x.id===id);
  let sv = null; try{ sv = JSON.parse(localStorage.getItem(skey(id)) || 'null', (k,v)=> v && v.__set ? new Set(v.__set) : v); }catch(e){}
  if(sv && sv.d && sv.d.steps){ cur = {m, d:sv.d, i:sv.i, max:sv.i, chips:sv.chips, found:new Set(sv.found), gained:sv.gained, newChip:-1}; renderMission(); window.scrollTo(0,0); toast(`Resumed from your saved spot (step ${sv.i+1}). Press Reset to start over.`); return; }
  const d = m.make();
  if(EXTRA[m.id]){ const ex = EXTRA[m.id](d.v||{}), out = []; d.steps.forEach((st,i)=>{ ex.filter(e=>e[0]===i).forEach(e=>out.push(e[1])); out.push(st); }); ex.filter(e=>e[0]>=d.steps.length).forEach(e=>out.push(e[1])); d.steps = out; }
  if(FINISH[m.id]){ FINISH[m.id].steps.forEach((st,k)=>{ const c = Object.assign({}, st); if(k===0 && !c.why) c.why = FWHY; d.steps.push(c); }); d.answer = FINISH[m.id].ans; }
  applyWhy(m.id, d);
  d.steps.forEach(s=>{ s.st={tries:0,hint:false,solved:false}; });
  cur = {m, d, i:0, max:0, chips:[...(d.chips||[])].map(t=>({t})), found:new Set(), gained:0, newChip:-1};
  if(!d.steps.some(s=>s.type==='clue')) tokens(d.text).filter(t=>t.clue).forEach((t,i)=>{ cur.found.add(i); cur.chips.push({t:t.mean}); });
  renderMission(); window.scrollTo(0,0);
}

function renderMission(){
  const {m,d} = cur, L = LEVELS[m.lv-1];
  document.getElementById('app').innerHTML = `<div class="mission">
   <div>
    <div class="card"><div class="mt">Chapter ${(CHAPTERS.find(c=>c.levels.includes(L.n))||{n:''}).n} · Level ${L.n} · ${L.name}</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div class="ptitle">${m.title}</div><div style="display:flex;gap:6px"><button class="nt" style="font-size:14px;padding:6px 12px" onclick="saveMission()"> Save</button><button class="nt" style="font-size:14px;padding:6px 12px" onclick="resetMission()">↺ Reset</button></div></div><div class="ptext" id="ptext"></div>${d.fig?`<div class="fig">${d.fig}</div>`:''}</div>
    <div class="card board"><h4> Clue Board</h4><div id="chips"></div></div>
    <div class="card board notes"><h4> My Notes for this problem <span id="nsaved" style="text-transform:none;letter-spacing:0;color:var(--green)"></span></h4>
     <textarea id="ntext" placeholder="Type your notes here: what tripped you up, the key formula, what to remember next time…"></textarea>
     <div class="ntools">
      ${['#1d2733','#2a7ab0','#d63c4a','#2e9e5b'].map((c,i)=>`<button class="nc ${i?'':'on'}" style="background:${c}" title="pen colour" onclick="ntool('color','${c}',this)"></button>`).join('')}
      <button class="nt on" data-s="3" onclick="ntool('size',3,this)">thin</button><button class="nt" data-s="7" onclick="ntool('size',7,this)">thick</button>
      <button class="nt" id="nerase" onclick="ntool('erase',1,this)"> eraser</button>
      <button class="nt" onclick="nundo()">↶ undo</button><button class="nt" onclick="nclear()"> clear drawing</button>
     </div>
     <canvas id="ncv" width="900" height="520"></canvas>
     <div class="small">Draw with a mouse, finger or stylus. Notes save automatically in this browser, separately for each problem.</div></div>
   </div>
   <div>
    <div class="tracker" id="tracker"></div>
    <div class="card" id="step"></div>
    <div class="small" id="stepnav" style="margin:-8px 4px 14px"></div>
    <div class="card checklist"><h4> Physicist's Checklist</h4><ol id="cl">${PH.map(p=>`<li data-p="${p[0]}"><div>${p[1]}<small>${p[2]}</small></div></li>`).join('')}</ol></div>
   </div></div>`;
  initNotes(); renderStep();
}

function renderText(){
  const s = cur.d.steps[cur.i], hunt = s && s.type==='clue' && !s.st.solved;
  let ci = -1, h = '';
  tokens(cur.d.text).forEach((t,k)=>{
    if(t.raw!==undefined){ h += t.raw; return; }
    if(t.clue){ ci++; const f = cur.found.has(ci); h += `<span class="w ${f?(t.hidden?'hid':'cl'):''}" data-c="${ci}" ${hunt?`onclick="clickClue(${ci},this)"`:''}>${t.p}</span>`; }
    else h += `<span class="w" ${hunt?`onclick="clickWord(this)"`:''}>${t.w}</span>`;
  });
  const el = document.getElementById('ptext'); el.innerHTML = h; el.classList.toggle('hunt', !!hunt);
}
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = cur.chips.length ? cur.chips.map((c,i)=>`<span class="chip ${c.u?'u':''} ${i>=cur.newChip&&cur.newChip>=0?'new':''}">${c.t}</span>`).join('') : '<span class="empty">Clues you find will be pinned here.</span>';
  cur.newChip = -1;
}
function addChips(arr,u){ if(!arr) return; cur.newChip = cur.chips.length; arr.forEach(t=>{ if(!cur.chips.some(c=>c.t===t)) cur.chips.push({t,u}); }); }

function renderStep(){
  const {d} = cur, s = d.steps[cur.i];
  cur.max = Math.max(cur.max||0, cur.i);
  document.getElementById('tracker').innerHTML = d.steps.map((x,i)=>`<div class="tk ${x.st.solved?'ok':''} ${i===cur.i?'on':''} ${i<=cur.max?'go':''}" ${i<=cur.max?`onclick="goStep(${i})" title="${i===cur.max?'Where you left off':'Review this step'}"`:''}>${x.st.solved?'✓':(i+1)} ${SHORT[PHI[x.ph]]}</div>`).join('');
  document.querySelectorAll('#cl li').forEach(li=>li.classList.toggle('on', PHI[li.dataset.p]===PHI[s.ph]));
  renderText(); renderChips();
  const box = document.getElementById('step');
  const head = `<div class="phase">Step ${cur.i+1}/${d.steps.length} · ${PH[PHI[s.ph]][1]}</div>`;
  ({clue:stepClue, mcq:stepMcq, multi:stepMulti, num:stepNum, eq:stepEq, fbd:stepFbd, blank:stepBlank, pair:stepPair, draw:stepDraw})[s.type](s, box, s.st.solved && cur.i<cur.max ? head.replace('<div class="phase">','<div class="phase" style="background:#fff3d6;color:#8a6200"> Reviewing · ') : head);
  if(s.why){ const ph = box.querySelector('.phase'); if(ph) ph.insertAdjacentHTML('afterend', `<div class="whybox"><b>Why this step?</b> ${s.why}</div>`); }
  if(s.st.solved) review(s, box);
  document.getElementById('stepnav').innerHTML = cur.i>0 && !s.st.solved ? `<a href="#" onclick="goStep(${cur.i-1});return false">← Look back at the previous step</a> &nbsp;·&nbsp; or click any ✓ step in the bar above. Your place is kept.` : '';
}

/* ---------- going back to review earlier steps ---------- */
function goStep(k){ if(k<0 || k>cur.max) return; cur.i = k; renderStep(); }
function review(s, box){
  const q = sel => [...box.querySelectorAll(sel)];
  if(s.type==='mcq') s.opts.forEach((op,i)=>{ if(op.ok){ const b = box.querySelector(`.opt[data-i="${i}"]`); b.classList.add('ok'); b.innerHTML += `<span class="why">${op.why||''}</span>`; } });
  if(s.type==='multi') s.opts.forEach((op,i)=>{ if(op.ok){ const b = box.querySelector(`.opt[data-i="${i}"]`); b.classList.add('ok'); b.innerHTML = '[x] ' + op.t + `<span class="why">${op.why||''}</span>`; } });
  if(s.type==='num') document.getElementById('numin').value = f3(s.ans);
  if(s.type==='blank') q('[data-b]').forEach(el=>{ const b = s.blanks[+el.dataset.b]; el.value = b.opts ? b.a : f3(b.a); el.classList.add('ok'); });
  if(s.type==='pair') q('.opt.sel').forEach(b=>b.classList.add('ok'));
  if(s.type==='fbd') q('.fbtn.sel').forEach(b=>b.classList.add('ok'));
  q('button,input,select').forEach(e=>{ e.disabled = true; e.style.cursor = 'default'; });
  const last = cur.i === cur.d.steps.length-1, behind = cur.i < cur.max;
  box.querySelector('.fbz').innerHTML = `<div class="fb ok"> <b>You solved this step.</b> This is your finished work.${s.explain?`<div style="margin-top:6px">${s.explain}</div>`:''}</div><div class="btns">${cur.i>0?`<button class="btn g" onclick="goStep(${cur.i-1})">← Previous step</button>`:''}${behind?`<button class="btn g" onclick="goStep(${cur.i+1})">Next step →</button><button class="btn" onclick="goStep(${cur.max})"> Back to where I left off (step ${cur.max+1})</button>`:`<button class="btn gr" id="nextb" onclick="nextStep()">${last?'Close the case ':'Next step →'}</button>`}</div>`;
}

/* ---------- scoring ---------- */
function solve(s, box, extraHtml){
  if(s.st.solved) return; s.st.solved = true;
  let pts = s.type==='clue' ? Math.max(2, 10 - 2*s.st.tries) : (s.st.tries===0 ? 10 : 4);
  if(s.st.hint) pts = Math.max(1, pts-2);
  if(s.st.tries===0){ S.streak++; S.best=Math.max(S.best,S.streak); }
  S.xp += pts; cur.gained += pts; save(); hud();
  const fb = box.querySelector('.fbz');
  const last = cur.i === cur.d.steps.length-1;
  fb.innerHTML = `<div class="fb ok"> <b>+${pts} XP.</b> ${extraHtml||''} ${s.explain?`<div style="margin-top:6px">${s.explain}</div>`:''}</div><div class="btns"><button class="btn gr" id="nextb" onclick="nextStep()">${last?'Close the case ':'Next step →'}</button></div>`;
  box.querySelectorAll('.hb').forEach(b=>b.remove());
  document.getElementById('nextb').focus();
  renderChips();
}
function miss(s){ s.st.tries++; S.streak=0; S.xp=Math.max(0,S.xp-2); cur.gained-=2; save(); hud(); }
function hintBtn(s){ return s.hint ? `<button class="btn g hb" onclick="showHint()"> Hint (−2 XP)</button>` : ''; }
function showHint(){ const s=cur.d.steps[cur.i]; s.st.hint=true; const z=document.getElementById('step').querySelector('.hz'); z.innerHTML=`<div class="fb hint"> ${s.hint}</div>`; }
function nextStep(){ cur.i++; if(cur.i>=cur.d.steps.length) return finish(); renderStep(); document.getElementById('step').scrollIntoView({behavior:'smooth',block:'nearest'}); }

function finish(){
  const m = cur.m; S.cnt = S.cnt || {}; S.last = S.last || {}; S.cnt[m.id] = timesDone(m.id) + 1; const _d = new Date(); S.last[m.id] = _d.getFullYear()+'-'+(_d.getMonth()+1)+'-'+_d.getDate(); S.done[m.id] = true; save(); try{ localStorage.removeItem(skey(m.id)); }catch(e){}
  const idx = MS.indexOf(m), nx = MS[idx+1];
  const canNext = nx && unlocked(nx.lv);
  document.getElementById('app').innerHTML = `<div class="card end"><div class="big"></div><h2>Case closed: ${m.title}</h2>${cur.d.answer?`<div class="fb ok" style="max-width:640px;margin:0 auto 14px;text-align:left;font-size:17px"><b>Final answer:</b> ${cur.d.answer}</div>`:''}<p class="lead">You earned <b>${cur.gained} XP</b> on this case. Best streak: ${S.best}.</p>
  <div class="card" style="text-align:left;max-width:640px;margin:0 auto 16px"><h4 class="mt">Your final clue board</h4>${cur.chips.map(c=>`<span class="chip ${c.u?'u':''}">${c.t}</span>`).join('')}</div>
  <div class="btns" style="justify-content:center">${m.rnd?`<button class="btn g" onclick="startMission('${m.id}')"> Replay with new numbers</button>`:`<button class="btn g" onclick="startMission('${m.id}')">↻ Replay</button>`}
  ${canNext?`<button class="btn" onclick="startMission('${nx.id}')">Next case: ${nx.title} →</button>`:''}<button class="btn g" onclick="showMap()"> Map</button></div></div>`;
  window.scrollTo(0,0);
}

/* ---------- step: clue hunt ---------- */
function stepClue(s, box, head){
  const total = tokens(cur.d.text).filter(t=>t.clue).length;
  box.innerHTML = `${head}<div class="q"> ${s.prompt}</div><div class="small">Click words in the problem on the left. Clues found: <b id="cc">${cur.found.size}</b> / ${total}. Wrong clicks cost points.</div><div class="hz"></div><div id="cmsg"></div><div class="fbz"><div class="btns"><button class="btn g" onclick="clueHint()"> Show me one (−2 XP)</button></div></div>`;
  s.total = total;
  if(cur.found.size>=total) solve(s, box);
}
function clickClue(i, el){
  const s = cur.d.steps[cur.i]; if(cur.found.has(i)) return;
  const t = tokens(cur.d.text).filter(t=>t.clue)[i];
  cur.found.add(i); addChips([t.mean], /\?/.test(t.mean));
  renderText(); renderChips();
  document.getElementById('cc').textContent = cur.found.size;
  document.getElementById('cmsg').innerHTML = `<div class="fb ${t.hidden?'hint':'ok'}">${t.hidden?' <b>Hidden clue!</b> ':'✓ '}"${t.p}" → <span class="m"><b>${t.mean}</b></span></div>`;
  if(cur.found.size >= s.total) solve(s, document.getElementById('step'), 'All clues found.');
}
function clickWord(el){
  const s = cur.d.steps[cur.i]; s.st.tries++; if(S.streak){S.streak=0;hud();}
  el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss');
  const w = el.textContent;
  const msg = /\d/.test(w) ? `"${w}" is a number, but it's a <b>story detail</b>. It doesn't enter ΣF = ma or the kinematics here.` : `"${w}" isn't needed information. Look for <b>numbers with units</b>, or phrases that secretly mean a number or a direction (like "at rest" or "speeding up").`;
  document.getElementById('cmsg').innerHTML = `<div class="fb bad">${msg}</div>`;
}
function clueHint(){
  const s = cur.d.steps[cur.i]; s.st.hint = true;
  const cl = tokens(cur.d.text).filter(t=>t.clue); const i = cl.findIndex((t,k)=>!cur.found.has(k));
  const el = document.querySelector(`#ptext [data-c="${i}"]`); if(el){ el.classList.add('flash'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
}

/* ---------- step: multiple choice ---------- */
function stepMcq(s, box, head){
  if(!s.order) s.order = s.keep ? s.opts.map((_,i)=>i) : shuffle(s.opts.map((_,i)=>i));
  box.innerHTML = `${head}<div class="q">${s.prompt}</div><div class="small" style="margin:-6px 0 10px">Think first: every wrong pick costs 2 XP.</div><div class="opts">${s.order.map(i=>`<button class="opt" data-i="${i}" onclick="pickMcq(${i},this)">${s.opts[i].t}</button>`).join('')}</div><div class="hz"></div><div class="fbz"><div class="btns hb">${hintBtn(s)}</div></div>`;
}
function pickMcq(i, el){
  const s = cur.d.steps[cur.i]; if(s.st.solved) return; const op = s.opts[i];
  if(op.ok){ el.classList.add('ok'); el.innerHTML += `<span class="why">${op.why||''}</span>`; if(s.add) addChips(s.add, s.u); solve(s, document.getElementById('step')); }
  else { if(el.classList.contains('bad')) return; miss(s); el.classList.add('bad'); el.innerHTML += `<span class="why">✗ ${op.why||'Not quite. Think about it again.'}</span>`; }
}

/* ---------- step: multi select ---------- */
function stepMulti(s, box, head){
  if(!s.order) s.order = shuffle(s.opts.map((_,i)=>i)); s.sel = s.sel || new Set();
  box.innerHTML = `${head}<div class="q">${s.prompt}</div><div class="small" style="margin:-6px 0 10px">Select all that apply, then press Check.</div><div class="opts">${s.order.map(i=>`<button class="opt" data-i="${i}" onclick="togMulti(${i},this)">[ ] ${s.opts[i].t}</button>`).join('')}</div><div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkMulti()">Check</button>${hintBtn(s)}</div><div id="mfb"></div></div>`;
}
function togMulti(i, el){ const s=cur.d.steps[cur.i]; if(s.st.solved) return; if(s.sel.has(i)) s.sel.delete(i); else s.sel.add(i); el.classList.toggle('sel'); el.innerHTML = (s.sel.has(i)?'[x] ':'[ ] ') + s.opts[i].t; el.classList.remove('bad'); }
function checkMulti(){
  const s = cur.d.steps[cur.i]; const box = document.getElementById('step');
  const wrong = [...s.sel].filter(i=>!s.opts[i].ok), missed = s.opts.map((x,i)=>i).filter(i=>s.opts[i].ok && !s.sel.has(i));
  if(!wrong.length && !missed.length){
    box.querySelectorAll('.opt').forEach(b=>{ const i=+b.dataset.i; if(s.opts[i].ok){ b.classList.add('ok'); b.innerHTML += `<span class="why">${s.opts[i].why}</span>`; } });
    solve(s, box); return;
  }
  miss(s);
  wrong.forEach(i=>{ const b=box.querySelector(`.opt[data-i="${i}"]`); b.classList.add('bad'); });
  document.getElementById('mfb').innerHTML = `<div class="fb bad">${wrong.map(i=>`✗ <b>${s.opts[i].t}</b>: ${s.opts[i].why}`).join('<br>')}${missed.length?`${wrong.length?'<br>':''}You missed <b>${missed.length}</b> correct choice${missed.length>1?'s':''}.`:''}</div>`;
}

/* ---------- step: numeric ---------- */
function stepNum(s, box, head){
  box.innerHTML = `${head}<div class="q">${s.prompt}</div><div class="numrow"><span class="m">${s.sym} =</span><input id="numin" type="text" inputmode="decimal" placeholder="number" onkeydown="if(event.key==='Enter')checkNum()"><span>${s.unit}</span></div><div class="small">g = 9.8 m/s². Within 2% counts as correct, so 3 significant figures is plenty. Type powers of ten like 6.5e15.</div><div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkNum()">Check</button>${hintBtn(s)}</div><div id="nfb"></div></div>`;
  setTimeout(()=>{ const i=document.getElementById('numin'); if(i) i.focus({preventScroll:true}); },50);
}
function near(v, t, tol=0.02){ return Math.abs(v-t) <= (t===0 ? 1e-6 : tol*Math.abs(t)); }
function checkNum(){
  const s = cur.d.steps[cur.i]; if(s.st.solved) return;
  const v = pnum(document.getElementById('numin').value);
  const fb = document.getElementById('nfb');
  if(!isFinite(v)){ fb.innerHTML = `<div class="fb bad">Type a number.</div>`; return; }
  if(near(v, s.ans)){ addChips([`${s.sym} = ${f3(s.ans)} ${s.unit}`]); document.getElementById('numin').disabled = true; solve(s, document.getElementById('step'), `${s.sym} = ${f3(s.ans)} ${s.unit}.`); return; }
  miss(s);
  const slip = (s.slips||[]).find(x=>near(v, x.v));
  let msg = slip ? slip.msg : near(v, s.ans, 0.1) ? 'Very close. Check your rounding and use g = 9.8 m/s².' : near(-v, s.ans) ? 'Right size, wrong sign. Magnitudes are positive here.' : 'Not yet. Go back to your equation on the clue board and rearrange it symbolically first.';
  if(s.st.tries >= 3) msg += ` <br><b>Answer:</b> ${f3(s.ans)} ${s.unit}. Type it in to continue (fewer XP).`;
  fb.innerHTML = `<div class="fb bad">✗ ${msg}</div>`;
}

/* ---------- step: equation builder ---------- */
function canon(lhs, rhs){ return [...lhs].sort().join(',') + '=' + rhs; }
function canonStr(a){ const [l,r]=a.split('='); return canon(l.split(','), r); }
function stepEq(s, box, head){
  if(!s.slots){ s.slots = Array.from({length:s.lhs},()=>({sg:'+',t:null})); s.rh = null; s.act = 0; }
  const rhsTiles = s.rhs || s.tiles;
  const lhsH = s.slots.map((sl,k)=>`${k>0||sl.sg==='-'?`<button class="sgn" onclick="eqSign(${k})">${sl.sg==='+'?'+':'−'}</button>`:`<button class="sgn" title="toggle sign" onclick="eqSign(${k})">+</button>`}<div class="slot m ${sl.t?'f':''} ${s.act===k?'act':''}" onclick="eqSlot(${k})">${sl.t||'?'}</div>`).join('');
  box.innerHTML = `${head}<div class="q">${s.prompt}</div>
  <div class="eq m"><span>ΣF :</span>${lhsH}<span>=</span><div class="slot m ${s.rh?'f':''} ${s.act===s.lhs?'act':''}" onclick="eqSlot(${s.lhs})">${s.rh||'?'}</div></div>
  <div class="small">Click a box, then a tile. Click a round sign button to flip + / −. Click a filled box to empty it.</div>
  <div class="tiles">${(s.act===s.lhs ? rhsTiles : s.tiles).map(t=>`<button class="tile m" onclick="eqTile('${t}')">${t}</button>`).join('')}</div>
  <div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkEq()">Check equation</button>${hintBtn(s)}</div><div id="efb"></div></div>`;
}
function eqSign(k){ const s=cur.d.steps[cur.i]; if(s.st.solved) return; s.slots[k].sg = s.slots[k].sg==='+'?'-':'+'; stepEq(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function eqSlot(k){ const s=cur.d.steps[cur.i]; if(s.st.solved) return; if(k===s.lhs){ if(s.rh) s.rh=null; } else if(s.slots[k].t) s.slots[k].t=null; s.act=k; stepEq(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function eqTile(t){
  const s=cur.d.steps[cur.i]; if(s.st.solved) return;
  if(s.act===s.lhs) s.rh=t; else s.slots[s.act].t=t;
  const nextEmpty = s.slots.findIndex(x=>!x.t); s.act = nextEmpty>=0 ? nextEmpty : (s.rh ? s.act : s.lhs);
  stepEq(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML);
}
function checkEq(){
  const s=cur.d.steps[cur.i]; const fb=document.getElementById('efb');
  if(s.slots.some(x=>!x.t) || !s.rh){ fb.innerHTML=`<div class="fb bad">Fill every box first.</div>`; return; }
  const lhs = s.slots.map(x=>x.sg+x.t), c = canon(lhs, s.rh), answers = s.ans.map(canonStr);
  const pretty = s.slots.map((x,k)=>(k===0?(x.sg==='-'?'−':''):(x.sg==='+'?' + ':' − '))+x.t).join('') + ' = ' + s.rh;
  if(answers.includes(c)){ addChips([pretty]); solve(s, document.getElementById('step'), `<span class="m">${pretty}</span>`); return; }
  miss(s);
  const abs = a => a.split('=')[0].split(',').map(x=>x.slice(1)).sort().join(',');
  const myAbs = lhs.map(x=>x.slice(1)).sort().join(','), myR = s.rh;
  const ref = s.ans[0].split('='), refR = ref[1];
  let msg;
  if(answers.some(a=>abs(a)===myAbs) && myR===refR) msg = 'The forces are right, but check the <b>signs</b>: forces pointing along your + direction are +, and forces pointing against it are −.';
  else if(myR!==refR) msg = 'Check the right side: it is <b>(mass of THIS object) × a</b>, or 0 if a = 0. Never put a force there.';
  else msg = 'Compare with the free-body diagram: which forces act <b>on this object</b>? Use this object\'s own mass in its weight.';
  if(s.st.tries>=3) msg += `<br><b>Answer:</b> <span class="m">${s.ans[0].replace('=',' = ').replace(/,/g,' ').replace(/^\+/,'')}</span>`;
  fb.innerHTML = `<div class="fb bad">✗ ${msg}</div>`;
}

/* ---------- step: free-body diagram ---------- */
function fbdSVG(s){
  const cx=150, cy=130, Lr=78; let h='';
  if(s.slope!=null){ const r=s.slope*Math.PI/180, dx=Math.cos(r), dy=-Math.sin(r);
    h += `<line x1="${cx-140*dx}" y1="${cy+18-140*dy}" x2="${cx+140*dx}" y2="${cy+18+140*dy}" stroke="#9aa" stroke-width="2" stroke-dasharray="6 4"/>`; }
  h += `<rect x="${cx-22}" y="${cy-18}" width="44" height="36" fill="#f4dcd2" stroke="#999" opacity=".6" ${s.slope!=null?`transform="rotate(${-s.slope} ${cx} ${cy})"`:''}/>`;
  const byA = {}; s.forces.forEach((f,i)=>{ if(s.sel.has(i)) (byA[f.a]=byA[f.a]||[]).push(i); });
  Object.entries(byA).forEach(([a,arr])=>{ a=+a; const r=a*Math.PI/180, dx=Math.cos(r), dy=-Math.sin(r), px=-dy, py=dx;
    arr.forEach((i,k)=>{ const off=(k-(arr.length-1)/2)*11, sx=cx+px*off, sy=cy+py*off, L=Lr+(arr.length>1?k*14:0);
      const f=s.forces[i], c = s.res ? (f.ok?'#2e9e5b':'#d63c4a') : '#d63c4a';
      h += `<line x1="${sx}" y1="${sy}" x2="${sx+L*dx}" y2="${sy+L*dy}" stroke="${c}" stroke-width="3" marker-end="url(#arR)"/>`;
      const lab = f.l.split(/[ ,(]/)[0];
      h += `<text x="${sx+(L+16)*dx}" y="${sy+(L+16)*dy+4}" text-anchor="middle" font-size="12" fill="${c}" font-style="italic">${lab}</text>`; }); });
  h += `<circle cx="${cx}" cy="${cy}" r="6" fill="#111"/>`;
  return svg(300,260,h);
}
function stepFbd(s, box, head){
  s.sel = s.sel || new Set();
  box.innerHTML = `${head}<div class="q">${s.prompt}</div><div class="fbdwrap"><div id="fbdsvg">${fbdSVG(s)}</div><div class="forces">${s.forces.map((f,i)=>`<button class="fbtn ${s.sel.has(i)?'sel':''}" data-i="${i}" onclick="togF(${i})">${s.sel.has(i)?'[x]':'[ ]'} ${f.l}</button>`).join('')}</div></div><div class="hz"></div><div class="fbz"><div class="btns"><button class="btn" onclick="checkFbd()">Check diagram</button>${hintBtn(s)}</div><div id="ffb"></div></div>`;
}
function togF(i){ const s=cur.d.steps[cur.i]; if(s.st.solved) return; s.sel.has(i)?s.sel.delete(i):s.sel.add(i); stepFbd(s, document.getElementById('step'), document.querySelector('#step .phase').outerHTML); }
function checkFbd(){
  const s=cur.d.steps[cur.i]; const box=document.getElementById('step');
  const wrong=[...s.sel].filter(i=>!s.forces[i].ok), missed=s.forces.map((f,i)=>i).filter(i=>s.forces[i].ok&&!s.sel.has(i));
  if(!wrong.length && !missed.length){
    s.res=true; document.getElementById('fbdsvg').innerHTML=fbdSVG(s);
    box.querySelectorAll('.fbtn').forEach(b=>{ const i=+b.dataset.i; if(s.forces[i].ok) b.classList.add('ok'); });
    addChips(['FBD: ' + s.forces.filter(f=>f.ok).map(f=>f.l.split(/[ ,(]/)[0]).join(', ')]);
    solve(s, box, s.forces.filter(f=>f.ok).map(f=>`<br>• <b>${f.l}</b>: ${f.why}`).join('')); return;
  }
  miss(s);
  wrong.forEach(i=>box.querySelector(`.fbtn[data-i="${i}"]`).classList.add('bad'));
  document.getElementById('ffb').innerHTML = `<div class="fb bad">${wrong.map(i=>`✗ <b>${s.forces[i].l}</b>: ${s.forces[i].why}`).join('<br>')}${missed.length?`${wrong.length?'<br>':''} You are missing <b>${missed.length}</b> force${missed.length>1?'s':''}. Ask yourself: what TOUCHES the object? And gravity always acts.`:''}</div>`;
}

/* ================= per-problem notes (text + drawing) ================= */
let NT = null;
const nkey = id => 'physdet_note_' + id;
function loadNote(id){ try{ return JSON.parse(localStorage.getItem(nkey(id)) || '{}'); }catch(e){ return {}; } }
function saveNote(id, n){ try{ if(!n.text && !n.img) localStorage.removeItem(nkey(id)); else localStorage.setItem(nkey(id), JSON.stringify(n)); const el=document.getElementById('nsaved'); if(el){ el.textContent='· saved ✓'; clearTimeout(saveNote.h); saveNote.h=setTimeout(()=>{el.textContent='';},1500); } }catch(e){ toast('Could not save notes: browser storage is full.'); } }
function hasNote(id){ try{ return !!localStorage.getItem(nkey(id)); }catch(e){ return false; } }
function initNotes(){
  const id = cur.m.id, n = loadNote(id), ta = document.getElementById('ntext'), cv = document.getElementById('ncv'), ctx = cv.getContext('2d');
  ta.value = n.text || '';
  ta.oninput = () => { const x = loadNote(id); x.text = ta.value; saveNote(id, x); };
  NT = {id, cv, ctx, color:'#1d2733', size:3, erase:false, undo:[], down:false};
  if(n.img){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = n.img; }
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  cv.onpointerdown = e => { e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    NT.undo.push(ctx.getImageData(0,0,cv.width,cv.height)); if(NT.undo.length>25) NT.undo.shift();
    NT.down = true; const [x,y] = pos(e);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = NT.erase ? 30 : NT.size; ctx.strokeStyle = NT.color;
    ctx.globalCompositeOperation = NT.erase ? 'destination-out' : 'source-over';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.01,y); ctx.stroke(); };
  cv.onpointermove = e => { if(!NT.down) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { if(!NT.down) return; NT.down = false; nsaveDraw(); };
}
function nsaveDraw(){ const x = loadNote(NT.id); x.img = NT.cv.toDataURL('image/png'); saveNote(NT.id, x); }
function ntool(k, v, el){
  if(k==='color'){ NT.color = v; NT.erase = false; document.querySelectorAll('.nc').forEach(b=>b.classList.remove('on')); el.classList.add('on'); document.getElementById('nerase').classList.remove('on'); }
  if(k==='size'){ NT.size = v; document.querySelectorAll('.nt[data-s]').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
  if(k==='erase'){ NT.erase = !NT.erase; el.classList.toggle('on', NT.erase); }
}
function nundo(){ const im = NT.undo.pop(); if(!im) return; NT.ctx.putImageData(im,0,0); nsaveDraw(); }
function nclear(){ NT.undo.push(NT.ctx.getImageData(0,0,NT.cv.width,NT.cv.height)); NT.ctx.clearRect(0,0,NT.cv.width,NT.cv.height); const x = loadNote(NT.id); delete x.img; saveNote(NT.id, x); }

/* ================= notebook ================= */
function openNotebook(){
  document.getElementById('mbox').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2> Formula Notebook</h2><button class="btn g" onclick="closeModal()">Close </button></div>
  <h3>1. Information you need</h3>
  <table><tr><th>Information</th><th>Why you need it</th></tr>
  <tr><td>Mass (m)</td><td>Weight (mg) and inertia (ma)</td></tr><tr><td>Gravity (g = 9.8 m/s²)</td><td>To calculate weight: mg</td></tr>
  <tr><td>Acceleration (a)</td><td>To apply Newton's second law</td></tr><tr><td>Direction of motion / of a</td><td>To set positive and negative directions</td></tr>
  <tr><td>Other forces</td><td>To calculate the net force</td></tr><tr><td>Rope / pulley configuration</td><td>How objects are connected: same T, same a</td></tr></table>
  <h3>2. The most important formula</h3><div class="formula">ΣF = ma &nbsp;&nbsp;(for EACH object separately)</div>
  <p class="small">Choose + = direction of a. Forces along + are positive, forces against it are negative. ma is NOT a force; never draw it on an FBD.</p>
  <h3>3. Three basic situations</h3>
  <b>A. Hanging at rest (or constant velocity):</b><div class="formula">T − mg = 0 &nbsp;⇒&nbsp; T = mg</div>
  <b>B. Accelerating up / down:</b><div class="formula">a ↑: T − mg = ma &nbsp;⇒&nbsp; T = m(g + a)</div><div class="formula">a ↓: mg − T = ma &nbsp;⇒&nbsp; T = m(g − a)</div>
  <b>C. Two objects over a pulley (Atwood), m₁ > m₂:</b><div class="formula">m₁: m₁g − T = m₁a &nbsp;&nbsp;&nbsp; m₂: T − m₂g = m₂a</div><div class="formula">add ⇒ a = (m₁ − m₂)g / (m₁ + m₂), &nbsp; T = 2m₁m₂g / (m₁ + m₂)</div>
  <h3>4. Other tools</h3>
  <div class="formula">Friction: f = μₖ n &nbsp;&nbsp; (on a slope n = mg cos θ)</div>
  <div class="formula">Incline: along slope mg sin θ, perpendicular mg cos θ</div>
  <div class="formula">Kinematics: Δy = v₀t + ½at², &nbsp; v = v₀ + at, &nbsp; v² = v₀² + 2aΔy</div>
  <h3>5. Newton's 3rd law</h3><p>A on B = −(B on A). Pairs act on <b>different</b> objects and are the same type. Forces that cancel on ONE object are balance (1st/2nd law), not a 3rd-law pair.</p>
  <h3>6. Circular motion (Chapter 8)</h3>
  <div class="formula">v = 2πr / T = ωr, &nbsp; ω = 2π / T, &nbsp; rpm × 2π / 60 = rad/s</div>
  <div class="formula">a = v² / r = ω² r, pointing toward the centre</div>
  <div class="formula">Net force toward the centre = m v² / r &nbsp; (choose + toward the centre)</div>
  <div class="formula">Vertical circle on a seat: bottom n − mg = mv²/r, &nbsp; top mg − n = mv²/r</div>
  <div class="formula">Ball on a string: top T + mg = mv²/r, &nbsp; bottom T − mg = mv²/r, &nbsp; ω_min = √(g/L)</div>
  <div class="formula">r-t-z axes: r toward the centre, t along the motion, z perpendicular to the circle</div>
  <div class="formula">ΣF_r = m v²/r = m ω² r, &nbsp; ΣF_t = m a_t, &nbsp; ΣF_z = 0</div>
  <div class="formula">Banked curve (no friction): tan θ = v²/(g r). &nbsp; Conical pendulum: a_r = g tan θ, r = L sin θ</div>
  <p class="small">"Centripetal force" is a name for the net inward force, never an extra arrow on the diagram. In two dimensions, treat x and y separately.</p>
  <h3>7. Impulse and momentum (Chapter 11)</h3>
  <div class="formula">p = m v (a vector: keep the sign), &nbsp; J = ∫F dt = area under F vs t</div>
  <div class="formula">Momentum principle: p_i + J = p_f, &nbsp; F_avg = J / Δt</div>
  <div class="formula">Isolated system (no net external force): total p before = total p after</div>
  <div class="formula">Perfectly inelastic: m₁v₁ + m₂v₂ = (m₁ + m₂)V</div>
  <div class="formula">Elastic, target at rest: v_1f = (m₁ − m₂)/(m₁ + m₂) v_1i, &nbsp; v_2f = 2m₁/(m₁ + m₂) v_1i</div>
  <h3>8. Sanity checks</h3><p>a ↑ ⇒ T > mg · a ↓ ⇒ T < mg · Atwood: m₂g < T < m₁g · Units: N = kg·m/s².</p>`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

hud(); showMap();
