 ]})},
{id:'17f', lv:17, title:'The Roundup Ride', rnd:true, make:()=>{ const Tp=R(3.2,4.2,0.1), m=57, om=2*Math.PI/Tp, a=om*om*9, top=m*(a-9.8), bot=m*(a+9.8), Tmax=2*Math.PI/Math.sqrt(9.8/9); return {
 text:`In an amusement park ride called The Roundup, passengers stand inside an [[18.0 m-diameter|r = 9.0 m|hidden]] rotating ring. After the ring has acquired sufficient speed, it [[tilts into a vertical plane|a vertical circle: the centre is BELOW the rider at the top and ABOVE at the bottom|hidden]]. The ring rotates [[once every ${Tp} s|T = ${Tp} s]], and a rider's mass is [[57.0 kg|m = 57.0 kg]]. With how much force does the ring push on her at the top and at the bottom? What is the longest rotation period that keeps riders from falling off at the top?`,
 fig: figFerris('9.0 m'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the diameter.'},
  bl('info','Get the circular-motion numbers ready.',['r = {} m','ω = 2π / T = {} rad/s','a_r = ω² r = {} m/s²'],[nb(9),nb(om),nb(a)]),
  dr('Draw her free-body diagram at the TOP. She stands against the ring, which is ABOVE her; the centre is BELOW.',[fo('n','ring pushing on her, toward the centre',-90,1,'At the top the ring is outside her, so it pushes down.'),fo('mg','weight',-90,1,'Gravity.'),fo('n↑','ring pushing up',90,0,'The ring is above her head at the top.')],[['n','>','mg',`a_r = ${f3(a)} m/s² is bigger than 2g here, so n = m(a_r − g) > mg`]]),
  {type:'eq', ph:'law', prompt:'ΣF along r at the top (+ = down, toward the centre):', lhs:2, tiles:['n','mg','mω²r','0'], ans:['+n,+mg=mω²r']},
  {type:'num', ph:'solve', prompt:'Force of the ring at the top: n = m(ω²r − g).', sym:'n_top', unit:'N', ans:top, slips:[{v:bot,msg:'At the top, gravity helps: subtract mg.'}]},
  {type:'eq', ph:'law', prompt:'ΣF along r at the bottom (+ = up, toward the centre):', lhs:2, tiles:['n','mg','mω²r','0'], ans:['+n,-mg=mω²r']},
  {type:'num', ph:'solve', prompt:'Force of the ring at the bottom: n = m(ω²r + g).', sym:'n_bottom', unit:'N', ans:bot},
  bl('solve','The longest period that still works at the top.',['Riders start to fall when n = {}','Then mg = m ω² r, so ω_min = √(g / r) = {} rad/s','T_max = 2π / ω_min = {} s'],[nb(0),nb(Math.sqrt(9.8/9)),nb(Tmax)]),
  {type:'num', ph:'solve', prompt:'Longest rotation period:', sym:'T_max', unit:'s', ans:Tmax, slips:[{v:2*Math.PI/Math.sqrt(9.8/18),msg:'Use the radius, 9.0 m.'}]},
  pr('check','A heavier rider needs a different T_max.',[o('False: the same T_max works for everyone',1),o('True: heavier riders need a faster spin')],[o('the mass cancels: ω_min = √(g/r)',1),o('a heavier rider needs more force to stay up')])
 ]};}},
{id:'17g', lv:17, title:'Motorcycle Over the Crocodile Pool', make:()=>({
 text:`A motorcycle daredevil rides up a [[2.0 m-high|ramp top is h = 2.0 m above the ground|hidden]], [[20°|θ = 20°]] ramp, to sail across a [[10 m-wide pool|he must travel at least 10 m in the air|hidden]] and land at [[ground level|lands 2.0 m below the launch point|hidden]]. The engine [[dies just as he starts up the ramp|no thrust on the ramp: only gravity, n and rolling friction|hidden]]. He is going [[11.4 m/s|v₀ = 11.4 m/s at the bottom of the ramp]] at that instant, and the rolling friction coefficient is [[0.02|μ_r = 0.02]]. Does he survive?`,
 fig: figRamp(),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. There are several hidden ones.', explain:'Two stages: slowing down on the ramp (1D along the slope), then projectile motion from 2.0 m up.'},
  bl('info','Ramp geometry.',['Ramp length: L = h / sin θ = 2.0 / sin 20° = {} m'],[nb(5.848)]),
  dr('Draw his free-body diagram on the ramp. He rides UP the slope, which rises to the RIGHT.',[fo('n','ramp pushing perpendicular to it',110,1,'Contact.'),fo('mg','weight',-90,1,'Straight down.'),fo('f_r','rolling friction, down the slope',200,1,'Opposes the motion up the ramp.'),fo('thrust','engine thrust',20,0,'The engine has died.')],[['mg','>','n','n = mg cos θ']],{slope:20}),
  bl('law','Along the slope (+ = up the ramp).',['ΣF = −mg sin θ − μ_r mg cos θ = m a','a = −g(sin 20° + 0.02 cos 20°) = −{} m/s²'],[nb(3.536)]),
  bl('solve','Speed at the top of the ramp.',['v² = v₀² + 2 a L = 11.4² − 2 × 3.536 × 5.848 = {}','v = {} m/s'],[nb(88.6),nb(9.413)]),
  pr('sign','After leaving the ramp, his acceleration is…',[o('g, straight down',1),o('the same as on the ramp'),o('zero')],[o('he is a projectile: gravity is the only force',1),o('friction keeps slowing him'),o('nothing pushes him any more')]),
  bl('solve','Launch components.',['v_x = v cos 20° = {} m/s','v_y = v sin 20° = {} m/s, upward'],[nb(8.845),nb(3.219)]),
  bl('solve','Time to fall to the ground, 2.0 m below the launch.',['y = 2.0 + v_y t − 4.9 t² = 0','t = {} s (the positive root)'],[nb(1.047)]),
  {type:'num', ph:'solve', prompt:'Horizontal distance he travels in the air: x = v_x t.', sym:'x', unit:'m', ans:9.26, slips:[{v:11.4*Math.cos(20*Math.PI/180)*1.31,msg:'Use the speed at the TOP of the ramp, after slowing down.'}]},
  {type:'mcq', ph:'check', prompt:'The pool is 10 m wide. Does he survive?', opts:[o('No: he lands about 0.7 m short. Looks like crocodile food.',1,'He comes down at about 9.3 m.'),o('Yes: he clears the pool',0,'9.3 m is less than 10 m.')]}
 ]})},
{id:'17h', lv:17, title:'Rocket Block on a Rod', make:()=>({
 text:`A [[500 g|m = 0.500 kg|hidden]] steel block rotates on a [[steel table|kinetic friction steel on steel: μₖ = 0.60 (from the table)|hidden]] while attached to a [[2.0 m-long|r = 2.0 m]] massless rod. Compressed air ejected from a nozzle on the back of the block exerts a thrust of [[3.9 N|F = 3.9 N]]. The nozzle is [[70° from the radial line|thrust has a tangential part F sin 70° and a radial part F cos 70°|hidden]]. The block [[starts from rest|ω₀ = 0|hidden]]. Find the angular velocity and the rod tension after [[10 rev|Δθ = 10 × 2π = 20π rad|hidden]].`,
 fig: figRotor(),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Several are hidden.', explain:'The coefficient of friction is not in the problem: steel on steel, kinetic, is μₖ = 0.60 in the textbook table.'},
  {type:'mcq', ph:'system', prompt:'The thrust points 70° from the radial line, forward and inward. How does it split?', opts:[o('Along t: F sin 70° (speeds it up). Along r: F cos 70°, toward the pivot',1,'70° from radial means mostly tangential.'),o('Along t: F cos 70°. Along r: F sin 70°',0,'The angle is measured from the RADIAL line, so the radial part uses cos.'),o('All of it is tangential',0,'Only part of it.')]},
  bl('info','Forces along t.',['Thrust along t: 3.9 sin 70° = {} N','Kinetic friction: μₖ m g = 0.60 × 0.500 × 9.8 = {} N, pointing {} the motion'],[nb(3.665),nb(2.94),sl('against',['along','perpendicular to'])]),
  bl('law','Tangential motion.',['ΣF_t = 3.665 − 2.94 = {} N = m a_t','a_t = {} m/s²','α = a_t / r = {} rad/s²'],[nb(0.725),nb(1.45),nb(0.725)]),
  bl('solve','Angular kinematics after 10 rev.',['Δθ = 10 × 2π = {} rad','ω² = ω₀² + 2αΔθ, with ω₀ = {}'],[nb(62.83),nb(0)]),
  {type:'num', ph:'solve', prompt:'Angular velocity after 10 rev:', sym:'ω', unit:'rad/s', ans:9.544, slips:[{v:Math.sqrt(2*0.725*10),msg:'Convert 10 rev to radians: × 2π.'},{v:Math.sqrt(2*7.33/2*62.83),msg:'Include friction: subtract it from the tangential thrust.'}]},
  {type:'fbd', ph:'fbd', prompt:'Forces on the block in the plane of the table (top view). Click those that have a part along r, toward the pivot.', forces:[{l:'Rod tension T, toward the pivot',a:180,ok:1,why:'The rod pulls the block inward.'},{l:'Radial part of the thrust, F cos 70°, toward the pivot',a:180,ok:1,why:'The nozzle points partly outward, so the thrust is partly inward.'},{l:'Friction',a:90,ok:0,why:'Friction is along the motion (tangential), not radial.'},{l:'Centrifugal force, outward',a:0,ok:0,why:'Not a real force.'}]},
  {type:'eq', ph:'law', prompt:'ΣF along r (+ = toward the pivot):', lhs:2, tiles:['T','F cos70°','F sin70°','f_k','mω²r'], rhs:['mω²r','0'], ans:['+T,+F cos70°=mω²r']},
  bl('solve','Substitute.',['m ω² r = 0.500 × {}² × 2.0 = {} N','F cos 70° = {} N'],[nb(9.544),nb(91.08),nb(1.334)]),
  {type:'num', ph:'solve', prompt:'Tension in the rod after 10 rev:', sym:'T', unit:'N', ans:89.75, slips:[{v:91.08,msg:'The thrust also pushes inward: subtract F cos 70°.'},{v:92.41,msg:'The radial part of the thrust points INWARD, helping the rod, so subtract it.'}]}
 ]})},
/* ---------- CHAPTER 11, LEVEL 18: BASIC CONCEPTS ---------- */
{id:'18a', lv:18, title:'Momentum and Impulse', rnd:true, make:()=>{ const m=R(0.1,0.5,0.05), vi=R(5,15,1), vf=R(4,12,1), dt=R(5,20,5), J=m*(vf+vi), F=J/(dt/1000); return {
 text:`A [[${m} kg|m = ${m} kg]] ball moving [[to the left|v_ix is negative|hidden]] at [[${vi} m/s|v_ix = −${vi} m/s]] hits a wall and [[bounces back|v_fx is positive|hidden]] to the right at [[${vf} m/s|v_fx = +${vf} m/s]]. The contact lasts [[${dt} ms|Δt = ${dt} ms = ${dt/1000} s|hidden]]. Take + to the right.`,
 fig: figBA([{t:'Before',o:[{x:150,w:40,l:'ball',d:-1,v:'−'+vi+' m/s'}]},{t:'After',o:[{x:150,w:40,l:'ball',d:1,v:'+'+vf+' m/s'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Two are about direction.', explain:'Momentum is a vector. In one dimension its SIGN tells the direction.'},
  bl('info','Momentum p = m v, with its sign.',['p_ix = {} × (−{}) = {} kg·m/s','p_fx = {} × {} = {} kg·m/s'],[nb(m),nb(vi),nb(-m*vi),nb(m),nb(vf),nb(m*vf)]),
  bl('law','The impulse-momentum theorem: J = Δp = p_f − p_i.',['J_x = {} − ({}) = {} N·s','1 kg·m/s is the same unit as 1 {}'],[nb(m*vf),nb(-m*vi),nb(J),sl('N·s',['N','J','kg·m'])]),
  pr('check','The size of Δp is bigger than the size of p_i or of p_f. Why?',[o('The ball reverses direction',1),o('A mistake: Δp is always smaller'),o('The wall adds mass')],[o('subtracting a negative momentum adds the two sizes together',1,'Stopping AND sending back takes more impulse than just stopping.'),o('momentum is lost in every collision'),o('only the speeds matter, not the directions')]),
  bl('solve','Average force from the impulse.',['Δt = {} s','F_avg = J / Δt'],[nb(dt/1000)]),
  {type:'num', ph:'solve', prompt:'Average force of the wall on the ball:', sym:'F_avg', unit:'N', ans:F, slips:[{v:J/dt,msg:'Convert ms to seconds first.'},{v:m*(vf-vi)/(dt/1000),msg:'Keep the signs: p_i is negative, so Δp = m(v_f + |v_i|).'}]},
  pr('check','A padded wall makes the contact last twice as long, with the same bounce. The average force…',[o('is cut in half',1),o('doubles'),o('stays the same')],[o('the impulse is the same, and F_avg = J/Δt',1,'This is how airbags and helmets work.'),o('a longer push means a bigger force'),o('the ball still bounces at the same speed, so nothing changes')])
 ]};}},
{id:'18b', lv:18, title:'Reading a Momentum Bar Chart', make:()=>({
 text:`A momentum bar chart shows <b>p_i + J = p_f</b> as bars. A bar above the line is positive; below the line is negative. Take + to the right. In this chart, the object starts with p_ix = +3 kg·m/s and ends with p_fx = −2 kg·m/s.`,
 fig: figBars(3,-2),
 steps:[
  bl('info','Read the chart.',['p_ix = {} kg·m/s','p_fx = {} kg·m/s'],[nb(3),nb(-2)]),
  {type:'mcq', ph:'info', prompt:'What happened to the object?', opts:[o('It was moving right and ended up moving left',1,'The momentum changed sign.'),o('It sped up to the right',0,'p_f is negative, so it moves left at the end.'),o('It stopped',0,'p_f is −2, not 0.')]},
  bl('law','Find the impulse bar.',['J = p_f − p_i = {} − {} = {} N·s','The impulse bar points {}','So the average force on the object points {}'],[nb(-2),nb(3),nb(-5),sl('down (negative)',['up (positive)']),sl('left',['right'])]),
  bl('solve','Three quick charts.',['p_i = +5, J = −2:  p_f = {}','p_i = −4, p_f = −1:  J = {}','An object stops completely from p_i = +6:  J = {}'],[nb(3),nb(3),nb(-6)]),
  pr('check','In the chart above, could the average force have been zero?',[o('No',1),o('Yes')],[o('the momentum changed, and Δp = F_avg Δt',1,'Zero force means zero change in momentum.'),o('the object ended up slower, so no force was needed'),o('forces cancel in a collision')])
 ]})},
{id:'18c', lv:18, title:'Conservation of Momentum', make:()=>({
 text:`Two ice skaters, A ([[60 kg|m_A = 60 kg]]) and B ([[40 kg|m_B = 40 kg]]), stand [[at rest|total momentum before = 0|hidden]] on [[frictionless ice|no horizontal external force|hidden]]. They push off each other, and A moves [[left at 2.0 m/s|v_A = −2.0 m/s]]. Take + to the right.`,
 fig: figBA([{t:'Before',o:[{x:120,w:36,l:'A',v:'rest'},{x:160,w:36,l:'B',v:'rest'}]},{t:'After',o:[{x:110,w:36,l:'A',d:-1,v:'2.0 m/s'},{x:210,w:36,l:'B',d:1,v:'?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'fbd', ph:'system', prompt:'Choose the system A + B. Click every force that is EXTERNAL to this system.', forces:[{l:'Weight of A',a:-90,ok:1,why:'Earth is outside the system.'},{l:'Weight of B',a:-90,ok:1,why:'Earth is outside the system.'},{l:'Ice pushing up on A',a:90,ok:1,why:'The ice is outside the system.'},{l:'Ice pushing up on B',a:90,ok:1,why:'The ice is outside the system.'},{l:'A pushing on B',a:0,ok:0,why:'Internal: both skaters are inside the system.'},{l:'B pushing on A',a:180,ok:0,why:'Internal, and the 3rd-law partner of A pushing on B.'},{l:'Friction from the ice',a:0,ok:0,why:'The ice is frictionless.'}]},
  {type:'mcq', ph:'law', prompt:'Why is the total horizontal momentum conserved?', opts:[o('All the external forces are vertical and cancel, so the net external force is zero',1,'An isolated system keeps its total momentum.'),o('Because the push forces are equal and opposite',0,'Those are internal. They cancel in the TOTAL, but the reason momentum is conserved is that no net EXTERNAL force acts.'),o('Momentum is always conserved for each skater',0,'Each skater\'s momentum changes. Only the total stays the same.')]},
  bl('solve','Before = after.',['Total momentum before: {} kg·m/s','After:  60 × (−2.0) + 40 × v_B = {}','v_B = {} m/s, moving {}'],[nb(0),nb(0),nb(3),sl('right',['left'])]),
  {type:'multi', ph:'law', prompt:'Which statements about collisions are true? Select all.', opts:[o('Momentum is conserved in every collision of an isolated system',1,'Elastic or not.'),o('In a perfectly inelastic collision the objects stick together and move with one final velocity',1,'That is the definition.'),o('In a perfectly elastic collision kinetic energy is also conserved',1,'Nothing is lost to heat or sound.'),o('In an inelastic collision momentum is lost',0,'Kinetic ENERGY is lost; momentum is still conserved.'),o('An explosion from rest has total momentum zero afterward',1,'It was zero before.')]},
  bl('law','Elastic collision with the target (object 2) initially at rest.',['v_1f = (m₁ − m₂) / (m₁ + m₂) × v_1i','v_2f = 2m₁ / (m₁ + m₂) × v_1i','Equal masses:  v_1f = {} × v_1i,  v_2f = {} × v_1i'],[nb(0),nb(1)]),
  pr('check','A light ball hits a much heavier ball at rest, elastically. The light ball…',[o('bounces back',1),o('keeps going forward'),o('stops')],[o('m₁ − m₂ is negative, so v_1f has the opposite sign to v_1i',1),o('momentum must keep pointing forward'),o('a heavy ball absorbs all the momentum')])
 ]})},
/* ---------- LEVEL 19: IMPULSE AND FORCE GRAPHS ---------- */
{id:'19a', lv:19, title:'Incomplete Momentum Bar Chart', make:()=>({
 text:`The figure is an incomplete momentum bar chart for a collision that lasts [[10 ms|Δt = 10 ms = 0.010 s]]. Assume that the object is [[initially moving to the left|p_ix is negative|hidden]]. What are the magnitude and direction of the average collision force exerted on the object? Enter a positive value if the force is to the right.`,
 fig: figBars(-4,6),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues in the text. The momenta are in the chart.'},
  bl('info','Read the chart (kg·m/s).',['p_ix = {}','p_fx = {}'],[nb(-4),nb(6)]),
  bl('law','Momentum principle: p_ix + J_x = p_fx.',['J_x = p_fx − p_ix = {} − ({}) = {} N·s','J_x is {}, so the force points to the {}'],[nb(6),nb(-4),nb(10),sl('positive',['negative','zero']),sl('right',['left'])]),
  pr('check','Could the average force be zero?',[o('No',1),o('Yes')],[o('the momentum changed during the collision, and Δp = F_avg Δt',1,'A zero force gives zero change in momentum.'),o('the final and initial speeds are similar'),o('the impulse is already accounted for in the chart')]),
  bl('solve','Average force.',['Δt = {} s','F_avg = J_x / Δt = {} / {}'],[nb(0.01),nb(10),nb(0.01)]),
  {type:'num', ph:'solve', prompt:'Average collision force (+ = right):', sym:'F_avg', unit:'N', ans:1000, slips:[{v:0,msg:'The momentum changed, so the force cannot be zero.'},{v:1,msg:'Convert 10 ms to 0.010 s.'},{v:200,msg:'p_ix is −4, so J = 6 − (−4) = 10 N·s, not 2.'},{v:10,msg:'That is the impulse. Divide by Δt.'}], explain:'F_avg = +1.0 × 10³ N, to the right.'}
 ]})},
{id:'19b', lv:19, title:'Impulse from a Triangle Graph', make:()=>({
 text:`In the figure, [[F₁ = 1100 N|peak force F₁ = 1100 N]]. The time axis is in [[milliseconds|6 ms = 0.006 s|hidden]]. What impulse does the force shown exert on a [[250 g|m = 0.250 kg]] particle?`,
 fig: figFt({pts:[[0,0],[2,1],[6,0]], xmax:7, ymin:0, ymax:1.25, xt:[0,2,4,6], yt:[[1,'F₁']], xl:'t (ms)', yl:'F_x (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. One hides in the axis label.'},
  {type:'mcq', ph:'law', prompt:'How do you get the impulse from an F vs t graph?', opts:[o('The area under the curve',1,'J = ∫F dt.'),o('The peak force times the total time',0,'That would be a rectangle. This force is not constant.'),o('The slope of the graph',0,'The slope is the rate of change of the force.')]},
  {type:'mcq', ph:'info', prompt:'Which given value is NOT needed to find the impulse?', opts:[o('The mass, 250 g',1,'J depends only on the force and time. The mass matters for the change in VELOCITY.'),o('F₁',0,'It is the height of the triangle.'),o('The time axis',0,'It is the base of the triangle.')]},
  bl('solve','Area of the triangle.',['Base: 6 ms = {} s','J = ½ × base × height = ½ × {} × {}'],[nb(0.006),nb(0.006),nb(1100)]),
  {type:'num', ph:'solve', prompt:'Impulse:', sym:'J', unit:'N·s', ans:3.3, slips:[{v:3300,msg:'The time axis is in ms: use 0.006 s.'},{v:6.6,msg:'It is a triangle: multiply by ½.'},{v:0.825,msg:'Do not multiply by the mass. J is the area under F vs t.'},{v:19800,msg:'Use area = ½ × 0.006 s × 1100 N.'}]},
  bl('check','Use the answer.',['Change in the particle\'s velocity: Δv = J / m = {} m/s'],[nb(13.2)])
 ]})},
{id:'19b2', lv:19, title:'Force Growing From 0 to 9000 N', make:()=>({
 text:`A force in the [[+x-direction|J is positive|hidden]] [[increases linearly|the F–t graph is a straight line: a triangle|hidden]] from [[0 N to 9000 N|F goes from 0 to F_max = 9000 N]] in [[7.0 s|Δt = 7.0 s]], then [[suddenly ends|F drops straight to 0 at t = 7.0 s|hidden]]. Find the average force, the impulse, and the change of momentum of a [[1500 kg|m = 1500 kg]] car [[initially at rest|v₀ = 0|hidden]].`,
 fig: figFt({pts:[[0,0],[7,9000],[7,0],[8.5,0]], xmax:8.5, ymin:0, ymax:10500, xt:[0,7], yt:[[9000,'9000']], xl:'t (s)', yl:'F_x (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Sketching the graph is the key step.', why:'"Increases linearly then suddenly ends" describes a SHAPE. The impulse is the area of that shape.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: how are the three answers linked?', why:'Seeing the chain first tells you which answer feeds the next.', opts:[o('Impulse = area under F–t; F_avg = J / Δt; and Δp = J',1,'One area gives all three.'),o('Each needs a different formula with the car\'s mass',0,'The mass is not needed for any of the three.'),o('F_avg = F_max',0,'The force is only 9000 N at the very end.')], explain:'<b>Roadmap:</b> area of the triangle → J → divide by Δt for F_avg → Δp = J.'},
  {type:'mcq', ph:'info', prompt:'What shape is the F–t graph?', why:'You need the shape to choose the area formula.', opts:[o('A right triangle: base 7.0 s, height 9000 N',1,'It rises in a straight line and then drops straight down.'),o('A rectangle',0,'The force is not constant.'),o('A symmetric triangle',0,'It rises the whole time, then stops suddenly.')]},
  bl('solve','Average force of a force that grows linearly from zero.',['F_avg = (0 + {}) / 2 = {} N'],[nb(9000),nb(4500)],'For a straight-line change, the average is halfway between the start and end values.'),
  {type:'num', ph:'solve', prompt:'Average force:', sym:'F_avg', unit:'N', ans:4500, why:'This is Part A.', slips:[{v:9000,msg:'That is the maximum. The force spends most of the time below 9000 N.'}]},
  bl('solve','Impulse = area of the triangle.',['J = ½ × {} s × {} N = {} N·s','Check: J = F_avg × Δt = 4500 × 7.0 = {} N·s'],[nb(7),nb(9000),nb(31500),nb(31500)]),
  {type:'num', ph:'solve', prompt:'Impulse:', sym:'J_x', unit:'N·s', ans:31500, why:'This is Part B.', slips:[{v:63000,msg:'It is a triangle: multiply by ½.'}]},
  pr('law','Part C: the car\'s change of momentum is…',[o('31 500 kg·m/s, the same as J',1),o('J divided by 1500 kg'),o('zero, because it started at rest')],[o('the impulse-momentum theorem: Δp = J, whatever the mass',1,'The mass only matters if you want the VELOCITY.'),o('momentum is per kilogram'),o('the car had no momentum to change')]),
  {type:'num', ph:'solve', prompt:'Change of momentum of the car:', sym:'Δp_x', unit:'kg·m/s', ans:31500, slips:[{v:21,msg:'That is the final speed. The question asks for Δp = J.'}]},
  bl('check','Use it one more step.',['Final speed of the car: v = Δp / m = 31500 / 1500 = {} m/s'],[nb(21)]),
  {type:'mcq', ph:'check', prompt:'Recap: what single idea answered all three parts?', why:'Saying the method in one sentence is what lets you solve the next problem like this.', opts:[o('The area under the F–t graph is the impulse, and the impulse equals the change in momentum',1,'J = area = Δp.'),o('F = ma',0,'That would need the acceleration at each moment.'),o('Energy conservation',0,'Not needed here.')]}
 ]})},
{id:'19c', lv:19, title:'Ball Bouncing Off a Wall', rnd:true, make:()=>{ const Fm=R(800,1200,100), dt=R(8,12,2), J=0.5*Fm*dt/1000, vf=-10+J/0.28; return {
 text:`A [[280 g|m = 0.280 kg|hidden]] ball collides with a wall. The velocity graph shows it arrives at [[−10 m/s|v_ix = −10 m/s (moving left)]] and leaves at v_fx. The force of the wall on the ball is a triangle that peaks at [[${Fm} N|F_max = ${Fm} N]] and lasts [[${dt} ms|Δt = ${dt} ms = ${dt/1000} s|hidden]]. What is v_fx, the ball's rebound velocity?`,
 fig: figFt({pts:[[0,-10],[1.2,-10],[3,6],[4.5,6]], xmax:4.6, ymin:-12, ymax:9, yt:[[-10,'−10'],[0,'0'],[6,'v_fx']], xl:'t', yl:'v_x (m/s)', col:'#4caf50'}) + figFt({pts:[[0,0],[dt/2,1],[dt,0],[dt+1.5,0]], xmax:dt+1.5, ymin:0, ymax:1.25, yt:[[1,Fm+' N']], xt:[0,dt], xl:'t (ms)', yl:'F_x (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the units.'},
  dr('Draw the free-body diagram of the ball DURING the collision. It moves left, so the wall is on its LEFT.',[fo('n','wall pushing on the ball',0,1,'The wall pushes away from itself, to the right.'),fo('mg','weight',-90,1,'Gravity still acts.'),fo('F mot','"force of the motion"',180,0,'Motion is not a force.')],[['n','>','mg','the wall force reaches hundreds of newtons; mg is only 2.7 N']]),
  {type:'mcq', ph:'law', prompt:'Why can you ignore gravity during the collision?', opts:[o('It is tiny compared with the wall force and acts for only milliseconds',1,'This is the impulse approximation.'),o('Gravity stops acting during a collision',0,'It always acts.'),o('Gravity is vertical and this is about vertical motion',0,'The motion here is horizontal, and gravity is vertical, but it is also tiny.')]},
  bl('solve','Impulse = area of the force triangle.',['J = ½ × {} N × {} s = {} N·s'],[nb(Fm),nb(dt/1000),nb(J)]),
  bl('law','Momentum principle.',['m v_fx = m v_ix + J','v_fx = {} + {} / {}'],[nb(-10),nb(J),nb(0.28)]),
  {type:'num', ph:'solve', prompt:'Rebound velocity:', sym:'v_fx', unit:'m/s', ans:vf, slips:[{v:10+J/0.28,msg:'v_ix is −10 m/s, not +10.'},{v:-10+0.5*Fm*dt/0.28,msg:'Convert ms to seconds.'}]},
  pr('check','v_fx is positive. What does that mean?',[o('The ball bounces back to the right',1),o('The ball keeps moving left'),o('A mistake: velocities after a bounce are negative')],[o('a positive velocity points to the right, opposite to how it arrived',1),o('the wall pushes it further left'),o('speeds are always positive')])
 ]};}},
{id:'19d', lv:19, title:'Force That Changes With Time', make:()=>({
 text:`A [[500 g|m = 0.500 kg|hidden]] particle has velocity [[v_x = −8.0 m/s|v_ix = −8.0 m/s]] at [[t = −2 s|start time]]. A force [[F_x = (4 − t²) N|F changes with t: the impulse is an integral (area)|hidden]], with t in s, acts between t = −2 s and [[t = 2 s|end time]]. It rises from 0 N at t = −2 s to 4 N at t = 0 and back to 0 N at t = 2 s. What is the particle's velocity at t = 2 s?`,
 fig: figFt({pts:Array.from({length:41},(_,k)=>{const t=-2+k*0.1; return [t,4-t*t];}), xmin:-2.6, xmax:2.6, yax:0, ymin:0, ymax:5, xt:[-2,-1,1,2], yt:[[4,'4']], xl:'t (s)', yl:'F_x (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'How do you find the impulse of this force?', opts:[o('J = ∫F dt from −2 s to 2 s',1,'The area under the curve.'),o('J = 4 N × 4 s',0,'The force is only 4 N at one instant. That overestimates the area.'),o('J = F at t = 2 s times 4 s',0,'F is 0 there.')]},
  bl('solve','Integrate.',['∫(4 − t²) dt = 4t − t³/3','At t = 2:  {}','At t = −2:  {}','J = {} N·s'],[nb(16/3),nb(-16/3),nb(32/3)]),
  bl('law','Momentum principle.',['v_fx = v_ix + J / m = {} + {} / {}'],[nb(-8),nb(32/3),nb(0.5)]),
  {type:'num', ph:'solve', prompt:'Velocity at t = 2 s:', sym:'v_fx', unit:'m/s', ans:-8+64/3, slips:[{v:24,msg:'The force is not 4 N the whole time. Integrate.'},{v:-8+32/3,msg:'Divide the impulse by the mass, 0.500 kg.'},{v:8+64/3,msg:'v_ix is −8.0 m/s.'}]},
  pr('check','The velocity went from −8.0 m/s to about +13 m/s. So the particle…',[o('reversed direction',1),o('kept moving left, only faster'),o('stopped')],[o('the sign changed from negative to positive',1),o('the speed increased'),o('the force was zero at the end')])
 ]})},
{id:'19e', lv:19, title:'Rocket Thrust in Deep Space', make:()=>({
 text:`Far in space, where [[gravity is negligible|thrust is the only force|hidden]], a [[425 kg|m = 425 kg]] rocket traveling at [[65 m/s|v_ix = 65 m/s]] fires its engines. The thrust [[drops steadily from 1000 N to 0 over 30 s|the F–t graph is a triangle|hidden]]. The [[mass lost is negligible|m stays 425 kg|hidden]].`,
 fig: figFt({pts:[[0,1000],[30,0],[34,0]], xmax:34, ymin:0, ymax:1150, xt:[0,10,20,30], yt:[[1000,'1000']], xl:'t (s)', yl:'F_x (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  bl('solve','Impulse = area under the graph.',['J = ½ × {} s × {} N'],[nb(30),nb(1000)]),
  {type:'num', ph:'solve', prompt:'Impulse from the engine:', sym:'J_x', unit:'N·s', ans:15000, slips:[{v:30000,msg:'It is a triangle: multiply by ½.'}]},
  pr('sign','When does the rocket reach its MAXIMUM speed?',[o('At t = 30 s',1),o('At t = 0'),o('At t = 15 s')],[o('the thrust points forward the whole time, so the rocket keeps speeding up until the thrust stops',1,'The acceleration gets smaller, but it never turns negative.'),o('the force is largest at the start'),o('halfway through, the force is half')]),
  bl('law','Momentum principle.',['v_max = v_ix + J / m = {} + {} / {}'],[nb(65),nb(15000),nb(425)]),
  {type:'num', ph:'solve', prompt:'Maximum speed:', sym:'v_fx', unit:'m/s', ans:65+15000/425, slips:[{v:15000/425,msg:'That is the CHANGE in speed. Add the starting 65 m/s.'}]}
 ]})},
/* ---------- LEVEL 20: CONSERVATION AND COLLISIONS ---------- */
{id:'20a', lv:20, title:'Archer on the Ice', make:()=>({
 text:`A [[70.0 kg|m_A = 70.0 kg]] archer, standing [[at rest|total momentum before = 0|hidden]] on [[frictionless ice|no horizontal external force|hidden]], shoots a [[200 g|m_arrow = 0.200 kg|hidden]] arrow at a speed of [[100 m/s|v_arrow = 100 m/s]]. What is the recoil speed of the archer?`,
 fig: figBA([{t:'Before',o:[{x:130,w:44,l:'archer',v:'rest'}]},{t:'After',o:[{x:90,w:44,l:'archer',d:-1,v:'v = ?'},{x:200,w:30,l:'arrow',d:1,v:'100 m/s'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'fbd', ph:'system', prompt:'System: archer + arrow. Click every force that is EXTERNAL.', forces:[{l:'Weight of the archer',a:-90,ok:1,why:'Earth is outside the system.'},{l:'Weight of the arrow',a:-90,ok:1,why:'Earth is outside the system.'},{l:'Ice pushing up on the archer',a:90,ok:1,why:'The ice is outside.'},{l:'Bow pushing the arrow forward',a:0,ok:0,why:'Internal: both are in the system.'},{l:'Arrow pushing back on the bow',a:180,ok:0,why:'Internal.'},{l:'Friction from the ice',a:0,ok:0,why:'The ice is frictionless.'}]},
  bl('solve','Before = after (+ = direction of the arrow).',['Before: {} kg·m/s','After:  70.0 × v_A + {} × {} = 0','v_A = {} m/s'],[nb(0),nb(0.2),nb(100),nb(-20/70)]),
  {type:'num', ph:'solve', prompt:'Recoil SPEED of the archer:', sym:'v', unit:'m/s', ans:20/70, slips:[{v:20000/70,msg:'Convert 200 g to 0.200 kg.'}]},
  pr('check','The recoil speed is small because…',[o('the archer is 350 times heavier than the arrow',1),o('the ice is frictionless'),o('the arrow is fast')],[o('equal and opposite momenta: the bigger mass gets the smaller speed',1),o('friction would make the recoil bigger'),o('a fast arrow always gives a slow recoil, whatever the masses')])
 ]})},
{id:'20b', lv:20, title:'Dart Sticks in a Toy Car', make:()=>({
 text:`A [[39 g|m_d = 0.039 kg|hidden]] dart traveling horizontally hits and [[sticks|perfectly inelastic: they move together|hidden]] in the back of a [[500 g|m_c = 0.500 kg|hidden]] toy car [[at rest|v_car,i = 0|hidden]], causing the car to roll forward at [[1.4 m/s|v_f = 1.4 m/s]]. What was the speed of the dart?`,
 fig: figBA([{t:'Before',o:[{x:60,w:30,l:'dart',d:1,v:'v = ?'},{x:180,w:60,l:'car',v:'rest'}]},{t:'After',o:[{x:180,w:60,l:'car + dart',d:1,v:'1.4 m/s'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the units.'},
  {type:'mcq', ph:'link', prompt:'What kind of collision is this?', opts:[o('Perfectly inelastic: they stick and share one final velocity',1,'So the final mass is m_d + m_c.'),o('Perfectly elastic',0,'Elastic objects bounce apart.'),o('An explosion',0,'Nothing flies apart.')]},
  bl('solve','Before = after.',['m_d v_d = (m_d + m_c) v_f','v_d = ({} + {}) × 1.4 / {}'],[nb(0.039),nb(0.5),nb(0.039)]),
  {type:'num', ph:'solve', prompt:'Speed of the dart:', sym:'v_d', unit:'m/s', ans:0.539*1.4/0.039, slips:[{v:0.5*1.4/0.039,msg:'After the collision the dart moves too: use m_d + m_c.'}]},
  bl('check','Was kinetic energy conserved?',['K before = ½ × 0.039 × {}² = {} J','K after = ½ × 0.539 × 1.4² = {} J','Fraction of K kept: {}'],[nb(19.35),nb(7.30),nb(0.528),nb(0.0723)],'Momentum is conserved, but more than 90% of the kinetic energy turned into heat and deformation.')
 ]})},
{id:'20c', lv:20, title:'Football Player on Ice', make:()=>({
 text:`A [[67.0 kg|m_p = 67.0 kg]] football player is gliding across [[very smooth ice|no horizontal external force|hidden]] at [[1.95 m/s|v_i = 1.95 m/s (player and ball together)]]. He throws a [[0.430 kg|m_b = 0.430 kg]] football [[straight forward|+ = forward|hidden]]. Find his speed afterward if the ball is thrown at [[13.5 m/s|v_b = 13.5 m/s]] (a) relative to the ground, (b) relative to the player.`,
 fig: figBA([{t:'Before',o:[{x:120,w:50,l:'player+ball',d:1,v:'1.95 m/s'}]},{t:'After',o:[{x:100,w:44,l:'player',d:1,v:'v = ?'},{x:220,w:30,l:'ball',d:1,v:'faster'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  bl('info','Momentum before.',['p_before = ({} + {}) × 1.95 = {} kg·m/s'],[nb(67),nb(0.43),nb(131.49)]),
  bl('solve','(a) Ball at 13.5 m/s relative to the GROUND.',['131.49 = 67.0 v + 0.430 × {}','v = {} m/s'],[nb(13.5),nb(1.876)]),
  {type:'num', ph:'solve', prompt:'(a) Player\'s speed:', sym:'v', unit:'m/s', ans:(67.43*1.95-0.43*13.5)/67, slips:[{v:(67*1.95-0.43*13.5)/67,msg:'Before the throw the ball moves with him: include its momentum.'}]},
  {type:'mcq', ph:'link', prompt:'(b) Now the ball leaves at 13.5 m/s relative to the PLAYER. Its velocity relative to the ground is…', opts:[o('v + 13.5, where v is the player\'s final velocity',1,'Velocities relative to the player add on top of his own velocity.'),o('13.5 m/s',0,'That is relative to the player, not the ground.'),o('1.95 + 13.5',0,'The player\'s velocity changes during the throw: use his FINAL velocity.')]},
  bl('solve','(b) Solve.',['131.49 = 67.0 v + 0.430 (v + 13.5)','131.49 − {} = 67.43 v','v = {} m/s'],[nb(5.805),nb(1.864)]),
  {type:'num', ph:'solve', prompt:'(b) Player\'s speed:', sym:'v', unit:'m/s', ans:(67.43*1.95-0.43*13.5)/67.43, slips:[{v:(67.43*1.95-0.43*13.5)/67,msg:'Put the ball\'s velocity as (v + 13.5): the v terms combine into 67.43 v.'}]}
 ]})},
{id:'20d', lv:20, title:'Train Cars Coupling', make:()=>({
 text:`Three [[identical|each car has mass m]] train cars, coupled together, are rolling east at speed [[v₀|3 cars at v₀]]. A fourth identical car traveling east at [[2v₀|1 car at 2v₀]] catches up and [[couples|perfectly inelastic: they move together|hidden]] to make a four-car train. A moment later the train hits a fifth identical car [[at rest|5th car: v = 0|hidden]], and it couples to make a five-car train. What is the speed of the five-car train?`,
 fig: figBA([{t:'Collision 1',o:[{x:20,w:30,l:'4',d:1,v:'2v₀'},{x:120,w:30,l:'1'},{x:152,w:30,l:'2'},{x:184,w:30,l:'3',d:1,v:'v₀'}]},{t:'Collision 2',o:[{x:60,w:120,l:'4-car train',d:1,v:'v₄'},{x:250,w:30,l:'5',v:'rest'}]},{t:'After',o:[{x:110,w:150,l:'5-car train',d:1,v:'v₅ = ?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'system', prompt:'How should you organise this problem?', opts:[o('Two collisions, one after the other, each conserving momentum',1,'Or one step: total momentum never changes.'),o('Use energy conservation',0,'Coupling is perfectly inelastic: kinetic energy is lost.'),o('Use Newton\'s 2nd law with the coupling forces',0,'You do not know those forces.')]},
  bl('solve','Collision 1.',['Before:  3m v₀ + m (2v₀) = {} m v₀','After:  4m v₄','v₄ = {} v₀'],[nb(5),nb(1.25)]),
  bl('solve','Collision 2.',['Before:  4m × v₄ = {} m v₀','After:  5m v₅','v₅ = {} v₀'],[nb(5),nb(1)]),
  {type:'num', ph:'solve', prompt:'v₅ as a multiple of v₀ (the number in front of v₀):', sym:'v₅ / v₀', unit:'', ans:1, explain:'v₅ = v₀. Type v_0 in Mastering.'},
  pr('check','Shortcut: why can you skip the middle step?',[o('The total momentum, 5m v₀, never changes',1),o('The middle step is always zero'),o('Each car keeps its own momentum')],[o('only internal coupling forces act between the cars',1,'Final: 5m v₅ = 5m v₀.'),o('the fifth car was at rest'),o('identical cars always share speeds equally')])
 ]})},
{id:'20e', lv:20, title:'Packages on the Chute', make:()=>({
 text:`A package of mass [[m|m]] is [[released from rest|v₀ = 0|hidden]] at a loading dock and slides down a [[6.0 m-high|h = 6.0 m]], [[frictionless|mechanical energy is conserved on the chute|hidden]] chute. At the bottom sits a package of mass [[2m|m₂ = 2m, at rest]]. Find (a) their common speed if they stick together, and (b) the rebound height of package m if the collision is perfectly elastic.`,
 fig: figPackages(),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'system', prompt:'Is momentum conserved while package m slides DOWN the chute?', opts:[o('No: gravity (an external force) speeds it up. Use energy for this part',1,'Momentum is only conserved during the brief collision.'),o('Yes, always',0,'Gravity is an external force that changes its momentum.')]},
  dr('Draw the free-body diagram of package m on the chute (a slope descending to the RIGHT).',[fo('n','chute pushing perpendicular to it',60,1,'Contact.'),fo('mg','weight',-90,1,'Gravity.'),fo('f','friction',150,0,'The chute is frictionless.')],[],{slope:-30}),
  bl('solve','Stage 1: speed at the bottom from energy.',['m g h = ½ m v²','v = √(2 × 9.8 × {}) = {} m/s'],[nb(6),nb(10.84)]),
  bl('solve','(a) Perfectly inelastic.',['m v = (m + 2m) V','V = v / {} = {} m/s'],[nb(3),nb(3.614)]),
  {type:'num', ph:'solve', prompt:'(a) Common speed:', sym:'V', unit:'m/s', ans:Math.sqrt(117.6)/3, slips:[{v:Math.sqrt(117.6)/2,msg:'The total mass is m + 2m = 3m.'}]},
  bl('solve','(b) Perfectly elastic, target at rest.',['v_1f = (m − 2m)/(m + 2m) × v = {} × v = {} m/s','Rebound height: h = v_1f² / (2g) = {} m'],[nb(-1/3),nb(-3.614),nb(0.6667)]),
  {type:'num', ph:'solve', prompt:'(b) Rebound height of package m:', sym:'h', unit:'m', ans:6/9, slips:[{v:6/3,msg:'Height goes with v²: (1/3)² = 1/9 of 6.0 m.'}]},
  pr('check','In (b), package m comes back up the chute because…',[o('it is lighter than the package it hits',1),o('elastic collisions always reverse both objects'),o('the chute pushes it back')],[o('m₁ − m₂ < 0, so v_1f is negative',1),o('kinetic energy must be shared equally'),o('momentum must point backward afterwards')])
 ]})},
{id:'20f', lv:20, title:'Proton Hits a Carbon Atom', make:()=>({
 text:`A proton is traveling [[to the right|+ = right]] at [[2.0 × 10⁷ m/s|v_1i = 2.0e7 m/s]]. It has a head-on [[perfectly elastic|momentum AND kinetic energy conserved|hidden]] collision with a carbon atom [[at rest|v_2i = 0|hidden]]. The mass of the carbon atom is [[12 times the mass of the proton|m₂ = 12 m₁]].`,
 fig: figBA([{t:'Before',o:[{x:60,w:26,l:'p',d:1,v:'2.0e7 m/s'},{x:200,w:50,l:'C (12m)',v:'rest'}]},{t:'After',o:[{x:60,w:26,l:'p',d:-1,v:'?'},{x:220,w:50,l:'C',d:1,v:'?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'Why can you use the elastic-collision formulas here?', opts:[o('The collision is perfectly elastic, head-on, and the target starts at rest',1,'Those are exactly the formulas\' conditions.'),o('Because the proton is small',0,'Size is not the reason.'),o('Every atomic collision uses them',0,'Only perfectly elastic ones.')]},
  bl('solve','Proton after the collision.',['(m₁ − m₂)/(m₁ + m₂) = (1 − 12)/13 = {}','v_1f = {} × 2.0e7 = {} m/s'],[nb(-11/13),nb(-11/13),nb(-1.692e7)]),
  {type:'num', ph:'solve', prompt:'Speed of the proton after the collision:', sym:'v_p', unit:'m/s', ans:1.692e7, slips:[{v:2e7*13/11,msg:'The fraction is (1 − 12)/(1 + 12) = −11/13.'}]},
  bl('solve','Carbon atom after the collision.',['2m₁ / (m₁ + m₂) = 2/13 = {}','v_2f = {} × 2.0e7 = {} m/s'],[nb(2/13),nb(2/13),nb(3.077e6)]),
  {type:'num', ph:'solve', prompt:'Speed of the carbon atom:', sym:'v_C', unit:'m/s', ans:3.077e6, slips:[{v:2e7/12,msg:'Use v_2f = 2m₁/(m₁ + m₂) × v_1i.'}]},
  {type:'mcq', ph:'check', prompt:'Which way does the proton go after the collision?', opts:[o('To the left: it bounces back',1,'v_1f is negative.'),o('To the right',0,'Check the sign of v_1f.'),o('It stops',0,'Only for equal masses.')]},
  bl('check','Check that momentum is conserved (in units of m₁ × 10⁶ m/s).',['Before: {}','After: 1 × (−16.92) + 12 × 3.077 = {}'],[nb(20),nb(20)])
 ]})},
/* ---------- LEVEL 21: CHAPTER 11 CLASS PROBLEMS ---------- */
{id:'21a', lv:21, title:'Problem 2: Rubber Ball Bounce', make:()=>({
 text:`A [[200 g|m = 0.200 kg|hidden]] rubber ball is [[released|v₀ = 0|hidden]] from a height of [[2.0 m|h₁ = 2.0 m]]. It collides with the floor and bounces back up. The graph shows the force on the ball by the floor: a triangle from [[10 ms to 20 ms|Δt = 10 ms = 0.010 s|hidden]] with a peak of [[480 N|F_max = 480 N]]. How high does the ball rebound?`,
 fig: figDrop() + figFt({pts:[[0,0],[10,0],[15,480],[20,0],[25,0]], xmax:25, ymin:0, ymax:540, xt:[10,20], yt:[[480,'480']], xl:'t (ms)', yl:'F_BF (N)'}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.', explain:'Three stages: fall (energy or kinematics), bounce (impulse), rise (energy or kinematics).'},
  bl('solve','Stage 1: speed just before hitting the floor.',['v = √(2 g h) = √(2 × 9.8 × {}) = {} m/s, pointing {}'],[nb(2),nb(6.261),UD('down')]),
  dr('Draw the free-body diagram of the ball WHILE it is squashed against the floor.',[fo('F_BF','floor pushing up',90,1,'The floor pushes up on the ball.'),fo('mg','weight',-90,1,'Gravity.'),fo('F↓','ball pushing down on the floor',-90,0,'That force acts on the floor, not the ball.')],[['F_BF','>','mg','the floor force reaches 480 N; mg is only 1.96 N']]),
  bl('solve','Stage 2: the bounce (+ = up). Ignore gravity during the 10 ms (impulse approximation).',['p_i = 0.200 × (−{}) = {} kg·m/s','J = area of the triangle = ½ × {} s × 480 N = {} N·s','p_f = p_i + J = {} kg·m/s','v_f = p_f / m = {} m/s'],[nb(6.261),nb(-1.252),nb(0.01),nb(2.4),nb(1.148),nb(5.739)]),
  bl('solve','Stage 3: rise to the top, where v = 0.',['h = v_f² / (2g) = {}² / 19.6'],[nb(5.739)]),
  {type:'num', ph:'solve', prompt:'Rebound height (impulse approximation):', sym:'h', unit:'m', ans:5.739*5.739/19.6, slips:[{v:1.62,msg:'Close: you included gravity\'s impulse (−0.0196 N·s). That is more exact, but this problem uses the impulse approximation, which gives 1.68 m.'},{v:2.4*2.4/0.04/19.6,msg:'Start from p_i = −1.25 kg·m/s, not from rest: the ball was already moving down.'},{v:2,msg:'A real ball loses some energy: use the impulse from the graph.'}]},
  pr('check','The ball rebounds lower than 2.0 m. Is that reasonable?',[o('Yes',1),o('No, it should return to 2.0 m')],[o('the impulse 2.4 N·s is less than the 2 × 1.25 = 2.5 N·s a perfect bounce needs',1,'Some energy goes into heat and sound.'),o('momentum is conserved, so it must return to the same height')])
 ]})},
{id:'21b', lv:21, title:'Problem 5: Is Momentum Conserved?', make:()=>({
 text:`Momentum of a SYSTEM is conserved only when the net external force on that system is zero. Decide for each scenario, and say which system you mean.`,
 fig: figPendulum() + figBA([{t:'Before',o:[{x:50,w:40,l:'car 1',d:1,v:'v'},{x:230,w:40,l:'car 2',d:-1,v:'v'}]},{t:'After',o:[{x:140,w:80,l:'stuck together',v:'v_f = ?'}]}]),
 steps:[
  pr('system','a. An apple falls from a tree. System = the apple. Is its momentum conserved?',[o('No',1),o('Yes')],[o('gravity is an external force on the apple, so its momentum grows downward',1,'Look at the arrows: v_f is longer than v_i.'),o('nothing touches the apple while it falls'),o('momentum is always conserved')]),
  pr('system','Same apple, but now the system is the apple + the Earth.',[o('Conserved',1),o('Not conserved')],[o('gravity is now internal: the Earth pulls the apple and the apple pulls the Earth equally',1,'The Earth moves up an immeasurably tiny amount.'),o('the Earth is too big to move'),o('the apple still speeds up')]),
  pr('system','b. A pendulum bob swings up. System = the bob. Is its momentum conserved?',[o('No',1),o('Yes')],[o('gravity and the tension are external and do not cancel; the bob slows down and changes direction',1),o('the string holds it, so nothing changes'),o('the speed is the same at both ends of the swing')]),
  {type:'fbd', ph:'system', prompt:'c. Two identical cars collide head-on and stick. System = both cars. Click the EXTERNAL forces.', forces:[{l:'Weight of car 1',a:-90,ok:1,why:'Earth is outside.'},{l:'Weight of car 2',a:-90,ok:1,why:'Earth is outside.'},{l:'Road pushing up on car 1',a:90,ok:1,why:'The road is outside.'},{l:'Road pushing up on car 2',a:90,ok:1,why:'The road is outside.'},{l:'Car 2 pushing car 1 (N₁₂)',a:180,ok:0,why:'Internal.'},{l:'Car 1 pushing car 2 (N₂₁)',a:0,ok:0,why:'Internal, the 3rd-law partner of N₁₂.'}]},
  pr('law','c. Is the momentum of the two-car system conserved?',[o('Yes',1),o('No')],[o('the external forces are all vertical and cancel: the net force on the system is zero',1),o('the cars stop, so momentum is lost'),o('the collision forces are huge')]),
  bl('solve','c. Find the final velocity (+ = car 1\'s direction).',['Before: m v + m (−v) = {}','After: 2m v_f = 0, so v_f = {}'],[nb(0),nb(0)]),
  pr('check','The cars stop dead. Where did the momentum go?',[o('Nowhere: the total was already zero',1),o('It was destroyed in the crash')],[o('equal and opposite momenta add to zero before and after',1),o('kinetic energy and momentum are the same thing')])
 ]})},
{id:'21c', lv:21, title:'Problem 7: Cars Stick Together', make:()=>({
 text:`A [[1000 kg|m₁ = 1000 kg]] car moving at [[2 m/s|v_1i = 2 m/s]] hits a [[2000 kg|m₂ = 2000 kg]] car that was [[initially not moving|v_2i = 0|hidden]]. After the collision they [[stick together|completely inelastic: one final velocity|hidden]].`,
 fig: figBA([{t:'Before',o:[{x:40,w:60,l:'1000 kg',d:1,v:'2 m/s'},{x:190,w:80,l:'2000 kg',v:'rest'}]},{t:'After',o:[{x:150,w:140,l:'1000 + 2000 kg',d:1,v:'v_f = ?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'system', prompt:'a. What system do you choose?', opts:[o('Both cars',1,'Then the collision forces are internal.'),o('The 1000 kg car alone',0,'Then the unknown collision force is external and momentum is not conserved.'),o('The road',0,'The road is not moving.')]},
  pr('law','c. Is momentum conserved for this system?',[o('Yes',1),o('No')],[o('weights and normal forces cancel, and friction is negligible during the short crash',1),o('the cars lose kinetic energy, so momentum must be lost too')]),
  bl('solve','d. Before = after.',['1000 × 2 + 2000 × 0 = ({} + {}) v_f','v_f = {} m/s'],[nb(1000),nb(2000),nb(2/3)]),
  {type:'num', ph:'solve', prompt:'d. Speed after the collision:', sym:'v_f', unit:'m/s', ans:2/3, slips:[{v:1,msg:'Use the combined mass, 3000 kg.'}]},
  bl('solve','e. Impulse on each car: J = Δp.',['Car 1: 1000 × ({} − 2) = {} N·s','Car 2: 2000 × ({} − 0) = {} N·s'],[nb(2/3),nb(-1333.3),nb(2/3),nb(1333.3)]),
  pr('check','The two impulses are equal and opposite because…',[o("of Newton's 3rd law: each car pushes the other equally, for the same time",1),o('the cars have different masses'),o('kinetic energy is conserved')],[o('that is exactly why the total momentum is conserved',1),o('it is a coincidence of these numbers')])
 ]})},
{id:'21d', lv:21, title:'Problem 8: Carts Pushed Apart', make:()=>({
 text:`Two carts, 1 ([[m₁ = 0.5 kg|m₁ = 0.5 kg]]) and 2 (mass m₂), have repulsive magnets and are tied together with a string. They are [[initially at rest|total p = 0|hidden]]. After the string is cut, cart 1 moves at [[0.4 m/s to the right|v₁ = +0.4 m/s]] and cart 2 moves [[to the left at 0.2 m/s|v₂ = −0.2 m/s]]. Find m₂.`,
 fig: figBA([{t:'Before',o:[{x:120,w:40,l:'1',v:'rest'},{x:166,w:40,l:'2',v:'rest'}]},{t:'After',o:[{x:220,w:40,l:'1',d:1,v:'0.4 m/s'},{x:120,w:40,l:'2',d:-1,v:'0.2 m/s'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues, with signs.'},
  {type:'mcq', ph:'law', prompt:'This is an "explosion". What is the total momentum afterward?', opts:[o('Zero, the same as before',1,'The magnet forces are internal.'),o('0.2 kg·m/s to the right',0,'That is only cart 1.'),o('It cannot be known',0,'It was zero before, so it is zero after.')]},
  bl('solve','Before = after (+ = right).',['0 = 0.5 × ({}) + m₂ × ({})','m₂ = {} kg'],[nb(0.4),nb(-0.2),nb(1)]),
  {type:'num', ph:'solve', prompt:'Mass of cart 2:', sym:'m₂', unit:'kg', ans:1, slips:[{v:0.25,msg:'Cart 2 is SLOWER, so it must be HEAVIER: m₂ = 0.5 × 0.4 / 0.2.'},{v:-1,msg:'A mass is positive. The minus sign belongs to the velocity.'}]},
  pr('check','Cart 2 is twice as heavy and moves half as fast. That is because…',[o('both carts get equal and opposite momenta',1),o('both carts get the same speed'),o('heavier objects are pushed harder')],[o('m₁v₁ = −m₂v₂',1),o('the magnets push the lighter cart harder')])
 ]})},
{id:'21e', lv:21, title:'Problem 9: Bullet in a Sliding Block', make:()=>({
 text:`A [[10 g|m_b = 0.010 kg|hidden]] bullet is fired into a [[1.0 kg|m_w = 1.0 kg]] wood block, where it [[lodges|completely inelastic: they move together|hidden]]. Afterward the block slides [[4.0 m|d = 4.0 m]] across a floor ([[μₖ = 0.20|μₖ = 0.20]] for wood on wood) and [[stops|v_final = 0|hidden]]. What was the bullet's speed?`,
 fig: figBA([{t:'Before',o:[{x:30,w:20,l:'b',d:1,v:'v = ?'},{x:120,w:50,l:'block',v:'rest'}]},{t:'Just after',o:[{x:120,w:50,l:'block+b',d:1,v:'V'}]},{t:'Later',o:[{x:250,w:50,l:'block+b',v:'stopped 4.0 m later'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.', explain:'Work BACKWARD: the slide tells you V just after the collision; the collision then tells you the bullet speed.'},
  {type:'mcq', ph:'system', prompt:'Which stage conserves momentum?', opts:[o('Only the brief collision',1,'During the slide, friction (external) removes momentum.'),o('Only the slide',0,'Friction acts during the slide.'),o('Both',0,'Friction is an external force during the slide.')]},
  dr('Draw the free-body diagram of block + bullet while SLIDING to the right.',[fo('n','floor pushing up',90,1,'Contact.'),fo('mg','weight',-90,1,'Gravity.'),fo('f_k','kinetic friction',180,1,'Opposes the sliding.'),fo('F_b','force of the bullet',0,0,'The bullet is now part of the block. Nothing pushes it forward.')],[['n','=','mg','no vertical acceleration']]),
  bl('solve','Stage 2, the slide (backward).',['a = −μₖ g = −{} m/s²','0 = V² − 2 μₖ g d, so V = √(2 × 0.20 × 9.8 × {}) = {} m/s'],[nb(1.96),nb(4),nb(3.96)]),
  bl('solve','Stage 1, the collision.',['m_b v = (m_b + m_w) V','v = ({} + {}) × {} / {}'],[nb(0.01),nb(1),nb(3.96),nb(0.01)]),
  {type:'num', ph:'solve', prompt:'Bullet speed:', sym:'v', unit:'m/s', ans:1.01*Math.sqrt(15.68)/0.01, slips:[{v:Math.sqrt(15.68)/0.01,msg:'After lodging, the mass is 1.01 kg, not 1.0 kg.'},{v:Math.sqrt(2*0.2*4)*1.01/0.01,msg:'Include g in the friction deceleration: a = μₖ g.'}]}
 ]})},
{id:'21f', lv:21, title:'Problem 10: Three Clay Balls (2-D)', make:()=>({
 text:`Three balls of clay move as shown: [[40 g at 4.0 m/s, 45° below the +x axis|40 g: v = 4.0 m/s at −45°]], [[30 g at 3.0 m/s to the left|30 g: v = −3.0 m/s along x]], and [[20 g at 2.0 m/s up|20 g: v = +2.0 m/s along y]]. They hit simultaneously and [[stick together|one final velocity, total mass 90 g|hidden]]. Find the velocity of the big blob.`,

 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'How do you conserve momentum in two dimensions?', opts:[o('Separately for x and for y',1,'Momentum is a vector: each component is conserved.'),o('Add the speeds',0,'Speeds do not add like that.'),o('Use only the biggest ball',0,'All three contribute.')]},
  bl('solve','x-components (kg·m/s).',['40 g:  0.040 × 4.0 cos 45° = {}','30 g:  0.030 × (−3.0) = {}','20 g:  {}','P_x = {}'],[nb(0.1131),nb(-0.09),nb(0),nb(0.0231)]),
  bl('solve','y-components (kg·m/s).',['40 g:  0.040 × (−4.0 sin 45°) = {}','30 g:  {}','20 g:  0.020 × 2.0 = {}','P_y = {}'],[nb(-0.1131),nb(0),nb(0.04),nb(-0.0731)]),
  bl('solve','Final velocity components (M = 0.090 kg).',['v_x = P_x / M = {} m/s','v_y = P_y / M = {} m/s'],[nb(0.2571),nb(-0.8127)]),
  {type:'num', ph:'solve', prompt:'Speed of the blob:', sym:'v', unit:'m/s', ans:0.8524, slips:[{v:0.2571+0.8127,msg:'Combine the components with Pythagoras.'}]},
  {type:'num', ph:'solve', prompt:'Direction: angle BELOW the +x axis, tan θ = |v_y| / v_x.', sym:'θ', unit:'°', ans:72.44, slips:[{v:17.56,msg:'That is measured from the y-axis. Use tan θ = |v_y| / v_x.'}]}
 ]})},
{id:'21g', lv:21, title:'Problem 11: Clay Ball or Tennis Ball?', make:()=>({
 text:`Which is better for closing your bedroom door without getting up: tossing a [[clay ball that sticks|clay: v goes from +v to 0|hidden]] to the door, or a [[tennis ball of equal mass that bounces back|tennis ball: v goes from +v to about −v|hidden]]? Assume the [[same throw speed|same v, same m|hidden]].`,
 fig: figBA([{t:'Clay',o:[{x:60,w:30,l:'clay',d:1,v:'v'},{x:240,w:40,l:'door'}]},{t:'Tennis',o:[{x:60,w:30,l:'ball',d:1,v:'v'},{x:240,w:40,l:'door'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Find the hidden clues.'},
  bl('law','Change in momentum of each ball (+ = toward the door).',['Clay: Δp = 0 − mv = {} mv','Tennis: Δp = (−mv) − mv = {} mv'],[nb(-1),nb(-2)]),
  pr('law','The impulse ON THE DOOR is…',[o('twice as big from the tennis ball',1),o('the same for both'),o('bigger from the clay ball')],[o("by the 3rd law the door gets −Δp of the ball, and the tennis ball's Δp is twice as big",1),o('both balls have the same momentum before they hit'),o('the clay stays on the door and keeps pushing')]),
  {type:'mcq', ph:'check', prompt:'So which closes the door better?', opts:[o('The tennis ball',1,'Bouncing back means a bigger momentum change, so a bigger push on the door.'),o('The clay ball',0,'It only stops; the tennis ball stops AND reverses.')]},
  pr('check','Follow-up: in a punch, which delivers the bigger impulse to the opponent, pulling the fist back quickly (karate) or following through (boxing)?',[o('Pulling back (karate)',1),o('Following through (boxing)')],[o('the fist reverses, like the bouncing tennis ball, so its momentum change is bigger, delivered in a very short time',1,'Following through pushes for longer, which moves the opponent more but with a smaller peak force.'),o('a longer contact always gives a bigger force')])
 ]})},
{id:'21h', lv:21, title:'Problem 12: Snow Fills a Railroad Car', rnd:true, make:()=>{ const v0=R(6,10,0.2), rate=R(2.5,4.5,0.5), t=R(60,120,10), ms=rate*t, vf=3800*v0/(3800+ms); return {
 text:`A [[3800 kg|M = 3800 kg]] open railroad car coasts at a constant [[${v0} m/s|v_i = ${v0} m/s]] on a level track. Snow [[falls vertically|snow brings NO horizontal momentum|hidden]] and fills the car at a rate of [[${rate} kg/min|rate = ${rate} kg/min]]. [[Ignoring friction|no horizontal external force|hidden]], what is the speed of the car after [[${t} min|t = ${t} min]]?`,
 fig: figBA([{t:'Before',o:[{x:110,w:100,l:'3800 kg',d:1,v:v0+' m/s'}]},{t:'After',o:[{x:110,w:100,l:'car + snow',d:1,v:'v = ?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'fbd', ph:'system', prompt:'System: car + snow. Click the external forces with a HORIZONTAL part.', forces:[{l:'Weight of the car',a:-90,ok:0,why:'Vertical.'},{l:'Normal force from the track',a:90,ok:0,why:'Vertical.'},{l:'Friction from the track',a:180,ok:0,why:'Ignored in this problem.'},{l:'Air drag',a:180,ok:0,why:'Not included.'}], explain:'None! So the horizontal momentum is conserved.'},
  pr('law','The car slows down even though no horizontal force acts. Why?',[o('The same momentum is shared by more and more mass',1),o('The snow pushes it backward'),o('Friction')],[o('the snow arrives with zero horizontal velocity and must be sped up to the car\'s speed',1),o('falling snow hits the car from the front'),o('the track is not frictionless')]),
  bl('solve','Before = after (horizontal).',['Snow mass: {} kg/min × {} min = {} kg','3800 × {} = (3800 + {}) v'],[nb(rate),nb(t),nb(ms),nb(v0),nb(ms)]),
  {type:'num', ph:'solve', prompt:'Speed after the snowfall:', sym:'v', unit:'m/s', ans:vf, slips:[{v:v0,msg:'The car gains mass, so with the same momentum it must slow down.'},{v:3800*v0/(3800+rate),msg:'Multiply the rate by the time to get the total snow mass.'}]}
 ]};}},
/* ---------- LEVEL 22: CHAPTER 11 REVIEW QUESTIONS ---------- */
{id:'22a', lv:22, title:'Car Hits a Truck at a Crossing (2-D)', make:()=>({
 text:`A car traveling [[north at 20.0 m/s|car: v = +20.0 m/s along y (north)]] collides [[perfectly inelastically|they stick: one final velocity|hidden]] with a truck moving [[10.0 m/s toward the east|truck: v = +10.0 m/s along x (east)]]. The truck has [[1.50 times the mass of the car|m_car = M, m_truck = 1.50M]]. What is the direction of the wreck just after the crash, as an angle north of east?`,
 fig: svg(260,190, `<line x1="20" y1="120" x2="250" y2="120" stroke="#ccc"/><line x1="140" y1="10" x2="140" y2="185" stroke="#ccc"/>` + tx(240,134,'E','font-size="12" fill="#777"') + tx(146,20,'N','font-size="12" fill="#777"') + `<rect x="128" y="150" width="24" height="30" fill="#f4dcd2" stroke="#555"/>` + tx(158,172,'car M','font-size="11"') + ar(140,148,140,128,'G') + tx(146,140,'20.0 m/s','font-size="10"') + `<rect x="40" y="108" width="44" height="24" fill="#cfe0f0" stroke="#555"/>` + tx(36,100,'truck 1.50M','font-size="11"') + ar(86,120,118,120,'G') + tx(84,146,'10.0 m/s','font-size="10"') + ar(140,120,176,72,'O') + tx(180,72,'v_f = ?',IT('O'))),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Notice which vehicle moves along which axis.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: how do you get a direction out of a collision?', why:'Knowing the route first tells you why you need two components.', opts:[o('Conserve momentum separately along x and y, get v_fx and v_fy, then θ = tan⁻¹(v_fy / v_fx)',1,'A direction comes from two components.'),o('Add the two speeds',0,'Velocities at right angles do not add like numbers.'),o('Use energy conservation',0,'A perfectly inelastic collision loses kinetic energy.')], explain:'<b>Roadmap:</b> total momentum in x and y → divide by the total mass 2.50M → angle from the components.'},
  bl('solve','Total momentum (in units of M·m/s).',['x (east): only the truck moves this way:  p_x = 1.50 × {} = {}','y (north): only the car moves this way:  p_y = 1 × {} = {}'],[nb(10),nb(15),nb(20),nb(20)],'M never needs a value: it cancels at the end.'),
  bl('solve','After the crash the mass is M + 1.50M = 2.50M.',['v_fx = 15 / 2.50 = {} m/s','v_fy = 20 / 2.50 = {} m/s'],[nb(6),nb(8)]),
  {type:'num', ph:'solve', prompt:'Angle north of east: θ = tan⁻¹(v_fy / v_fx).', sym:'θ', unit:'°', ans:53.13, slips:[{v:36.87,msg:'That is measured from north. Use tan θ = v_fy / v_fx.'},{v:63.43,msg:'You used the velocities before the crash (20 / 10). Use the momenta: the truck is heavier.'}]},
  {type:'num', ph:'solve', prompt:'Final speed of the wreck: v_f = √(v_fx² + v_fy²).', sym:'v_f', unit:'m/s', ans:10, slips:[{v:14,msg:'Combine perpendicular components with Pythagoras, not by adding.'}], explain:'A 6-8-10 right triangle.'},
  pr('check','The wreck heads closer to north than east. Why?',[o('The car carries more momentum (20M) than the truck (15M)',1),o('The car is faster, and speed is what counts')],[o('momentum, not speed, decides the direction of the wreck',1),o('the lighter object always wins')])
 ]})},
{id:'22a2', lv:22, title:'Car Hits a Truck: Final Speed', make:()=>({
 text:`A car traveling [[north at 20.0 m/s|car: v = +20.0 m/s along y]] collides [[perfectly inelastically|they stick together|hidden]] with a truck moving [[10.0 m/s toward the east|truck: v = +10.0 m/s along x]]. The truck has [[1.50 times the mass of the car|m_truck = 1.50M, m_car = M]]. What is the final speed of the two vehicles just after the crash?`,
 fig: MS.find(m=>m.id==='22a').make().fig,
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: why can\'t you just average the two speeds?', opts:[o('The velocities point in different directions and the masses differ: you must add momentum components',1,'Then combine the components.'),o('You can: (20 + 10) / 2 = 15 m/s',0,'Speeds at right angles do not average.'),o('Use energy conservation',0,'Kinetic energy is lost in a sticking collision.')]},
  bl('solve','Momentum components, in units of M·m/s.',['East (x): 1.50 × 10.0 = {}','North (y): 1 × 20.0 = {}'],[nb(15),nb(20)]),
  bl('solve','Divide by the total mass 2.50M.',['v_fx = {} m/s','v_fy = {} m/s'],[nb(6),nb(8)]),
  {type:'num', ph:'solve', prompt:'Final speed: v_f = √(v_fx² + v_fy²).', sym:'v_f', unit:'m/s', ans:10, slips:[{v:14,msg:'Combine perpendicular components with Pythagoras, not by adding.'},{v:15,msg:'You cannot average speeds in different directions.'}], explain:'A 6-8-10 right triangle: twice the 3-4-5 triangle.'},
  pr('check','The wreck is slower than the car was. Is momentum lost?',[o('No',1),o('Yes')],[o('the same momentum is now carried by 2.5 times the car\'s mass, in a direction between the two',1),o('crashes always destroy momentum')])
 ]})},
{id:'22b', lv:22, title:'Elastic Collision: M Hits 3M', make:()=>({
 text:`A ball of mass [[M|m₁ = M]] moving with [[velocity v₀ î|v_1i = +v₀]] collides [[elastically|perfectly elastic: momentum AND kinetic energy conserved|hidden]] with a ball of mass [[3M|m₂ = 3M]] [[at rest|v_2i = 0|hidden]]. What is the final velocity of the 3M ball?`,
 fig: figBA([{t:'Before',o:[{x:60,w:30,l:'M',d:1,v:'v₀'},{x:200,w:50,l:'3M',v:'rest'}]},{t:'After',o:[{x:60,w:30,l:'M',d:-1,v:'?'},{x:220,w:50,l:'3M',d:1,v:'?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'Which formula gives the TARGET ball\'s velocity?', why:'The elastic-collision formulas only apply when the target starts at rest, which is the case here.', opts:[o('v_2f = 2m₁ / (m₁ + m₂) × v_1i',1,'Target = the ball that was at rest.'),o('v_1f = (m₁ − m₂)/(m₁ + m₂) × v_1i',0,'That is for the ball that was moving.'),o('v_2f = v_1i',0,'Only for equal masses.')]},
  bl('solve','Substitute m₁ = M and m₂ = 3M.',['2M / (M + 3M) = {}','v_2f = {} v₀'],[nb(0.5),nb(0.5)]),
  {type:'mcq', ph:'solve', prompt:'Final velocity of the 3M ball:', opts:[o('+½ v₀ î (forward)',1,'The target always moves forward, the way it was hit.'),o('−½ v₀ î',0,'A ball at rest that gets hit moves forward.'),o('+v₀ î',0,'Only equal masses swap velocities.'),o('+¼ v₀ î',0,'Check: 2M / 4M = ½.')]},
  bl('check','And the first ball, M?',['v_1f = (M − 3M)/(M + 3M) v₀ = {} v₀, so it bounces {}'],[nb(-0.5),sl('back',['forward'])]),
  bl('check','Check momentum (units of M v₀).',['Before: {}','After: 1 × (−0.5) + 3 × 0.5 = {}'],[nb(1),nb(1)])
 ]})},
{id:'22c', lv:22, title:'Head-On: m at 2v Meets 2m at v', make:()=>({
 text:`Two balls are about to collide head-on. Ball A has mass [[m|m_A = m]] and speed [[2v|v_A = +2v (moving right)]]; ball B has mass [[2m|m_B = 2m]] and speed [[v|v_B = −v (moving left)]]. The system of the two balls is [[isolated|no net external force: total momentum conserved|hidden]]. What must be true just after the collision?`,
 fig: figBA([{t:'Before',o:[{x:60,w:30,l:'A, m',d:1,v:'2v'},{x:220,w:40,l:'B, 2m',d:-1,v:'v'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues, with signs.'},
  bl('solve','Total momentum before (+ = right).',['A: m × 2v = {} mv','B: 2m × (−v) = {} mv','Total: {} mv'],[nb(2),nb(-2),nb(0)]),
  {type:'mcq', ph:'law', prompt:'Just after the collision…', why:'Conservation tells you the TOTAL, but not how it is shared, unless you know more about the collision.', opts:[o('the total momentum of the system must be zero',1,'That is the only thing you can be sure of.'),o('both balls must be at rest',0,'That gives zero total, but so do many other outcomes.'),o('both balls must rebound with their original speeds',0,'Also zero total, but it is not the only possibility.'),o('one ball must be at rest',0,'Then the other ball alone would carry momentum: the total would not be zero.')]},
  pr('check','If the balls stick together, the lump…',[o('stops',1),o('moves right'),o('moves left')],[o('one object with zero total momentum must have zero velocity',1),o('ball A was faster'),o('ball B is heavier')])
 ]})},
{id:'22d', lv:22, title:'Rocket Exhaust Speed', make:()=>({
 text:`A rocket that ejects [[10.0% of its mass as exhaust|fuel mass = 0.100 M, where M is the mass that is left|hidden]] can reach a maximum speed of [[45.0 m/s|v_max = 45.0 m/s]]. It [[starts from rest|v₀ = 0|hidden]]. What is the exhaust speed of the fuel?`,
 fig: '',
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'Which equation connects the rocket\'s speed, the exhaust speed and the masses?', why:'A rocket loses mass as it goes, so you cannot use F = ma with one mass. The rocket equation handles the changing mass.', opts:[o('v_max = v_ex ln(M_initial / M_final)',1,'The rocket equation, starting from rest.'),o('v_max = v_ex × (fuel mass / rocket mass)',0,'That ignores that the rocket gets lighter as it burns.'),o('m v = constant',0,'The rocket\'s own momentum is not constant: the exhaust carries momentum away.')]},
  bl('solve','The mass ratio, as the answer key reads it (fuel = 10% of the remaining mass M).',['M_initial = M + 0.100 M = {} M','M_initial / M_final = {}'],[nb(1.1),nb(1.1)]),
  bl('solve','Solve for v_ex.',['ln(1.10) = {}','v_ex = 45.0 / {}'],[nb(0.09531),nb(0.09531)]),
  {type:'num', ph:'solve', prompt:'Exhaust speed:', sym:'v_ex', unit:'m/s', ans:45/Math.log(1.1), slips:[{v:45/Math.log(1/0.9),msg:'That reads "10% of the starting mass" (ratio 1/0.900, giving 427 m/s). Your homework\'s key uses the ratio 1.10, giving 472 m/s.'},{v:450,msg:'Use the logarithm: v_max = v_ex ln(ratio), not v_ex × 0.100.'}]},
  pr('check','The exhaust is about 10 times faster than the rocket. Is that reasonable?',[o('Yes',1),o('No')],[o('only a small fraction of the mass is thrown out, so it must be thrown out fast',1),o('the exhaust should match the rocket speed')])
 ]})},
{id:'22f', lv:22, title:'Two Balls Meeting at 45°', make:()=>({
 text:`Two balls approach the point marked ⊗. Ball 1 has mass [[2m|m₁ = 2m]] and speed [[v|v₁ = v]], moving up and to the right; ball 2 has mass [[m|m₂ = m]] and speed [[2v|v₂ = 2v]], moving up and to the left. Both move at [[45° to the vertical|each velocity has equal x and y parts|hidden]]. The system is [[isolated|total momentum conserved|hidden]]. What is true just before the collision?`,
 fig: svg(260,190, tx(130,24,'⊗','text-anchor="middle" font-size="18"') + `<circle cx="50" cy="160" r="16" fill="#f0c89a" stroke="#333"/>` + tx(50,165,'1','text-anchor="middle" font-size="13"') + ar(62,148,112,98,'G',5) + tx(20,132,'2m, v','font-size="12"') + `<circle cx="215" cy="160" r="16" fill="#f0c89a" stroke="#333"/>` + tx(215,165,'2','text-anchor="middle" font-size="13"') + ar(203,148,150,95,'G',5) + tx(216,132,'m, 2v','font-size="12"')),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  bl('info','Size of each momentum.',['|p₁| = 2m × v = {} mv','|p₂| = m × 2v = {} mv'],[nb(2),nb(2)],'Same size, but different directions: so the momenta are NOT the same.'),
  bl('solve','Split each momentum into components (+x right, +y up; cos 45° = sin 45° = 0.707).',['p₁x = +2mv × 0.707 = {} mv,  p₂x = {} mv','Total p_x = {}','p₁y = {} mv,  p₂y = {} mv','Total p_y = {} mv'],[nb(1.414),nb(-1.414),nb(0),nb(1.414),nb(1.414),nb(2.828)]),
  {type:'mcq', ph:'check', prompt:'So just before the collision…', why:'Pick the statement your components actually prove.', opts:[
   o('the total horizontal component of the momentum of the system is zero',1,'The x parts cancel; the y parts add.'),
   o('the momenta of the two balls are the same',0,'Same size, but they point in different directions. Vectors are equal only if both match.'),
   o('the horizontal components of the two balls\' momenta are the same',0,'Same size, but opposite signs (+1.41 and −1.41).'),
   o('the total momentum of the system is zero',0,'The y parts both point up: p_y = 2.83 mv, not zero.')]},
  pr('check','After the balls stick together, the lump moves…',[o('straight up',1),o('straight down'),o('it stops')],[o('total p_x = 0 and total p_y is upward, and both are conserved',1),o('the heavier ball wins')])
 ]})},
{id:'22g', lv:22, title:'Spring Pushes Two Blocks Apart', make:()=>({
 text:`A spring with [[k = 4080 N/m|k = 4080 N/m]] is compressed [[3.00 cm|x = 0.0300 m|hidden]] between two blocks, of mass [[M|m₁ = M]] and [[2M|m₂ = 2M]], [[at rest|total momentum = 0|hidden]]. The spring shoots them apart, one at [[2.00 m/s|one speed = 2.00 m/s]] and the other at [[4.00 m/s|other speed = 4.00 m/s]]. [[All the spring energy becomes kinetic energy|no friction|hidden]]. What is M?`,
 fig: figBA([{t:'Before',o:[{x:110,w:34,l:'M'},{x:176,w:50,l:'2M'}]},{t:'After',o:[{x:40,w:34,l:'M',d:-1,v:'?'},{x:240,w:50,l:'2M',d:1,v:'?'}]}]),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the units.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: two conservation laws. What does each one tell you?', opts:[o('Momentum tells you WHICH block has which speed; energy gives M',1,'Momentum alone cannot give a mass, because every term has M in it.'),o('Momentum gives M directly',0,'0 = M v₁ − 2M v₂: M cancels.'),o('Only energy is needed',0,'You first need to know which block moves at 4.00 m/s.')], explain:'<b>Roadmap:</b> momentum → match speeds to blocks → spring energy = total kinetic energy → solve for M.'},
  pr('link','Which block moves at 4.00 m/s?',[o('The lighter block, M',1),o('The heavier block, 2M')],[o('total momentum is zero, so M × 4.00 = 2M × 2.00: half the mass needs twice the speed',1),o('the heavier block gets more of the spring\'s push')]),
  bl('solve','Spring energy.',['U = ½ k x² = ½ × {} × {}² = {} J'],[nb(4080),nb(0.03),nb(1.836)]),
  bl('solve','Kinetic energy afterward.',['K = ½ M (4.00)² + ½ (2M)(2.00)² = ({} + {}) M = {} M'],[nb(8),nb(4),nb(12)]),
  {type:'num', ph:'solve', prompt:'Set U = K and solve: M = 1.836 / 12.', sym:'M', unit:'kg', ans:1.836/12, slips:[{v:4080*9/2/12,msg:'Convert 3.00 cm to 0.0300 m.'},{v:1.836/18,msg:'The 4.00 m/s block is the LIGHT one: K = 8M + 4M = 12M.'}], explain:'M = 0.153 kg = 153 g.'}
 ]})},
{id:'22h0', lv:22, title:'Momentum Is a Vector', make:()=>({

  pr('info','Two objects have momenta of the same size pointing in different directions. Are their momenta equal?',[o('No',1),o('Yes')],[o('vectors are equal only if both the size AND the direction match',1),o('only the size of momentum matters')]),

{id:'22h', lv:22, title:'Identical Balls, Head-On', make:()=>({

 ]})},
{id:'22i', lv:22, title:'Is the Object\'s Momentum Conserved?', make:()=>({
 text:`For ONE object, momentum p = m v is conserved only if its mass AND its velocity (speed and direction) stay the same, which means the net force on it is zero. Decide for each process.`,
 fig:'',
 steps:[
  pr('law','A skydiver with her parachute open falls at a steady speed.',[o('Conserved',1),o('Not conserved')],[o('constant speed in a straight line: drag balances her weight, so the net force is zero',1),o('gravity acts on her, so her momentum must change')]),
  pr('law','A car pulls away from a stop sign.',[o('Not conserved',1),o('Conserved')],[o('it speeds up, so the size of its momentum grows',1),o('the engine is part of the car')]),
  pr('law','A train goes around a curve at a steady speed.',[o('Not conserved',1),o('Conserved')],[o('its direction changes, and momentum is a vector',1,'Constant speed is not enough.'),o('the speed is constant')]),
  pr('law','An asteroid accelerates toward the moon.',[o('Not conserved',1),o('Conserved')],[o('it speeds up under the moon\'s gravity',1),o('space has no friction')]),
  pr('system','A cyclist collides with a pedestrian. Is the CYCLIST\'s momentum conserved?',[o('No',1),o('Yes')],[o('the pedestrian pushes on the cyclist, changing the cyclist\'s speed and direction',1,'The momentum of the SYSTEM cyclist + pedestrian is conserved; one object alone is not.'),o('momentum is conserved in every collision')]),
  {type:'mcq', ph:'check', prompt:'Recap: for a single object, momentum is conserved when…', opts:[o('the net force on it is zero, so its velocity does not change',1,'ΣF = Δp/Δt.'),o('no forces act at all',0,'Forces can act if they cancel, like the skydiver.'),o('its speed is constant',0,'The direction must stay the same too.')]}
 ]})},
{id:'22j', lv:22, title:'Three Friends Push Apart on Ice', make:()=>({
 text:`Three friends, A, B and C, with [[the same mass|m_A = m_B = m_C = M]], are on ice and [[initially at rest|total momentum = 0|hidden]]. They push away from one another. A bird viewing from above sees A moving [[up at 2.00 m/s|v_A = (0, +2.00) m/s]] and B moving [[down and left at 2.00 m/s, at 45°|v_B = 2.00 m/s at 45° below the −x axis]]. What is the final speed of C?`,
 fig: svg(240,200, `<circle cx="120" cy="100" r="5" fill="#333"/>` + tx(128,96,'start','font-size="10" fill="#777"') + ar(120,100,120,40,'G',4) + tx(126,46,'A: 2.00 m/s','font-size="11"') + ar(120,100,78,142,'G',4) + tx(26,160,'B: 2.00 m/s','font-size="11"') + `<line x1="78" y1="100" x2="120" y2="100" stroke="#bbb" stroke-dasharray="3 3"/>` + tx(90,116,'45°','font-size="10"') + ar(120,100,170,121,'O',4) + tx(172,130,'C = ?',IT('O')) + tx(120,192,'top view (from the bird)','text-anchor="middle" font-size="11" fill="#555"')),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'law', prompt:'The total momentum was zero. Since all three masses are equal, that means…', why:'Equal masses let you work with velocities instead of momenta.', opts:[o('v_A + v_B + v_C = 0 (as vectors)',1,'M cancels out of M v_A + M v_B + M v_C = 0.'),o('each friend has the same speed',0,'Their speeds can differ; only the vector sum must be zero.'),o('v_C = 0',0,'A and B do not cancel each other.')]},
  bl('solve','Components (+x right, +y up; cos 45° = 0.707).',['A: v_Ax = {}, v_Ay = {}','B: v_Bx = −2.00 × 0.707 = {}, v_By = {}'],[nb(0),nb(2),nb(-1.414),nb(-1.414)]),
  bl('solve','C must cancel the sum of A and B.',['v_Cx = −(0 + (−1.414)) = {} m/s','v_Cy = −(2.00 + (−1.414)) = {} m/s'],[nb(1.414),nb(-0.586)]),
  {type:'num', ph:'solve', prompt:'Final speed of C: √(v_Cx² + v_Cy²).', sym:'v_C', unit:'m/s', ans:Math.hypot(1.414,0.586), slips:[{v:2,msg:'C does not need the same speed: work out its components.'},{v:2.828,msg:'Check the signs: A\'s +2.00 and B\'s −1.414 partly cancel in y.'}]},
  pr('check','C moves right and slightly down. Why?',[o('It must balance B\'s leftward part and the extra upward part left over from A and B',1),o('C always moves opposite to A')],[o('the three velocity vectors must add to zero',1),o('C is pushed the hardest')])
 ]})},
{id:'22e', lv:22, title:'Tennis Ball and Racquet', make:()=>({
 text:`A tennis ball of mass [[59.5 g|m = 0.0595 kg|hidden]] is traveling [[to the left at 15.0 m/s|v_i = −15.0 m/s]]. After [[15.0 ms|Δt = 0.0150 s|hidden]] of contact with a racquet, it moves [[to the right at 20.0 m/s|v_f = +20.0 m/s]]. What is the magnitude of the average force on the ball from the racquet?`,

  bl('solve','Change in velocity (+ = right).',['Δv = v_f − v_i = {} − ({}) = {} m/s'],[nb(20),nb(-15),nb(35)]),
  bl('law','Impulse-momentum theorem.',['F_avg Δt = m Δv','F_avg = {} × {} / {}'],[nb(0.0595),nb(35),nb(0.015)]),
  {type:'num', ph:'solve', prompt:'Average force:', sym:'F_avg', unit:'N', ans:0.0595*35/0.015, slips:[{v:0.0595*5/0.015,msg:'The ball reverses: Δv = 20 − (−15) = 35 m/s, not 5.'},{v:0.0595*35/15,msg:'Convert 15.0 ms to 0.0150 s.'},{v:59.5*35/0.015,msg:'Convert 59.5 g to 0.0595 kg.'}]},
  pr('check','Why is Δv 35 m/s and not 5 m/s?',[o('The ball reverses direction',1),o('The racquet adds 30 m/s')],[o('it must first be stopped (15 m/s) and then sped up the other way (20 m/s)',1),o('speeds always add in collisions')])
 ]})},

{id:'24a', lv:24, title:'Two Cars at an Angle φ (Symbolic)', make:()=>({
 text:`Two cars, [[both of mass m|m₁ = m₂ = m]], collide and [[stick together|perfectly inelastic: final mass 2m|hidden]]. One car was traveling [[north at speed 2v|car A: (0, +2v)]]; the other at [[speed v at an angle φ south of east|car B: (+v cos φ, −v sin φ)]]. After the collision the pair moves at speed v_final at an angle θ east of north. Find v_final in terms of v and φ.`,
 fig: svg(260,220, `<line x1="20" y1="110" x2="250" y2="110" stroke="#ccc" stroke-dasharray="4 3"/><line x1="140" y1="10" x2="140" y2="215" stroke="#ccc" stroke-dasharray="4 3"/>` + `<rect x="128" y="170" width="24" height="34" fill="#a9c9c9" stroke="#555"/>` + ar(140,168,140,118,'G',4) + tx(146,148,'2v','font-size="13" font-style="italic"') + `<g transform="translate(78,64) rotate(35)"><rect x="-17" y="-11" width="34" height="22" fill="#f3e36a" stroke="#555"/></g>` + ar(94,78,134,106,'G',4) + tx(108,82,'v','font-size="13" font-style="italic"') + tx(104,124,'φ','font-size="13" font-style="italic"') + ar(140,110,196,82,'O',4) + tx(200,82,'v_final',IT('O')) + tx(150,92,'θ','font-size="12" font-style="italic"') + tx(24,212,'N ↑  E →','font-size="11" fill="#555"')),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Car B moves EAST and SOUTH.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: how do you get v_final?', opts:[o('Conserve momentum in x (east) and y (north) separately, divide by 2m, then use Pythagoras',1,'Each direction is its own 1-D problem.'),o('Add the speeds: (2v + v)/2',0,'The cars move in different directions.'),o('Use energy conservation',0,'Sticking collisions lose kinetic energy.')]},
  bl('sign','Components of car B\'s velocity (+x east, +y north).',['v_Bx = +v {} φ','v_By = {} v {} φ (south is negative)'],[SC('cos'),PM('−'),SC('sin')]),
  bl('solve','Total momentum.',['p_x = m v {} φ','p_y = 2mv − m v {} φ'],[SC('cos'),SC('sin')]),
  bl('solve','Speed after the collision (mass 2m).',['v_final = √(p_x² + p_y²) / (2m)','Inside the root, cos²φ + sin²φ = {}, so p_x² + p_y² = m²v²({} − 4 sin φ)'],[nb(1),nb(5)]),
  {type:'mcq', ph:'solve', prompt:'So v_final =', opts:[o('(v/2) √(5 − 4 sin φ)',1,'Type v/2*sqrt(5-4*sin(φ)) in Mastering.'),o('v √(5 − 4 sin φ)',0,'Divide by the total mass 2m, which gives v/2 in front.'),o('(v/2) √(5 + 4 sin φ)',0,'Car B moves SOUTH, so its y-part subtracts.'),o('3v/2',0,'That treats both cars as moving the same way.')]},
  {type:'num', ph:'check', prompt:'Check with numbers: φ = 30°. Then v_final / v =', sym:'v_final / v', unit:'', ans:Math.sqrt(3)/2},
  {type:'mcq', ph:'solve', prompt:'Part B: tan θ (east of north) is…', opts:[o('cos φ / (2 − sin φ)',1,'tan θ = (east part) / (north part).'),o('(2 − sin φ) / cos φ',0,'θ is measured from NORTH, so east goes on top.'),o('sin φ / 2',0,'Use the full components.')]}
 ]})},

 text:`Two cars of masses [[m₁|m₁]] and [[m₂|m₂]] collide at an intersection. Car 1 was going [[east at v₁|p₁ = m₁v₁, along +x]]; car 2 was going [[north at v₂|p₂ = m₂v₂, along +y]]. They [[stick together|completely inelastic|hidden]] and move off at speed v, at angle θ north of east.`,

 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  bl('solve','Momentum components (only one car moves along each axis).',['p_x = {}','p_y = {}'],[sl('m₁v₁',['m₂v₂','m₁v₂']),sl('m₂v₂',['m₁v₁','m₂v₁'])]),
  {type:'mcq', ph:'solve', prompt:'Part A: the speed v after the collision is…', opts:[o('√((m₁v₁)² + (m₂v₂)²) / (m₁ + m₂)',1,'Size of the total momentum, divided by the total mass.'),o('(m₁v₁ + m₂v₂) / (m₁ + m₂)',0,'The momenta are perpendicular: combine them with Pythagoras.'),o('√(v₁² + v₂²)',0,'Use momenta, not just speeds; and divide by the total mass.')]},
  {type:'mcq', ph:'solve', prompt:'Part B: tan θ (north of east) =', opts:[o('p₂ / p₁',1,'Opposite (north) over adjacent (east).'),o('p₁ / p₂',0,'θ is measured from EAST, so the north part goes on top.'),o('v₂ / v₁',0,'The masses matter: use momenta.')]},
  pr('law','Part C: after the collision θ = 45° (tan θ = 1). This means that before the collision…',[o('the two cars had momenta of equal size',1),o('the two cars had equal speeds'),o('the two cars had equal masses')],[o('tan θ = p₂/p₁ = 1, so m₁v₁ = m₂v₂',1),o('45° always means equal speeds'),o('only identical cars move off at 45°')]),
  {type:'num', ph:'check', prompt:'Check: m₁ = 1000 kg at 20 m/s, m₂ = 2000 kg at 10 m/s. Speed after (m/s):', sym:'v', unit:'m/s', ans:Math.hypot(20000,20000)/3000}
 ]})},

  bl('solve','Velocity components of the 45 g ball.',['v_x = 0.050 / {} = {} m/s','v_y = {} m/s'],[nb(0.045),nb(1.111),nb(1.111)]),
