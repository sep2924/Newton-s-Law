 ]};}},
{id:'9e2', lv:9, title:'Block A Tied to the Wall (String on the Upper Block Only)', rnd:true, make:()=>{ const P=R(16,30,2), fAB=0.3*9.8, ft=0.3*3*9.8, a=(P-fAB-ft)/2; return {
 text:`Same blocks as before, but now the string is [[tied only to the upper block A|A is held by the string: it cannot move, a_A = 0|hidden]] and to the wall; there is no pulley. Block A ([[1.0 kg|m_A = 1.0 kg]]) sits on block B ([[2.0 kg|m_B = 2.0 kg]]). B is pulled to the right with [[P = ${P} N|P = ${P} N]] and [[slides|B slides under A AND on the table: both frictions are kinetic|hidden]]. The coefficient of kinetic friction is [[μₖ = 0.30|μₖ = 0.30]] between the blocks and [[the same between B and the table|μₖ = 0.30 at the table too|hidden]]. Find the tension in the string and the acceleration of B.`,
 fig: figStackTied(P+' N'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Two important ones are hidden.', why:'The setup looks like the pulley problem, but one small change (what the string is tied to) changes everything.'},
  {type:'mcq', ph:'unknown', prompt:'Plan: how is this different from the pulley version?', why:'Spotting what changed tells you which equations change.', opts:[
   o('A is held still by the string, so a_A = 0; only B accelerates, and the string does not touch B',1,'So A gives a balance equation (ΣF = 0) and B gives ΣF = m_B a.'),
   o('Nothing changes: same equations, same answer',0,'Without the pulley the string no longer pulls on B, and A no longer moves.'),
   o('Both blocks now move together',0,'The string holds A back while B slides out from under it.')],
   explain:'<b>Roadmap:</b> A at rest → T balances the friction from B → B: P minus two frictions = m_B a.'},
  pr('fbd','B slides to the right under A. The friction of B on A points…',[o('to the right',1),o('to the left'),o('there is no friction on A')],[o('friction opposes the sliding of A relative to B; relative to B, A slides LEFT, so friction on A points right',1,'B tries to drag A along with it.'),o('friction always opposes the pull P'),o('A is not moving, so there is no friction')]),
  dr('Draw the free-body diagram of block A (at rest). The wall is to the LEFT.',[fo('T','string pulling toward the wall',180,1,'The string holds A back.'),fo('f_BA','friction from B',0,1,'B drags A to the right.'),fo('n','B pushing up on A',90,1,'A rests on B.'),fo('w','weight of A',-90,1,'Gravity.'),fo('P','the pull P',0,0,'P acts on B, not on A.')],[['T','=','f_BA','A is at rest, so the horizontal forces balance'],['n','=','w','no vertical acceleration']],{why:'A is in equilibrium. Drawing its forces shows that the string is what balances the friction from B.'}),
  bl('solve','Block A: balance the forces (A is at rest).',['n_A = m_A g = {} N','f_BA = μₖ n_A = {} N','Horizontal: T − f_BA = {}, so T = {} N'],[nb(9.8),nb(fAB),nb(0),nb(fAB)],'The string tension equals the friction, whatever P is.'),
  {type:'num', ph:'solve', prompt:'Tension in the string:', sym:'T', unit:'N', ans:fAB, why:'This is the first answer. Note that it does not depend on P.', slips:[{v:P,msg:'The string holds A; it only needs to balance the friction on A, not the pull on B.'},{v:ft,msg:'That is the friction from the TABLE on B. The string only holds A.'}]},
  {type:'fbd', ph:'fbd', prompt:'Now block B. Click every force that acts on B.', why:'B is the block that accelerates, so you need all of its horizontal forces for ΣF = m_B a.', forces:[
   {l:'P, the pull to the right', a:0, ok:1, why:'Applied to B.'},{l:'f_AB, friction from A, to the left', a:180, ok:1, why:'3rd-law partner of the friction on A, so it points left.'},{l:'f_table, friction from the table, to the left', a:180, ok:1, why:'B slides right on the table.'},{l:'n, table pushing up on B', a:90, ok:1, why:'Contact.'},{l:'n_A on B, A pressing down', a:-90, ok:1, why:'A rests on B.'},{l:'w_B, weight of B', a:-90, ok:1, why:'Gravity.'},
   {l:'T, the string', a:180, ok:0, why:'The string is tied to A and the wall only. It does not touch B.'},{l:'w_A, weight of A', a:-90, ok:0, why:'Earth pulls on A, not on B. B feels A only through n_A on B.'}]},
  bl('solve','Friction from the table.',['The table supports both blocks: n = ({} + {}) × 9.8 = {} N','f_table = 0.30 × {} = {} N'],[nb(1),nb(2),nb(29.4),nb(29.4),nb(ft)]),
  {type:'eq', ph:'law', prompt:'ΣF = ma for B (+ = right):', why:'Newton\'s 2nd law on B turns its three horizontal forces into its acceleration.', lhs:3, tiles:['P','T','f_AB','f_table','m_Ba','m_Aa','0'], ans:['+P,-f_AB,-f_table=m_Ba']},
  {type:'num', ph:'solve', prompt:'Acceleration of B:', sym:'a', unit:'m/s²', ans:a, slips:[{v:(P-fAB-ft-fAB)/2,msg:'No string pulls on B: there is only one friction from A (f_AB), not the tension too.'},{v:(P-fAB-ft)/3,msg:'Only B accelerates. Divide by m_B = 2.0 kg.'},{v:(P-fAB-0.3*2*9.8)/2,msg:'The table holds up BOTH blocks: f_table = 0.30 × 29.4 N.'}]},
  pr('check','Compared with the pulley version (same P), B\'s acceleration here is…',[o('larger',1),o('smaller'),o('the same')],[o('B no longer has to drag A along or feel the rope pulling it back; only the two frictions resist it',1),o('a string always makes things accelerate faster'),o('the masses are the same, so the acceleration is the same')]),
  {type:'mcq', ph:'check', prompt:'Recap: what single change made this problem easier?', why:'Saying the method in one sentence is what lets you solve the next problem like this.', opts:[o('Tying the string to the wall makes A an equilibrium problem (ΣF = 0), leaving only B to accelerate',1,'One block at rest, one block accelerating.'),o('Removing friction',0,'Both frictions are still there.'),o('Making B lighter',0,'The masses are the same.')]}
 ]};}},
{id:'9f', lv:9, title:'Maximum Pull Without Slipping', rnd:true, make:()=>{ const us=R(0.4,0.7,0.1), uk=+(us-0.2).toFixed(2), fs=us*4*g, a=fs/3, F=7*a; return {
 text:`A [[4.0 kg|m_top = 4.0 kg]] block sits on a [[3.0 kg|m_bottom = 3.0 kg]] block. A rope pulls the TOP block with force F. The coefficient of static friction between the blocks is [[${us}|μₛ = ${us}]], the coefficient of kinetic friction between them is ${uk}, and there is [[no friction|the floor is frictionless|hidden]] between the 3.0 kg block and the floor. What is the maximum F such that the two blocks [[do not slip|same a for both; the friction is STATIC|hidden]]?`,
 fig: figStack2(),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. One number in the text is a trap.', explain:`The kinetic coefficient ${uk} is a distractor. The blocks do not slip, so the friction between them is static.`},
  pr('system','What force makes the BOTTOM block accelerate?',[o('Static friction from the top block, pointing forward',1),o('The rope force F'),o('Nothing: it cannot accelerate')],[o('it is the only horizontal force on the bottom block: F touches only the top block and the floor is frictionless',1,'Friction can push an object forward!'),o('F passes through the top block unchanged'),o('friction always opposes motion, so it cannot push anything forward')]),
  dr('Draw the free-body diagram of the BOTTOM block (3.0 kg).',[fo('w','weight of the bottom block',-90,1,'Gravity.'),fo('n','floor pushing up',90,1,'Contact with the floor.'),fo('n′','top block pressing down',-90,1,'The top block rests on it.'),fo('fₛ','static friction from the top block',0,1,'This is what drags the bottom block forward.'),fo('F','the rope force',0,0,'The rope is tied to the top block only.'),fo('f','friction from the floor',180,0,'The floor is frictionless.')],[['n','>','w','the floor supports BOTH blocks']]),
  bl('info','Find the largest friction the surfaces can supply.',['Normal force between the blocks: n′ = {} kg × 9.8 = {} N','fₛ,max = μₛ n′ = {} × {} = {} N','The coefficient you did NOT use: {}'],[nb(4),nb(39.2),nb(us),nb(39.2),nb(fs),sl('μₖ',['μₛ','g'])]),
  {type:'eq', ph:'law', prompt:'ΣF = ma for the bottom block (horizontal):', lhs:1, tiles:['fₛ','F','n'], rhs:['m_bottom·a','m_top·a','(m_top+m_bottom)a','0'], ans:['+fₛ=m_bottom·a']},
  {type:'num', ph:'solve', prompt:'Largest acceleration the bottom block can get:', sym:'a_max', unit:'m/s²', ans:a, slips:[{v:fs/4,msg:'Friction accelerates the BOTTOM block: divide by 3.0 kg.'},{v:fs/7,msg:'For the bottom block alone the mass is 3.0 kg.'}]},
  dr('Draw the free-body diagram of the TOP block (4.0 kg).',[fo('w','weight of the top block',-90,1,'Gravity.'),fo('n','bottom block pushing up',90,1,'It rests on the bottom block.'),fo('F','rope pulling forward',0,1,'The rope is tied to this block.'),fo('fₛ','static friction from the bottom block',180,1,'3rd-law partner of the friction that pushes the bottom block forward.'),fo('n floor','the floor pushing up',90,0,'The floor does not touch the top block.')],[['n','=','w','no vertical acceleration'],['F','>','fₛ','the top block also accelerates forward']]),
  {type:'mcq', ph:'system', prompt:'Now find F. Choose the system:', opts:[o('Both blocks together: F = (m_top + m_bottom)a',1,'The friction between them is internal, and both share a_max.'),o('The bottom block alone',0,'F does not act on the bottom block.'),o('Set F = fₛ,max',0,'Then the top block would have zero net force and could not accelerate with the bottom one.')]},
  {type:'num', ph:'solve', prompt:'Calculate the maximum F.', sym:'F', unit:'N', ans:F, slips:[{v:fs,msg:'That is fₛ,max alone. F must ALSO accelerate the top block: F − fₛ = m_top a.'},{v:us*7*g,msg:'The normal force between the blocks is only the weight of the TOP block.'},{v:uk*4*g,msg:'That uses the kinetic coefficient. Nothing is sliding.'}], explain:`F = 7.0 × ${f3(a)} = ${f3(F)} N`},
  bl('check','Compare the net forces.',['Net force on the top block: F − fₛ = {} N','Net force on the bottom block: fₛ = {} N','Ratio top : bottom = {} : 3, the same as the mass ratio'],[nb(4*a),nb(fs),nb(4)]),
  pr('check','If F is made bigger than this maximum…',[o('the top block slides forward over the bottom one',1),o('both blocks just accelerate faster together'),o('the bottom block shoots out ahead')],[o('static friction cannot supply more than μₛn′, so the bottom block cannot keep up',1,'After that the friction is kinetic, which is even smaller.'),o('a bigger force always gives a bigger shared acceleration'),o('the bottom block is lighter')])
 ]};}},
{id:'9g', lv:9, title:'Concept: Which Rope Pulls Harder?', make:()=>({
 text:`Blocks A and B are connected by rope 1 and are pulled across a [[frictionless|no friction|hidden]] surface by rope 2, which is attached to block B. The applied force is strong enough to make the blocks [[speed up|a ≠ 0, pointing forward|hidden]]. Compare the tensions in ropes 1 and 2.`,
 fig: figTwo(),
 steps:[
  {type:'clue', ph:'info', prompt:'Find the two hidden clues.'},
  dr('Draw the free-body diagram of block B. Think about the arrow lengths.',[fo('n','surface pushing up',90,1,'Contact.'),fo('w','weight of B',-90,1,'Gravity.'),fo('T₂','rope 2 pulling forward',0,1,'Rope 2 is attached to B.'),fo('T₁','rope 1 pulling backward',180,1,'Block A drags behind.'),fo('f','friction',180,0,'The surface is frictionless.')],[['n','=','w','no vertical acceleration'],['T₂','>','T₁','B accelerates forward, so the net force on B must point forward']]),
  pr('check','How do the two tensions compare?',[o('T₂ is bigger than T₁',1),o('They are equal'),o('T₁ is bigger than T₂'),o('It cannot be decided without knowing a')],[o('with the same a, T₂ accelerates A and B while T₁ accelerates only A',1,'T₁ = m_A a and T₂ = (m_A + m_B)a.'),o("Newton's 2nd law makes the tensions equal"),o("Newton's 3rd law makes the tensions equal")]),
  {type:'mcq', ph:'system', prompt:"Why doesn't Newton's 3rd law make T₁ = T₂?", opts:[o('They are not an action/reaction pair: they come from two different ropes',1,'The pair for rope 1 is "rope 1 on B" and "B on rope 1".'),o('The 3rd law does not apply to moving objects',0,'It always applies.'),o('The 3rd law only applies to gravity',0,'It applies to every force.')]},
  bl('solve','Put in numbers: m_A = 2 kg, m_B = 3 kg, a = 2 m/s².',['T₁ = m_A a = {} N','T₂ = (m_A + m_B)a = {} N','Net force on B = T₂ − T₁ = {} N','Net force on A = {} N'],[nb(4),nb(10),nb(6),nb(4)]),
  pr('check','Now the blocks glide at CONSTANT velocity on the frictionless surface. Then…',[o('T₁ = T₂ = 0',1),o('T₁ = T₂, both bigger than zero'),o('T₂ is still bigger than T₁')],[o('a = 0 and there is no friction, so no block needs any net force',1,'Motion itself needs no force. Only changing the motion does.'),o('a moving object always needs a force to keep it moving'),o('the front rope always works harder')])
 ]})},
{id:'9h', lv:9, title:'Table Block and Hanging Block (M and M/4)', make:()=>({
 text:`A block of mass [[M|M]] rests on a horizontal, [[frictionless|no friction|hidden]] table. It is connected by a [[massless string over a massless, frictionless pulley|same T, same size of a|hidden]] to a hanging mass [[m = M/4|m = M/4]]. What is the magnitude of the acceleration of the two masses?`,

  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  dr('Draw the free-body diagram of the block M on the table.',[fo('n','table pushing up',90,1,'Contact with the table.'),fo('Mg','weight of M',-90,1,'Gravity.'),fo('T','string pulling toward the pulley',0,1,'The only horizontal force.'),fo('mg','weight of the hanging block',0,0,"The hanging block's weight acts on the hanging block. M feels only the string: T.")],[['n','=','Mg','no vertical acceleration']]),
  dr('Draw the free-body diagram of the hanging block m.',[fo('T','string pulling up',90,1,'The string.'),fo('mg','weight of m',-90,1,'Gravity.'),fo('n','normal force',90,0,'Nothing touches it from below.')],[['mg','>','T','m accelerates downward, so the net force points down']]),
  {type:'eq', ph:'law', prompt:'ΣF = ma for M (horizontal, + = toward the pulley):', lhs:1, tiles:['T','mg','Mg'], rhs:['Ma','ma','0'], ans:['+T=Ma']},
  {type:'eq', ph:'law', prompt:'ΣF = ma for m (+ = down):', lhs:2, tiles:['T','mg','Mg','Ma','ma','0'], ans:['+mg,-T=ma']},
  bl('solve','Add the equations so that T cancels.',['mg = ({})a','With m = M/4:  (M/4)g = ({} × M/4)a','a = g / {}'],[sl('M + m',['M','m','M − m']),nb(5),nb(5)]),
  {type:'mcq', ph:'check', prompt:'A common wrong answer is a = g/4 (from mg = Ma). What did it miss?', opts:[o('The hanging block has to be accelerated too: the total mass is M + m',1,'The pull mg must accelerate both blocks.'),o('It forgot friction',0,'The table is frictionless.'),o('It used the wrong value of g',0,'g is fine.')]},
  bl('check','Compare the forces.',['T = Ma = Mg / {}','Weight of the hanging block: mg = Mg / {}','So T is {} mg','Net force on M = Mg / {};   net force on m = mg − T = Mg / {}'],[nb(5),nb(4),sl('less than',['equal to','more than']),nb(5),nb(20)]),
  pr('check','The net force on M is…',[o('4 times the net force on m',1),o('equal to the net force on m'),o('one quarter of the net force on m')],[o('same a, and M has 4 times the mass: F_net = ma',1),o('the string pulls both blocks with the same T'),o('only the hanging block feels gravity')])
 ]})},
{id:'9i', lv:9, title:'Person, Pulley and Concrete Block', rnd:true, make:()=>{ const mp=R(50,75,5), T=mp*g, n=980-T, C=2*T+98; return {
 text:`A [[${mp} kg|m_person = ${mp} kg]] person hangs from one end of a rope that passes over a pulley of mass [[10.0 kg|m_pulley = 10.0 kg]] attached to the ceiling. The other end is tied to a [[100 kg|m_block = 100 kg]] concrete block [[resting on the floor|the floor pushes up on the block with n|hidden]]. The system is [[in equilibrium|a = 0 for every object|hidden]]. Find the rope tension, the normal force on the block, and the force the ceiling exerts on the pulley.`,

  {type:'clue', ph:'info', prompt:'Collect the clues.', explain:'Equilibrium means ΣF = 0 for the person, for the block, and for the pulley, each one separately.'},
  dr('Start with the simplest object. Draw the free-body diagram of the PERSON.',[fo('T','rope pulling up',90,1,'The person holds the rope.'),fo('w','weight of the person',-90,1,'Gravity.'),fo('n','floor pushing up',90,0,'The person is hanging, not standing.')],[['T','=','w','equilibrium: the two forces balance']]),
  {type:'num', ph:'solve', prompt:'Calculate the tension.', sym:'T', unit:'N', ans:T, explain:`T = ${mp} × 9.8 = ${f3(T)} N`},
  dr('Draw the free-body diagram of the concrete BLOCK.',[fo('T','rope pulling up',90,1,'The same rope, the same tension.'),fo('n','floor pushing up',90,1,'The block rests on the floor.'),fo('w','weight of the block',-90,1,'Gravity: 980 N.'),fo('w_p','weight of the person',-90,0,"That acts on the person. The block feels the person only through the rope: T.")],[['w','>','T','the rope alone cannot lift the block'],['w','>','n','the floor only has to supply what the rope does not']]),
  {type:'eq', ph:'law', prompt:'ΣF = 0 for the block (+ = up, M = 100 kg):', lhs:3, tiles:['T','n','Mg','2T'], rhs:['0','Ma'], ans:['+T,+n,-Mg=0']},
  {type:'num', ph:'solve', prompt:'Calculate the normal force on the block.', sym:'n', unit:'N', ans:n, slips:[{v:980,msg:'The rope holds up part of the weight: n = Mg − T.'}], explain:`n = 980 − ${f3(T)} = ${f3(n)} N`},
  {type:'fbd', ph:'fbd', prompt:'Now the PULLEY. Click every force that acts on it.', forces:[{l:'C, ceiling pulling up',a:90,ok:1,why:'The pulley is attached to the ceiling.'},{l:'w, weight of the pulley (98 N)',a:-90,ok:1,why:'This pulley has mass.'},{l:'T, left rope pulling down',a:-90,ok:1,why:'The rope pulls on the pulley on the left side.'},{l:'T, right rope pulling down',a:-90,ok:1,why:'And again on the right side.'},{l:'Weight of the person',a:-90,ok:0,why:'That acts on the person. The pulley feels only the rope.'},{l:'Weight of the block (980 N)',a:-90,ok:0,why:'The pulley feels only the rope tension, and the floor carries part of the block.'}]},
  bl('solve','Balance the pulley.',['C − m_pulley g − 2T = 0','C = {} + 2 × {}'],[nb(98),nb(T)]),
  {type:'num', ph:'solve', prompt:'Calculate the force of the ceiling on the pulley.', sym:'C', unit:'N', ans:C, slips:[{v:2*T,msg:'This pulley has mass: add its weight, 98 N.'},{v:(mp+110)*g,msg:'The floor carries part of the block, so the ceiling does not hold everything.'},{v:T+98,msg:'The rope pulls down on BOTH sides of the pulley.'}]},
  bl('check','Check with the whole system.',['Total weight of person + block + pulley: {} N','Held by the ceiling: {} N','Held by the floor: {} N'],[nb((mp+110)*g),nb(C),nb(n)],'Ceiling + floor = total weight. ✓'),
  pr('check','The person lets go of the rope. The force of the floor on the block…',[o('increases to 980 N',1),o('stays the same'),o('drops to zero')],[o('the tension becomes zero, so the floor must hold the whole block',1),o('the block never moved, so nothing changes'),o('without the rope the block is weightless')])
 ]};}},

  bl('check','Sum it up.',['a = 0  →  net force = {} N','A 5 kg block with a = 3 m/s²  →  net force = {} N','The net force always points the same way as {}','Doubling the net force on the same mass makes the acceleration {}'],[nb(0),nb(15),sl('the acceleration',['the velocity','the biggest single force']),sl('double',['half','the same'])])
 ]})},

{id:'10a', lv:10, title:'Speed, Period and rpm', rnd:true, make:()=>{ const r=R(0.5,3,0.5), Tp=R(2,8,1), v=2*Math.PI*r/Tp, om=2*Math.PI/Tp; return {
 text:`Uniform circular motion means going around a circle at <b>constant speed</b>. A ball on a string moves in a circle of radius [[${r} m|r = ${r} m]] and takes [[${Tp} s|T = ${Tp} s (the period)]] for [[each full lap|one lap = one circumference, 2πr|hidden]].`,
 fig: figCircle('r'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.', explain:'The time for one lap has its own name and symbol: the period, T.'},
  bl('info','The vocabulary of going around.',['The time for one lap is called the {}','Distance around one lap: 2π × {} m = {} m','Speed: v = distance / time = 2πr / T = {} m/s'],[sl('period T',['frequency f','radius r']),nb(r),nb(2*Math.PI*r),nb(v)]),
  bl('info','Angular velocity ω says how fast the angle changes.',['One full lap is {} radians (give 3 digits)','ω = 2π / T = {} rad/s','Check: v = ω r = {} × {} = {} m/s'],[nb(6.28),nb(om),nb(om),nb(r),nb(v)]),
  bl('info','Converting rpm (revolutions per minute).',['Laps per second: f = 1 / T = {} rev/s','Laps per minute: {} rpm','From rpm to rad/s: multiply by 2π and divide by {}','So 60 rpm = {} rad/s'],[nb(1/Tp),nb(60/Tp),nb(60),nb(6.283)]),
  pr('check','The string is made twice as long, but the ball still takes the same time per lap. Its speed…',[o('doubles',1),o('stays the same'),o('is cut in half')],[o('v = 2πr/T: twice the distance in the same time',1),o('the same period always means the same speed'),o('a longer string slows the ball down')])
 ]};}},
{id:'10b', lv:10, title:'The Acceleration Points to the Centre', make:()=>({
 text:`A car drives around a circular track at a [[constant speed|the SIZE of v does not change|hidden]]. Its [[direction keeps changing|v changes direction, so a is not zero|hidden]]. Acceleration is the rate of change of velocity, and velocity includes direction.`,
 fig: figCircle('r'),
 steps:[
  {type:'clue', ph:'info', prompt:'Find the two hidden clues.'},
  pr('sign','The speed is constant. Is the car accelerating?',[o('Yes',1),o('No')],[o('the direction of v keeps changing, and any change in v is an acceleration',1),o('constant speed means zero acceleration'),o('only a change in speed counts as acceleration')]),
  {type:'mcq', ph:'sign', prompt:'Which way does the acceleration point?', opts:[o('Toward the centre of the circle',1,'This is called centripetal ("centre-seeking") acceleration.'),o('Along the direction of motion (the tangent)',0,'That would change the speed, and the speed is constant.'),o('Away from the centre',0,'Nothing pushes the car outward. Without an inward force it would go straight.')]},
  bl('law','The size of the centripetal acceleration.',['a = v² / {}','Using v = ωr, the same thing is a = {}² × r','A car at v = 10 m/s on a circle of r = 50 m:  a = {} m/s²','Doubling the speed makes a {} times bigger'],[sl('r',['T','m','2π']),sl('ω',['v','T']),nb(2),nb(4)]),
  pr('law',"By Newton's 2nd law, the NET force on the car points…",[o('toward the centre',1),o('forward, along the motion'),o('outward')],[o('ΣF = ma, and a points toward the centre',1),o('a force is needed to keep an object moving forward'),o('you feel thrown outward in a turn, so there must be an outward force')]),
  {type:'fbd', ph:'fbd', prompt:'A car turns on a flat road (the centre of the turn is to the left). Click the real forces on the car.', forces:[{l:'Weight mg',a:-90,ok:1,why:'Gravity.'},{l:'Normal force n from the road',a:90,ok:1,why:'Contact with the road.'},{l:'Static friction from the road, toward the centre',a:180,ok:1,why:'This is the force that turns the car.'},{l:'Centripetal force',a:180,ok:0,why:'Not a separate force. "Centripetal" is a name for the NET force toward the centre. Here friction plays that role.'},{l:'Centrifugal force, outward',a:0,ok:0,why:'No object pushes the car outward. That feeling is your body trying to keep going straight.'}]},
  bl('check','Sum it up.',['Net force toward the centre = m × {}','"Centripetal force" is a {}','If the string on a whirling ball breaks, the ball moves {}'],[sl('v²/r',['v/r','g','r/v²']),sl('name for the net inward force',['new force made by the circle','force caused by the motion']),sl('in a straight line along the tangent',['straight outward from the centre','in a spiral'])])
 ]})},
{id:'10c', lv:10, title:'Top and Bottom of a Vertical Circle', make:()=>({
 text:`A [[60 kg|m = 60 kg]] rider sits on a scale on a Ferris wheel turning at [[constant speed|a = v²/r, always toward the centre|hidden]]. The centripetal acceleration is [[2.0 m/s²|a = 2.0 m/s²]]. Compare the scale reading (the normal force n) at the bottom and at the top.`,
 fig: figFerris('r'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  pr('sign','At the BOTTOM of the circle, the acceleration points…',[o('up',1),o('down'),o('forward')],[o('the centre of the circle is above the rider',1),o('gravity always makes a point down'),o('a points along the motion')]),
  dr('Draw the free-body diagram of the rider at the BOTTOM.',[fo('n','scale pushing up',90,1,'Contact with the scale.'),fo('mg','weight',-90,1,'Gravity.'),fo('Fc','"centripetal force"',90,0,'Not a separate force. It is the name for the net force, n − mg.')],[['n','>','mg','the net force must point up, toward the centre']]),
  {type:'eq', ph:'law', prompt:'ΣF = ma at the bottom (+ = toward the centre = up):', lhs:2, tiles:['n','mg','mv²/r','0'], ans:['+n,-mg=mv²/r']},
  pr('sign','At the TOP of the circle, the acceleration points…',[o('down',1),o('up')],[o('the centre of the circle is now below the rider',1),o('the rider was moving upward on the way to the top'),o('the seat pushes up on the rider')]),
  dr('Draw the free-body diagram of the rider at the TOP.',[fo('n','scale pushing up',90,1,'The scale still pushes up.'),fo('mg','weight',-90,1,'Gravity.'),fo('Fc','"centripetal force"',-90,0,'Not a separate force.')],[['mg','>','n','the net force must point down, toward the centre']]),
  {type:'eq', ph:'law', prompt:'ΣF = ma at the top (+ = toward the centre = down):', lhs:2, tiles:['n','mg','mv²/r','0'], ans:['+mg,-n=mv²/r']},
  bl('solve','Put in the numbers (m = 60 kg, a = 2.0 m/s²).',['Bottom:  n = m(g {} a) = {} N','Top:  n = m(g {} a) = {} N','True weight: mg = {} N','Average of the top and bottom readings = {} N'],[PM('+'),nb(708),PM('−'),nb(468),nb(588),nb(588)],'The average of the two readings is exactly mg. That trick finds the mass from a scale graph.'),
  pr('check','Where does the rider feel heaviest?',[o('At the bottom',1),o('At the top'),o('The same everywhere')],[o('there n must beat mg to give an upward net force',1),o('at the top the rider is highest above the ground'),o('the speed is constant, so nothing changes')]),
  pr('check','New situation, for comparison: the rider has no tension, only n and mg. Now picture a ball whirled on a STRING instead, at the top of a vertical circle. The tension and the weight point…',[o('both down, toward the centre',1),o('in opposite directions')],[o('a string can only pull, and the centre is below the ball: T + mg = mv²/r',1),o('tension always points up'),o('the tension must balance the weight')])
 ]})},

{id:'11a', lv:11, title:'Block Whirling on a Table', rnd:true, make:()=>{ const rpm=R(40,80,5), rc=R(40,70,2), r=rc/100, om=rpm*2*Math.PI/60, v=om*r, T=0.2*om*om*r; return {

 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the units.', explain:'Grams and centimetres must become kilograms and metres before they go into ΣF = ma.'},

  {type:'num', ph:'solve', prompt:'Speed: v = ωr.', sym:'v', unit:'m/s', ans:v, slips:[{v:rpm*r,msg:'Convert rpm to rad/s first (× 2π / 60).'},{v:om*rc,msg:'Use the radius in metres.'}]},
  dr('Draw the free-body diagram of the block, seen from the SIDE. The centre of the circle is to the LEFT.',[fo('n','table pushing up',90,1,'Contact with the table.'),fo('mg','weight',-90,1,'Gravity.'),fo('T','string pulling toward the centre',180,1,'The only horizontal force.'),fo('Fc','"centripetal force"',180,0,'Not a separate force. Here the tension IS the centripetal force.'),fo('F out','outward force',0,0,'No object pushes the block outward.')],[['n','=','mg','no vertical acceleration']]),
  {type:'eq', ph:'law', prompt:'ΣF = ma toward the centre:', lhs:1, tiles:['T','mg','n'], rhs:['mv²/r','0','mg'], ans:['+T=mv²/r']},
  bl('solve','Substitute.',['T = m v² / r = {} × {}² / {}'],[nb(0.2),nb(v),nb(r)]),
  {type:'num', ph:'solve', prompt:'Calculate the tension.', sym:'T', unit:'N', ans:T, slips:[{v:0.2*v*v,msg:'Divide by r.'},{v:1.96,msg:'That is the weight. The weight is cancelled by the table; the string supplies mv²/r.'}]},
  pr('check','The same block is swung at twice the rpm. The tension becomes…',[o('4 times as large',1),o('twice as large'),o('the same')],[o('T = mω²r, and ω is squared',1),o('tension is proportional to the speed'),o('the string and the block have not changed')])
 ]};}},
{id:'11b', lv:11, title:'Electron in the Bohr Atom', make:()=>({
 text:`In the Bohr model of the hydrogen atom, an electron (mass [[m = 9.1 × 10⁻³¹ kg|m = 9.1e-31 kg]]) [[orbits|uniform circular motion|hidden]] a proton at a distance of [[5.3 × 10⁻¹¹ m|r = 5.3e-11 m]]. The proton pulls on the electron with an electric force of [[8.2 × 10⁻⁸ N|F = 8.2e-8 N]]. How many revolutions per second does the electron make?`,
 fig: figOrbit('proton','electron',''),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.', explain:'Type powers of ten with the letter e: 9.1 × 10⁻³¹ is typed 9.1e-31.'},
  {type:'mcq', ph:'unknown', prompt:'The answer is asked in rev/s. Which quantity is that?', opts:[o('The frequency f = ω / 2π',1,'One revolution is 2π radians.'),o('The angular velocity ω',0,'ω is in rad/s. You will find it first, then convert.'),o('The period T',0,'The period is seconds per revolution, the inverse of what is asked.')], add:['f = ?'], u:true},
  {type:'mcq', ph:'law', prompt:'Which force is the net force toward the centre?', opts:[o('The electric pull of the proton',1,'It is the only force that matters here.'),o("The electron's weight mg",0,'mg is about 9e-30 N, unimaginably smaller than 8.2e-8 N.'),o('A tension',0,'There is no string.')]},
  {type:'mcq', ph:'law', prompt:'No speed is given, and you want revolutions. Which form of ΣF = ma is best?', opts:[o('F = m ω² r',1,'It contains ω directly.'),o('F = m v² / r',0,'Correct, but you would then need an extra step from v to ω.'),o('F = mg',0,'Gravity is not the force here.')]},
  bl('solve','Solve for ω step by step.',['ω² = F / (m × r)','m × r = {}','ω² = {}','ω = {} rad/s'],[nb(4.823e-41),nb(1.7e33),nb(4.123e16)]),
  {type:'num', ph:'solve', prompt:'Convert to revolutions per second: f = ω / 2π.', sym:'f', unit:'rev/s', ans:6.562e15, slips:[{v:4.123e16,msg:'That is ω in rad/s. Divide by 2π to get revolutions.'}]},
  {type:'mcq', ph:'check', prompt:'About 6.6 × 10¹⁵ revolutions every second. Is such a huge number believable?', opts:[o('Yes: the force is enormous compared with the tiny mass, and the orbit is tiny',1,'a = F/m is about 9 × 10²² m/s².'),o('No: nothing can go around that often',0,'On atomic scales this is normal.'),o('No: it should equal the speed of light',0,'A frequency and a speed are different quantities.')]}
 ]})},
{id:'11c', lv:11, title:'Satellite Skimming the Moon', rnd:true, make:()=>{ const Tm=R(108,112,1), Ts=Tm*60, om=2*Math.PI/Ts, a=om*om*1.74e6; return {
 text:`A satellite orbits the moon [[very near the surface|orbit radius = radius of the moon|hidden]] with a period of [[${Tm} min|T = ${Tm} min]]. The satellite is [[in orbit|gravity is the only force: it is in free fall|hidden]]. What is the free-fall acceleration on the surface of the moon?`,
 fig: figOrbit('Moon','satellite','R = 1.74 × 10⁶ m'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'info', prompt:'One number you need is not in the problem text. Which one?', opts:[o('The radius of the moon, from a table: 1.74 × 10⁶ m',1,'Problems often expect you to look up astronomical data.'),o('The mass of the satellite',0,'It cancels out.'),o('The speed of the satellite',0,'You can get it from r and T.')], add:['r = 1.74e6 m']},
  {type:'mcq', ph:'law', prompt:"Why does the satellite's centripetal acceleration EQUAL the free-fall acceleration at the surface?", opts:[o('Gravity is the only force on it, and it is at (almost) the surface',1,'An orbit is free fall that keeps missing the ground.'),o('Because it moves at constant speed',0,'Constant speed alone says nothing about the size of a.'),o('Because it is weightless',0,'Gravity still pulls on it. That pull is what bends its path.')]},
  bl('info','Convert and compute ω.',['T = {} min × 60 = {} s','ω = 2π / T = {} rad/s','r = {} m'],[nb(Tm),nb(Ts),nb(om),nb(1.74e6)]),
  bl('law','Choose the formula.',['a = ω² × {}'],[sl('r',['T','m','v'])]),
  {type:'num', ph:'solve', prompt:'Calculate the free-fall acceleration.', sym:'g_moon', unit:'m/s²', ans:a, slips:[{v:Math.pow(2*Math.PI/Tm,2)*1.74e6,msg:'Convert the period from minutes to seconds.'}]},
  {type:'mcq', ph:'check', prompt:"Compared with g on Earth (9.8 m/s²), your answer is about…", opts:[o('one sixth',1,'That matches the well-known value for the moon.'),o('six times bigger',0,'Check the size of your number.'),o('the same',0,'The moon is much smaller than Earth.')]}
 ]};}},
{id:'11d', lv:11, title:'Ball in the L-Shaped Track', rnd:true, make:()=>{ const rpm=R(40,90,10), om=rpm*2*Math.PI/60, Fw=0.02*om*om*0.2, Fn=0.196, Fnet=Math.hypot(Fw,Fn); return {
 text:`A [[20 g|m = 20 g = 0.020 kg|hidden]] ball rolls around a [[40 cm-diameter|r = 0.20 m, because the radius is half the diameter|hidden]] L-shaped track at [[${rpm} rpm|${rpm} revolutions per minute]]. [[Rolling friction can be neglected|no friction force|hidden]]. What is the magnitude of the net force that the track exerts on the ball?`,
 fig: figLTrack(),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. One of them is a trap.', explain:'The problem gives the DIAMETER. Circular-motion formulas use the radius.'},
  {type:'mcq', ph:'system', prompt:'The L-shaped track touches the ball in two places. What does each part do?', opts:[o('The floor pushes up; the outer wall pushes toward the centre',1,'Two separate normal forces.'),o('Only the floor pushes on the ball',0,'Then nothing would turn the ball.'),o('Only the wall pushes on the ball',0,'Then nothing would hold up its weight.')]},
  dr('Draw the forces on the ball in the cross-section. The centre of the circle is to the LEFT.',[fo('n₁','floor pushing up',90,1,'Holds up the weight.'),fo('mg','weight',-90,1,'Gravity.'),fo('n₂','wall pushing toward the centre',180,1,'This is the force that turns the ball.'),fo('f','friction',0,0,'Friction is neglected.'),fo('F out','outward force',0,0,'No object pushes the ball outward.')],[['n₁','=','mg','no vertical acceleration']]),
  bl('info','SI units.',['r = {} m','m = {} kg','ω = {} rad/s'],[nb(0.2),nb(0.02),nb(om)]),
  bl('law','One equation for each direction.',['Vertical (a = 0):  n₁ = mg = {} N','Toward the centre:  n₂ = m ω² r = {} N'],[nb(Fn),nb(Fw)]),
  {type:'mcq', ph:'solve', prompt:"The track's two forces are perpendicular. How do you combine them?", opts:[o('Pythagoras: √(n₁² + n₂²)',1,'They are vectors at right angles.'),o('Add them: n₁ + n₂',0,'Only forces along the same line add like that.'),o('Subtract them',0,'They are not opposite.')]},
  {type:'num', ph:'solve', prompt:'Net force of the track on the ball:', sym:'F_track', unit:'N', ans:Fnet, slips:[{v:Fw,msg:"That is only the wall's part. The floor also pushes on the ball."},{v:Fw+Fn,msg:'The two forces are perpendicular: use Pythagoras.'},{v:Math.hypot(Fn,0.02*om*om*0.4),msg:'Use the radius (0.20 m), not the diameter.'}]},
  pr('check','The net force on the ball from ALL forces (track and gravity) is…',[o('just n₂, toward the centre',1),o('the answer you just calculated'),o('zero')],[o('n₁ cancels the weight, leaving only the inward push',1),o('the track is the only thing touching the ball'),o('the speed is constant, so the forces balance')])
 ]};}},

{id:'12a', lv:12, title:'Ferris Wheel and the Bathroom Scale', rnd:true, make:()=>{ const m0=R(50,75,5), a0=R(1,1.6,0.1), mn=Math.round(m0*(9.8-a0)), mx=Math.round(m0*(9.8+a0)), m=(mn+mx)/19.6, a=(mx-mn)/(2*m), v=Math.sqrt(a*16); return {
 text:`A woman rides on a Ferris wheel of radius [[16 m|r = 16 m]] that [[maintains the same speed|uniform circular motion: a = v²/r toward the centre|hidden]]. She sits on a digital bathroom scale and records the scale reading against time (see the graph). The graph has a minimum value of [[${mn} N|n_min = ${mn} N]] and a maximum value of [[${mx} N|n_max = ${mx} N]]. Use [[g = 9.80 m/s²|g = 9.80 m/s²]]. What is the woman's mass?`,

 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'unknown', prompt:'What does the scale actually read?', opts:[o('The normal force n it exerts on her',1,'A scale never measures weight directly.'),o('Her true weight mg',0,'Then the reading would not change during the ride.'),o('Her mass',0,'A scale measures a force.')]},
  pr('sign','Where on the wheel is the reading SMALLEST?',[o('At the top',1),o('At the bottom'),o('Halfway up')],[o('at the top a points down, so mg must be bigger than n',1),o('at the top she is farthest from the Earth'),o('at the bottom the seat is underneath her')]),
  {type:'eq', ph:'law', prompt:'ΣF = ma at the TOP (+ = down, toward the centre):', lhs:2, tiles:['mg','n_min','n_max','ma','0'], ans:['+mg,-n_min=ma']},
  {type:'eq', ph:'law', prompt:'ΣF = ma at the BOTTOM (+ = up, toward the centre):', lhs:2, tiles:['mg','n_min','n_max','ma','0'], ans:['+n_max,-mg=ma']},
  bl('solve','Add the two equations so that ma cancels.',['Top:  n_min = mg − ma','Bottom:  n_max = mg + ma','Add:  n_min + n_max = {} × mg','m = (n_min + n_max) / (2g) = ({} + {}) / {}'],[nb(2),nb(mn),nb(mx),nb(19.6)]),
  {type:'num', ph:'solve', prompt:'Calculate her mass.', sym:'m', unit:'kg', ans:m, slips:[{v:mx/9.8,msg:'That assumes n = mg at the bottom. At the bottom n is bigger than mg.'},{v:mn/9.8,msg:'That assumes n = mg at the top. At the top n is smaller than mg.'}]},
  bl('solve','Now subtract the equations to get more.',['n_max − n_min = {} × ma','a = {} m/s²','v = √(a r) = {} m/s'],[nb(2),nb(a),nb(v)]),
  pr('check','Her true weight mg is…',[o('exactly halfway between the minimum and maximum readings',1),o('equal to the maximum reading'),o('equal to the minimum reading')],[o('the scale reads mg − ma at the top and mg + ma at the bottom',1),o('the scale is most accurate at the bottom'),o('the scale is most accurate at the top')])
 ]};}},
{id:'12b', lv:12, title:'County Fair Ferris Wheel', rnd:true, make:()=>{ const r=R(10,15,1), Tp=R(30,45,1), v=2*Math.PI*r/Tp, a=v*v/r, m=780/9.8, top=m*(9.8-a), bot=m*(9.8+a); return {

  {type:'num', ph:'solve', prompt:'Apparent weight at the bottom: n = mg + ma.', sym:'n_bottom', unit:'N', ans:bot},

 ]};}},

{id:'12d', lv:12, title:'Ball on a String, Vertical Circle', rnd:true, make:()=>{ const vt=R(4,6,0.5), vb=Math.sqrt(vt*vt+4*9.8*1.08), Tt=0.3*vt*vt/1.08-2.94, Tb=0.3*vb*vb/1.08+2.94; return {
 text:`A [[300 g|m = 300 g = 0.300 kg|hidden]] ball moves in a [[vertical circle|a points toward the centre: down at the top, up at the bottom|hidden]] on a [[1.08 m|r = 1.08 m]]-long string. The speed at the top is [[${vt} m/s|v_top = ${vt} m/s]] and the speed at the bottom is [[${f3(vb)} m/s|v_bottom = ${f3(vb)} m/s]]. Find the gravitational force on the ball and the tension in the string at the top and at the bottom.`,

  dr('Draw the free-body diagram at the TOP. The centre of the circle is BELOW the ball.',[fo('T','string pulling toward the centre',-90,1,'A string can only pull, and the centre is below.'),fo('mg','weight',-90,1,'Gravity.'),fo('T↑','string pushing up',90,0,'A string cannot push.'),fo('Fc','"centripetal force"',-90,0,'Not a separate force. It is T + mg.')],[]),

  bl('solve','Substitute for the top.',['T_top = m v² / r − mg','T_top = {} × {}² / {} − {}'],[nb(0.3),nb(vt),nb(1.08),nb(2.94)]),
  {type:'num', ph:'solve', prompt:'Tension at the top:', sym:'T_top', unit:'N', ans:Tt, slips:[{v:0.3*vt*vt/1.08+2.94,msg:'At the top the weight HELPS the string pull toward the centre, so subtract mg.'},{v:0.3*vt*vt/1.08,msg:'Part of mv²/r is supplied by gravity. Subtract mg.'}]},
  dr('Draw the free-body diagram at the BOTTOM. The centre is ABOVE the ball.',[fo('T','string pulling up',90,1,'Toward the centre.'),fo('mg','weight',-90,1,'Gravity.'),fo('Fc','"centripetal force"',90,0,'Not a separate force. It is T − mg.')],[['T','>','mg','the net force must point up, toward the centre']]),
  {type:'eq', ph:'law', prompt:'ΣF = ma at the bottom (+ = up, toward the centre):', lhs:2, tiles:['T','mg','mv²/r','0'], ans:['+T,-mg=mv²/r']},
  {type:'num', ph:'solve', prompt:'Tension at the bottom: T = mv²/r + mg.', sym:'T_bottom', unit:'N', ans:Tb, slips:[{v:0.3*vb*vb/1.08-2.94,msg:'At the bottom the string must ALSO hold up the weight, so add mg.'}]},
  {type:'mcq', ph:'check', prompt:'Why is the tension so much larger at the bottom?', opts:[o('The ball is faster there AND the string must also beat the weight',1,'Two effects in the same direction.'),o('Only because the ball is faster',0,'That is half the story: the sign of mg also flips.'),o('Because gravity is stronger at the bottom',0,'mg is the same everywhere.')]}
 ]};}},
{id:'12e', lv:12, title:'Slowest Swing That Stays Taut', make:()=>({
 text:`You swing a ball of mass [[m|m]] in a vertical circle on a string of length [[L|r = L]]. There is a minimum angular velocity ω_min you must maintain if the ball is to complete the full circle [[without the string going slack at the top|at the limit, T = 0 at the top|hidden]]. Find ω_min, then evaluate it in rpm for a 65 g ball tied to a [[1.2 m|L = 1.2 m]] string.`,
 fig: figVert('slowest here','fastest here','r = L'),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. One number in the text is not needed.', explain:'The 65 g is a distractor: the mass will cancel.'},
  {type:'mcq', ph:'info', prompt:'What is the tension when the string is just about to go slack?', opts:[o('T = 0',1,'"Slack" means the string stops pulling.'),o('T = mg',0,'Slack means no pull at all.'),o('T = mv²/r',0,'That would be the tension if there were no gravity.')], add:['T_top = 0 at the limit']},
  {type:'eq', ph:'law', prompt:'ΣF = ma at the top (+ = down, toward the centre), using a = ω²L:', lhs:2, tiles:['T','mg','mω²L','0'], ans:['+T,+mg=mω²L']},
  bl('solve','Apply the limit.',['Set T = {}','mg = m ω² L, so the {} cancels','ω_min = √( {} / {} )'],[nb(0),sl('mass m',['length L','g']),sl('g',['L','m']),sl('L',['g','m'])]),
  {type:'num', ph:'solve', prompt:'Evaluate ω_min for L = 1.2 m.', sym:'ω_min', unit:'rad/s', ans:Math.sqrt(9.8/1.2)},
  bl('solve','Convert to rpm.',['rpm = ω × 60 / (2π) = {} × 60 / 6.283'],[nb(2.858)]),
  {type:'num', ph:'solve', prompt:'ω_min in revolutions per minute:', sym:'ω_min', unit:'rpm', ans:Math.sqrt(9.8/1.2)*60/(2*Math.PI), slips:[{v:Math.sqrt(9.8/1.2)*60,msg:'Also divide by 2π: one revolution is 2π radians.'},{v:Math.sqrt(9.8/1.2),msg:'That is still in rad/s.'}]},
  pr('check','A heavier ball on the same string needs…',[o('the same ω_min',1),o('a larger ω_min'),o('a smaller ω_min')],[o('the mass cancels: ω_min = √(g/L)',1),o('a heavier ball needs more force, so it must go faster'),o('a heavier ball has more inertia, so it can go slower')]),
  {type:'mcq', ph:'check', prompt:'You swing slower than ω_min. What happens near the top?', opts:[o('Gravity is more than mω²L can use, so the ball falls inside the circle and the string goes slack',1,'The string cannot push outward to compensate.'),o('The string stretches',0,'A slack string has no tension at all.'),o('The ball stops at the top',0,'It still has speed; it just leaves the circular path.')]}
 ]})},

{id:'13a', lv:13, title:'Rocket Puck Off the Table', rnd:true, make:()=>{ const Ft=R(3,5,0.2), d=R(2,3.5,0.1), a=Ft/0.6, ve=Math.sqrt(2*a*d), t=Math.sqrt(2*1.2/9.8), x=ve*t+0.5*a*t*t; return {

  bl('solve','Vertical motion decides the time in the air.',['a_y = {} m/s² downward, and the starting vertical speed is {}','h = ½ g t²,  so  t = √(2 × {} / 9.8)'],[nb(9.8),nb(0),nb(1.2)]),
  {type:'num', ph:'solve', prompt:'Time in the air:', sym:'t', unit:'s', ans:t},
  bl('solve','Horizontal motion during that time.',['x = v_edge t + ½ a t²','x = {} × {} + ½ × {} × {}²'],[nb(ve),nb(t),nb(a),nb(t)]),
  {type:'num', ph:'solve', prompt:'Distance from the base of the table:', sym:'x', unit:'m', ans:x, slips:[{v:ve*t,msg:'That treats the puck as an ordinary projectile. The rocket is still pushing, so add ½at².'}]},
  pr('check','Does the thrust change how long the puck takes to fall?',[o('No',1),o('Yes, it falls sooner'),o('Yes, it stays up longer')],[o('the thrust is horizontal, and the vertical motion depends only on vertical forces',1),o('a faster object falls faster'),o('the rocket holds the puck up')])

{id:'14a', lv:14, title:'Example 1A: Uniform Circular Motion', rnd:true, make:()=>{ const v=R(2,5,0.5), r=R(0.4,1,0.1), ar_=v*v/r, T=0.5*ar_; return {

  bl('law','The parts of the acceleration.',['Radial (centripetal):  a_r = v² / r = {}² / {} = {} m/s², pointing {}','Tangential:  a_t = {} m/s², because the speed is {}','Total acceleration:  a = {} m/s², pointing {}'],[nb(v),nb(r),nb(ar_),sl('toward the centre',['along v','away from the centre']),nb(0),sl('constant',['increasing','decreasing']),nb(ar_),sl('toward the centre',['along v','away from the centre'])]),
  {type:'mcq', ph:'law', prompt:'What "produces" this acceleration?', opts:[o('The tension in the string',1,'It is the only force with a part toward the centre.'),o('The velocity of the block',0,'Velocity is not a force. Only forces produce acceleration.'),o('A separate centripetal force',0,'"Centripetal" is just the name for the net inward force. Here that is the tension.'),o('The normal force of the table',0,'It is vertical and cancels the weight.')]},
  dr('Draw the free-body diagram in the SIDE VIEW. The centre of the circle is to the LEFT.',[fo('n','table pushing up',90,1,'Contact with the table.'),fo('mg','weight',-90,1,'Gravity.'),fo('T','string pulling toward the centre',180,1,'The only horizontal force.'),fo('Fc','"centripetal force"',180,0,'Not a separate force. The tension IS the centripetal force.'),fo('F out','outward force',0,0,'No object pushes the block outward.')],[['n','=','mg','no acceleration along z']]),
  bl('law',"Newton's 2nd law along each axis (r toward the centre, t along the motion, z up).",['r:  {} = m v² / r','t:  ΣF_t = {}','z:  n − mg = {}'],[sl('T',['n','mg','T − mg']),nb(0),nb(0)]),
  {type:'num', ph:'solve', prompt:'Calculate the tension.', sym:'T', unit:'N', ans:T},
  pr('check','Is the net force constant?',[o('No: its size is constant but its direction keeps changing',1),o('Yes'),o('No: its size keeps changing')],[o('it always points at the centre, and that direction rotates as the block moves',1),o('the speed is constant, so the force is constant'),o('the string stretches and relaxes each lap')])

  {type:'mcq', ph:'sign', prompt:'The total acceleration is the vector sum of the two parts. It points…', opts:[o('inward and forward, between the centre direction and v',1,'Neither part is zero.'),o('exactly at the centre',0,'That is only true when the speed is constant.'),o('exactly along v',0,'Then the ball would not turn.')]},

  bl('law',"Newton's 2nd law on each axis.",['r:  ΣF_r = m a_r = m v² / {} = m {}² r','t:  ΣF_t = m {}','z:  ΣF_z = {}, because the object stays in the plane of the circle'],[sl('r',['T','m']),sl('ω',['v','α']),sl('a_t',['a_r','g']),nb(0)]),

  dr('Draw the free-body diagram in the SIDE VIEW. The wall is on the right; the axis (centre) is to the LEFT.',[fo('n','wall pushing toward the axis',180,1,'The centripetal force here.'),fo('fₛ','static friction, up the wall',90,1,'It stops the leaf from sliding down.'),fo('mg','weight',-90,1,'Gravity.'),fo('F out','centrifugal force, outward',0,0,'Not a real force. The leaf presses on the wall because it would otherwise go straight.')],[['fₛ','=','mg','no acceleration along z']]),
  bl('law',"Newton's 2nd law on each axis.",['r:  {} = m ω² r','z:  {} − mg = 0','No sliding requires fₛ ≤ μₛ × {}'],[sl('n',['fₛ','mg']),sl('fₛ',['n','mg']),sl('n',['mg','fₛ'])]),
  {type:'mcq', ph:'check', prompt:'Why does the water leave through the holes in the basket?', opts:[o('At a hole there is no wall to push the water inward, so it keeps going straight along the tangent',1,'No inward force, no circular motion.'),o('A centrifugal force throws it straight outward',0,'Seen from above, the drops leave along the tangent, not straight outward.'),o('Water is lighter than lettuce',0,'Mass does not decide this.')]}

{id:'16a', lv:16, title:'Example 3: Ball on a String (Conical Pendulum)', rnd:true, make:()=>{ const L=R(1,1.6,0.1), th=R(35,55,1), m=R(2,7,0.5), T=m*9.8/cosD(th), a=9.8*Math.tan(th*Math.PI/180), r=L*sinD(th), v=Math.sqrt(a*r); return {
 text:`A ball is attached to a string and moves in a [[horizontal circle|a points horizontally toward the centre|hidden]] in [[UCM|uniform circular motion: a_t = 0|hidden]]. The string has length [[L = ${L} m|L = ${L} m]], the ball has mass [[m = ${m} kg|m = ${m} kg]], and the angle between the string and the vertical is [[θ = ${th}°|θ = ${th}°]]. Find the tension, the centripetal acceleration and the speed of the ball.`,
 fig: figCone(L,th) + figTop({ar:true}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'info', prompt:'What is the radius of the circle?', opts:[o('r = L sin θ',1,'The horizontal distance from the ball to the vertical line under the pivot.'),o('r = L',0,'L is the string, which is tilted. The circle is smaller.'),o('r = L cos θ',0,'That is the vertical drop below the pivot.')], add:['r = L sin θ']},
  dr('Draw the free-body diagram in the SIDE VIEW. The centre of the circle is to the RIGHT of the ball.',[fo('T','string pulling along the string',90-th,1,'Up and toward the centre.'),fo('mg','weight',-90,1,'Gravity.'),fo('Fc','"centripetal force"',0,0,'Not a separate force. It is the horizontal part of T.'),fo('F out','outward force',180,0,'No object pushes the ball outward.')],[['T','>','mg','only the vertical part of T holds up the weight: T cos θ = mg']]),
  bl('law',"Newton's 2nd law on each axis.",['z:  T {} θ − mg = 0','r:  T {} θ = m a_r'],[SC('cos'),SC('sin')]),
  bl('solve','Tension from the z equation.',['T = mg / cos θ = {} × 9.8 / cos({}°)'],[nb(m),nb(th)]),
  {type:'num', ph:'solve', prompt:'Calculate the tension.', sym:'T', unit:'N', ans:T, slips:[{v:m*9.8*cosD(th),msg:'Divide by cos θ: T cos θ = mg.'},{v:m*9.8,msg:'That is the weight. The tilted string must pull harder than mg.'}]},
  bl('solve','Divide the r equation by the z equation.',['a_r = g {} θ'],[sl('tan',['sin','cos'])]),
  {type:'num', ph:'solve', prompt:'Calculate the centripetal acceleration.', sym:'a_r', unit:'m/s²', ans:a},
  bl('solve','Speed from a_r = v² / r.',['r = L sin θ = {} m','v = √(a_r × r)'],[nb(r)]),
  {type:'num', ph:'solve', prompt:'Calculate the speed.', sym:'v', unit:'m/s', ans:v, slips:[{v:Math.sqrt(a*L),msg:'Use the radius r = L sin θ, not the string length L.'}]},
  pr('check','If the ball is made to go faster, the angle θ…',[o('increases: the string swings out more',1),o('decreases'),o('stays the same')],[o('a_r = g tan θ must grow, so tan θ grows',1),o('a faster ball pulls the string straighter down'),o('the angle depends only on the length')])
 ]};}},
{id:'16b', lv:16, title:'Example 4: Cannonball Around the Earth', make:()=>({
 text:`You stand on a mountain and shoot a cannonball [[horizontally|v is tangent to the Earth: the start of a circular orbit|hidden]]. [[Ignore air resistance|gravity is the only force|hidden]]. At what speed must you shoot so that it flies around the Earth in circular motion? Use [[R = 6400 km|r = 6400 km = 6.4e6 m|hidden]] and [[g = 10 m/s²|g = 10 m/s²]].`,

 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues. Watch the units.'},
  {type:'fbd', ph:'fbd', prompt:'Click the forces on the cannonball while it is in flight.', forces:[{l:'Weight mg, toward the centre of the Earth',a:-90,ok:1,why:'Gravity is the only force.'},{l:'Force of the cannon',a:0,ok:0,why:'The cannon stopped pushing when the ball left the barrel.'},{l:'Centrifugal force, outward',a:90,ok:0,why:'Not a real force.'},{l:'Normal force',a:90,ok:0,why:'Nothing touches the ball.'}]},
  {type:'eq', ph:'law', prompt:'ΣF = ma along r (toward the centre of the Earth):', lhs:1, tiles:['mg','n','F_cannon'], rhs:['mv²/r','0'], ans:['+mg=mv²/r']},
  bl('solve','Solve for v.',['The mass cancels:  v = √(g × r)','r = {} m','v = √({} × {})'],[nb(6.4e6),nb(10),nb(6.4e6)]),
  {type:'num', ph:'solve', prompt:'Calculate the speed.', sym:'v', unit:'m/s', ans:8000, slips:[{v:Math.sqrt(64000),msg:'Convert 6400 km to metres first.'}]},
  bl('check','Get a feeling for the answer.',['In km/s:  {} km/s','Time for one trip around:  T = 2πr / v = {} s, which is about {} minutes'],[nb(8),nb(5027),nb(84)]),
  {type:'mcq', ph:'check', prompt:'If you shoot slower than this, the cannonball…', opts:[o('hits the ground: gravity bends its path more sharply than the Earth curves away',1,'An orbit is a fall that keeps missing the ground.'),o('still orbits, only more slowly',0,'A circular orbit at this radius needs exactly this speed.'),o('flies off into space',0,'That would need a higher speed, not a lower one.')]}
 ]})},
{id:'16c', lv:16, title:'Example 5: Penny Flies Off the Ruler', rnd:true, make:()=>{ const rc=R(8,12,1), r=rc/100, Tp=R(0.8,1.2,0.05), om=2*Math.PI/Tp, mu=om*om*r/9.8; return {
 text:`A penny is placed on a rotating aluminum ruler, [[${rc} cm|r = ${rc} cm = ${r} m|hidden]] from the axis. The apparatus is slowly sped up. At the [[maximum rotation rate|static friction is at its maximum: fₛ = μₛ n|hidden]] (the penny has "just" flown off) you measure the rotation period [[T = ${Tp} s|T = ${Tp} s]]. Find the coefficient of static friction.`,
 fig: figRuler() + figTop({ar:true}),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  {type:'mcq', ph:'info', prompt:'The worksheet asks: knowing only the period T, can you find μₛ?', opts:[o('No: you also need the distance r of the penny from the axis',1,'The mass is not needed, but r is. Here it has been measured for you.'),o('Yes, T is enough',0,'The friction needed is mω²r, which depends on r.'),o('No: you need the mass of the penny',0,'The mass will cancel.')]},
  dr('Draw the free-body diagram in the SIDE VIEW. The axis (centre) is to the LEFT.',[fo('n','ruler pushing up',90,1,'Contact.'),fo('mg','weight',-90,1,'Gravity.'),fo('fₛ','static friction toward the centre',180,1,'The force that turns the penny.'),fo('F out','outward force',0,0,'No object pushes the penny outward. It "flies off" along the tangent when friction is not enough.')],[['n','=','mg','no acceleration along z']]),
  bl('law',"Newton's 2nd law, and the limit.",['r:  fₛ = m ω² r','z:  n = {}','At the maximum rate:  fₛ = {} × n'],[sl('mg',['mω²r','μₛ']),sl('μₛ',['m','g'])]),
  bl('solve','Combine.',['μₛ m g = m ω² r, so the {} cancels','μₛ = ω² r / {}','ω = 2π / T = {} rad/s'],[sl('mass',['radius','period']),sl('g',['m','T']),nb(om)]),
  {type:'num', ph:'solve', prompt:'Calculate μₛ.', sym:'μₛ', unit:'(no units)', ans:mu, slips:[{v:om*om*rc/9.8,msg:'Use r in metres.'}]},
  pr('check','A heavier coin at the same spot flies off…',[o('at the same rotation rate',1),o('at a lower rate'),o('at a higher rate')],[o('the mass cancels: both the friction available and the force needed scale with m',1),o('a heavier coin has more friction'),o('a heavier coin needs more force')]),
  pr('check','A penny placed farther from the axis flies off…',[o('at a lower rotation rate',1),o('at a higher rotation rate'),o('at the same rate')],[o('the force needed, mω²r, grows with r while the friction available stays μₛmg',1),o('the outer end of the ruler moves more slowly'),o('distance from the axis does not matter')])
 ]};}},
{id:'16d', lv:16, title:'Example 6: The Spinning Toy', make:()=>({
 text:`A child's toy consists of a rotating bar and a small block of mass [[m|m]] that rests on it. The bar is inclined at [[θ = 25°|θ = 25°]], and the coefficient of static friction is [[μₛ = 0.87|μₛ = 0.87]]. The block [[spins in a horizontal circle|a is horizontal, toward the axis|hidden]] of radius [[r = 0.15 m|r = 0.15 m]]. The bar rotates at the [[maximum constant speed for which the block remains on the bar|friction is at its maximum, fₛ = μₛ n|hidden]]. Show that the period of rotation is 0.518 s.`,
 fig: figToy(25),
 steps:[
  {type:'clue', ph:'info', prompt:'Collect the clues.'},
  pr('sign','At the MAXIMUM speed, the block is about to slide…',[o('up the bar, outward',1),o('down the bar, inward')],[o('going too fast, it needs more inward force than it can get, so it drifts outward, which is up the incline',1),o('gravity always pulls a block down an incline'),o('spinning pushes things toward the axis')]),
  {type:'mcq', ph:'fbd', prompt:'So the static friction on the block points…', opts:[o('down the incline, toward the axis',1,'Friction opposes the slipping that is about to happen.'),o('up the incline, away from the axis',0,'That would be the case at the MINIMUM speed, when the block is about to slide down.'),o('horizontally',0,'Friction acts along the surface.')]},
  dr('Draw the free-body diagram in the SIDE VIEW. The axis (centre) is to the LEFT; the bar rises to the right.',[fo('n','bar pushing perpendicular to its surface',115,1,'Tilted toward the axis.'),fo('mg','weight',-90,1,'Straight down.'),fo('fₛ','static friction, down the incline',205,1,'Opposes sliding up and outward.'),fo('f up','friction up the incline',25,0,'That is the direction at the minimum speed, not the maximum.'),fo('Fc','"centripetal force"',180,0,'Not a separate force. It is the horizontal parts of n and fₛ.')],[['n','>','mg','n must hold up the weight AND the downward part of the friction']],{slope:25}),
  bl('law',"Newton's 2nd law with r horizontal and z vertical.",['r:  n {} θ + fₛ {} θ = m ω² r','z:  n {} θ − fₛ {} θ − mg = 0','At the limit:  fₛ = {} n'],[SC('sin'),SC('cos'),SC('cos'),SC('sin'),sl('μₛ',['m','g'])]),
  bl('solve','Put fₛ = μₛ n into both equations and divide r by z. Then n and m cancel.',['ω² r / g = (sin θ + μₛ cos θ) / (cos θ − μₛ sin θ)','Top:  sin 25° + 0.87 × cos 25° = {}','Bottom:  cos 25° − 0.87 × sin 25° = {}','Ratio = {}'],[nb(1.211),nb(0.5386),nb(2.249)]),
  bl('solve','Solve for ω.',['ω² = 9.8 × {} / 0.15 = {}','ω = {} rad/s'],[nb(2.249),nb(146.9),nb(12.12)]),
  {type:'num', ph:'solve', prompt:'Period: T = 2π / ω.', sym:'T', unit:'s', ans:0.5184, slips:[{v:12.12,msg:'That is ω. The period is 2π / ω.'}]},
  {type:'mcq', ph:'check', prompt:'The mass of the block never appeared in the answer. Why?', opts:[o('Every term in both equations is proportional to m, so it cancels',1,'Weight, normal force, friction and mω²r all scale with m.'),o('The block is too small to matter',0,'Any size of block gives the same period.'),o('It was forgotten',0,'It cancelled exactly.')]}
 ]})},

{id:'17a', lv:17, title:'Ball Leaving the Semicircular Chute', make:()=>({
 text:`A ball is launched up a [[semicircular chute|radius R; the top is 2R above the ground (figure)|hidden]] so that at the top of the chute, [[just before it goes into free fall|after the top, gravity is the only force: projectile|hidden]], the ball has a centripetal acceleration of magnitude [[2g|a_r = v²/R = 2g]]. At the top it moves [[horizontally|v₀ is horizontal, v_y0 = 0|hidden]]. How far from the bottom of the chute does the ball land?`,

  {type:'clue', ph:'info', prompt:'Collect the clues. The height comes from the figure.', explain:'Two stages: circular motion tells you the speed at the top; projectile motion tells you how far it flies.'},
  {type:'mcq', ph:'info', prompt:'How high above the ground is the ball when it leaves the chute?', opts:[o('2R, the diameter',1,'The figure labels it.'),o('R',0,'The top of a semicircle is a full diameter above the bottom.'),o('It is not given',0,'Look at the figure.')], add:['h = 2R']},

  bl('solve','Stage 2: time to fall 2R from rest vertically.',['2R = ½ g t²','t² = {} R / g'],[nb(4)]),
  bl('solve','Horizontal distance.',['D = v t, so D² = v² t² = (2gR) × (4R/g) = {} R²','D = √{} × R = {} R'],[nb(8),nb(8),nb(2.828)]),
  {type:'num', ph:'solve', prompt:'Enter D as a multiple of R (the number in front of R).', sym:'D / R', unit:'', ans:2*Math.SQRT2, slips:[{v:2,msg:'That would be a fall of only R. The drop is 2R.'},{v:Math.sqrt(2)*2*2,msg:'Check: D² = 8R², so D = √8 R.'}], explain:'D = 2√2 R ≈ 2.83 R. Type 2*sqrt(2)*R in Mastering.'},
  pr('check','Notice that g cancelled out. On the moon the ball would land…',[o('at the same distance',1),o('farther away'),o('closer')],[o('with a_r = 2g fixed, a weaker g means a slower launch AND a slower fall, and the two effects cancel',1),o('weaker gravity always means a longer flight'),o('weaker gravity means a shorter flight')])
 ]})},
{id:'17b', lv:17, title:'Cylinder on a Turntable', rnd:true, make:()=>{ const mu=R(0.06,0.12,0.01), r=R(0.1,0.25,0.05), v=Math.sqrt(mu*9.8*r); return {
 text:`A small metal cylinder rests on a circular turntable rotating at [[constant speed|a_t = 0; a = v²/r toward the centre|hidden]]. The cylinder has a mass of [[0.20 kg|m = 0.20 kg]], the coefficient of [[static friction|the cylinder does not slip, and at v_max friction is at its limit μₛn|hidden]] between the cylinder and the turntable is [[${mu}|μₛ = ${mu}]], and the cylinder is [[${r} m from the center|r = ${r} m]]. Take g = 9.8 m/s². What is the maximum speed the cylinder can have without slipping off?`,

  {type:'mcq', ph:'check', prompt:'Which given value was NOT needed?', opts:[o('The mass, 0.20 kg',1,'It cancels: both the friction available and the force needed are proportional to m.'),o('The radius',0,'v_max depends on r.'),o('μₛ',0,'μₛ sets how much friction is available.')]}

{id:'17c', lv:17, title:'Car Speeding Up on a Round Track', rnd:true, make:()=>{ const at=R(0.8,2,0.2), v=Math.sqrt(at*140), t=v/at; return {

  bl('solve','Find the speed when the two are equal.',['v² / r = a_t, so v = √(a_t × r) = √({} × {})'],[nb(at),nb(140)]),

{id:'17d', lv:17, title:'Loop-the-Loop at Twice the Critical Speed', make:()=>({

  {type:'eq', ph:'law', prompt:'ΣF along r (+ = down, toward the centre):', lhs:2, tiles:['n','mg','mv²/r','0'], ans:['+n,+mg=mv²/r']},

  {type:'mcq', ph:'solve', prompt:'The ratio n / F_G is…', opts:[o('3',1,'n = 3mg.'),o('4',0,'That is mv²/r. Part of it is supplied by gravity.'),o('2',0,'The speed doubles, but v is squared.'),o('5',0,'At the top, n and mg point the same way, so subtract mg from 4mg.')]},

{id:'17e', lv:17, title:'Weighing Yourself at the Pole and the Equator', make:()=>({
 text:`An [[83 kg|m = 83 kg]] man weighs himself at the north pole and at the equator. Assume the Earth is [[perfectly spherical|the same g and R everywhere|hidden]]. The Earth [[turns once a day|T = 24 h = 86 400 s|hidden]], so at the equator he moves in a circle of radius R = 6.37 × 10⁶ m, while at the pole he just turns on the spot.`,

  bl('solve','How much smaller is the equator reading?',['ω = 2π / 86 400 = {} rad/s','ω² R = {} m/s²'],[nb(7.272e-5),nb(0.0337)]),
  {type:'num', ph:'solve', prompt:'Difference in scale reading: Δw = m ω² R.', sym:'Δw', unit:'N', ans:83*Math.pow(2*Math.PI/86400,2)*6.37e6, slips:[{v:83*Math.pow(2*Math.PI/24,2)*6.37e6,msg:'Convert 24 hours to seconds.'}]},
